  const open = (cx, cy, dx, dy) => { const nx = cx + dx, ny = cy + dy; return nx >= 0 && ny >= 0 && nx < C && ny < R && !at(nx, ny); };
  function stepEntity(e, speed){
    if (aligned(e)){
      const [cx, cy] = cellOf(e);
      if (e.wx !== undefined && (e.wx || e.wy) && open(cx, cy, e.wx, e.wy)){ e.dx = e.wx; e.dy = e.wy; }
      if (!open(cx, cy, e.dx, e.dy)){ e.dx = 0; e.dy = 0; }
    }
    e.x += e.dx * speed; e.y += e.dy * speed;
  }
  function ghostThink(gh){
    if (!aligned(gh)) return;
    const [cx, cy] = cellOf(gh);
    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => open(cx, cy, dx, dy) && !(dx === -gh.dx && dy === -gh.dy));
    const use = opts.length ? opts : [[-gh.dx, -gh.dy]];
    const tx = gh.eaten ? gh.home[0] : me.x, ty = gh.eaten ? gh.home[1] : me.y;
    let best = use[0], bestD = fright > 0 && !gh.eaten ? -Infinity : Infinity;
    for (const [dx, dy] of use){
      const d = Math.hypot((cx + dx) * S - tx, (cy + dy) * S - ty) + Math.random() * 20;
      if (fright > 0 && !gh.eaten ? d > bestD : d < bestD){ bestD = d; best = [dx, dy]; }
    }
    gh.dx = best[0]; gh.dy = best[1];
  }
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t; frame += k;
    if (state === 'play'){
      const steps = Math.round(k) || 1;
      for (let s = 0; s < steps; s++){
        stepEntity(me, 2);
        const [cx, cy] = [Math.round(me.x / S), Math.round(me.y / S)];
        const key = cy * C + cx;
        if (aligned(me)){
          if (pellets.delete(key)){ score += 10; api.score(score); }
          if (power.delete(key)){ score += 50; fright = 420; ghosts.forEach(gh => { gh.eaten = false; }); api.score(score); }
        }
        ghosts.forEach(gh => {
          ghostThink(gh);
          stepEntity(gh, gh.eaten ? 3 : fright > 0 ? 1 : 2 + Math.min(1, level * 0.1));
          if (gh.eaten && Math.abs(gh.x - gh.home[0]) < 4 && Math.abs(gh.y - gh.home[1]) < 4) gh.eaten = false;
        });
        if (fright > 0) fright -= 1;
        for (const gh of ghosts){
          if (Math.hypot(gh.x - me.x, gh.y - me.y) > 14) continue;
          if (gh.eaten) continue;
          if (fright > 0){ gh.eaten = true; score += 200; api.score(score); }
          else {
            lives--;
            if (lives <= 0){ state = 'over'; draw(); api.over(score); return; }
            reset(true);
            break;
          }
        }
        if (!pellets.size){ level++; score += 200; api.score(score); reset(false); break; }
      }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = col.wall;
    for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) if (at(x, y)){ rr(g, x * S + 1, y * S + 1, S - 2, S - 2, 5); g.fill(); }
    g.fillStyle = col.dot;
    pellets.forEach(i => { g.beginPath(); g.arc((i % C) * S + S / 2, Math.floor(i / C) * S + S / 2, 2.5, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = tok('--tomato');
    power.forEach(i => { g.beginPath(); g.arc((i % C) * S + S / 2, Math.floor(i / C) * S + S / 2, 6, 0, Math.PI * 2); g.fill(); });
    const mouth = Math.abs(Math.sin(frame * 0.14)) * 0.5 + 0.06;
    const ang = Math.atan2(me.dy, me.dx);
    g.fillStyle = col.me; g.beginPath();
    g.moveTo(px(me), py(me));
    g.arc(px(me), py(me), S / 2 - 2, ang + mouth, ang - mouth);
    g.closePath(); g.fill();
    ghosts.forEach(gh => {
      g.fillStyle = gh.eaten ? col.scared : fright > 0 ? (fright < 120 && Math.floor(frame / 8) % 2 ? '#fff' : col.scared) : gh.col;
      const x = px(gh), y = py(gh), r = S / 2 - 2;
      g.beginPath(); g.arc(x, y - 1, r, Math.PI, 0); g.lineTo(x + r, y + r);
      for (let i = 0; i < 3; i++) g.lineTo(x + r - (i + 0.5) * (2 * r / 3), y + r - (i % 2 ? 0 : 5));
      g.lineTo(x - r, y + r); g.closePath(); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 4, y - 3, 3.2, 0, 7); g.arc(x + 4, y - 3, 3.2, 0, 7); g.fill();
      g.fillStyle = '#231B4E'; g.beginPath(); g.arc(x - 4 + gh.dx * 1.4, y - 3 + gh.dy * 1.4, 1.6, 0, 7); g.arc(x + 4 + gh.dx * 1.4, y - 3 + gh.dy * 1.4, 1.6, 0, 7); g.fill();
    });
    g.fillStyle = col.ink; g.font = `700 14px ${FONT}`; g.textBaseline = 'top';
    g.textAlign = 'left'; g.fillText(`Lives ${'●'.repeat(Math.max(0, lives))}`, 8, 4);
    g.textAlign = 'right'; g.fillText(`Level ${level}`, W - 8, 4);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Arrow keys or swipe to move', col.ink, col.card);
  }
  function want(dx, dy){ if (state === 'ready') state = 'play'; me.wx = dx; me.wy = dy; }
  api.on(window, 'keydown', e => { const d = DIRS[e.code]; if (d){ e.preventDefault(); want(d[0], d[1]); } });
  api.swipe(c, want);
  reset(false); api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Lunar Lander ---------- */
function landerGame(stage, api){
  const W = 480, H = 360;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {bg:tok('--cell'), ground:tok('--board'), pad:tok('--mint'), ship:tok('--blue'), flame:tok('--tomato'), ink:tok('--ink'), card:tok('--card'), edge:tok('--edge')};
  let terrain = [], pads = [], ship, fuel = 600, score = 0, lives = 3, level = 1, state = 'ready', raf, last = 0, msg = '';
  const keys = {l:false, r:false, up:false};
  let ptr = null;
  function makeTerrain(){
    terrain = []; pads = [];
    let y = H - 60;
    for (let x = 0; x <= W; x += 20){
      y += (Math.random() - 0.5) * (14 + level * 5);
      y = Math.max(H - 150, Math.min(H - 25, y));
      terrain.push({x, y});
    }
    const count = Math.max(1, 3 - Math.floor(level / 2));
    for (let p = 0; p < count; p++){
      const i = 2 + rand(terrain.length - 5);
      const flat = terrain[i].y;
      terrain[i + 1].y = flat;
      pads.push({x1:terrain[i].x, x2:terrain[i + 1].x, y:flat, bonus:count === 1 ? 200 : 100});
    }
  }
  function reset(full){
    if (full) makeTerrain();
    ship = {x:60 + Math.random() * (W - 120), y:40, vx:(Math.random() - 0.5) * 1.6, vy:0.2, a:0};
    fuel = Math.max(320, 620 - level * 40);
    msg = '';
  }
  const groundY = x => {
    const i = Math.max(0, Math.min(terrain.length - 2, Math.floor(x / 20)));
    const a = terrain[i], b = terrain[i + 1];
    return a.y + (b.y - a.y) * ((x - a.x) / 20);
  };
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    if (state === 'play'){
      let thrust = keys.up;
      if (ptr){
        if (ptr.x < W * 0.3) ship.a -= 0.045 * k;
        else if (ptr.x > W * 0.7) ship.a += 0.045 * k;
        else thrust = true;
      }
      if (keys.l) ship.a -= 0.045 * k;
      if (keys.r) ship.a += 0.045 * k;
      ship.a = Math.max(-1.2, Math.min(1.2, ship.a));
      if (thrust && fuel > 0){
        fuel -= 1.6 * k;
        ship.vx += Math.sin(ship.a) * 0.075 * k;
        ship.vy -= Math.cos(ship.a) * 0.075 * k;
      }
      ship.thrusting = thrust && fuel > 0;
      ship.vy += 0.032 * k;
      ship.x += ship.vx * k; ship.y += ship.vy * k;
      if (ship.x < 0) ship.x = W; if (ship.x > W) ship.x = 0;
      const gy = groundY(ship.x);
      if (ship.y + 10 >= gy){
        const pad = pads.find(p => ship.x > p.x1 && ship.x < p.x2);
        const ok = pad && Math.abs(ship.vy) < 1.3 && Math.abs(ship.vx) < 0.7 && Math.abs(ship.a) < 0.3;
        if (ok){
          score += Math.round(pad.bonus + fuel / 4); api.score(score);
          level++; msg = 'Nice landing!'; state = 'landed';
          setTimeout(() => { if (state === 'landed'){ reset(true); state = 'play'; } }, 1400);
        } else {
          lives--;
          msg = pad ? 'Too fast or too tilted.' : 'You need to land on a flat green pad.';
          if (lives <= 0){ state = 'over'; draw(); api.over(score); return; }
          state = 'crashed';
          setTimeout(() => { if (state === 'crashed'){ reset(false); state = 'play'; } }, 1400);
        }
        ship.y = gy - 10; ship.vx = ship.vy = 0;
      }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = col.ground;
    g.beginPath(); g.moveTo(0, H);
    terrain.forEach(p => g.lineTo(p.x, p.y));
    g.lineTo(W, H); g.closePath(); g.fill();
    pads.forEach(p => { g.fillStyle = col.pad; g.fillRect(p.x1, p.y - 3, p.x2 - p.x1, 6); });
    g.save(); g.translate(ship.x, ship.y); g.rotate(ship.a);
    if (ship.thrusting && state === 'play'){ g.fillStyle = col.flame; g.beginPath(); g.moveTo(-5, 8); g.lineTo(0, 16 + Math.random() * 7); g.lineTo(5, 8); g.fill(); }
    g.fillStyle = col.ship;
    g.beginPath(); g.moveTo(0, -11); g.lineTo(8, 5); g.lineTo(-8, 5); g.closePath(); g.fill();
    g.fillRect(-9, 5, 4, 6); g.fillRect(5, 5, 4, 6);
    g.restore();
    g.fillStyle = col.ink; g.font = `700 14px ${FONT}`; g.textBaseline = 'top'; g.textAlign = 'left';
    g.fillText(`Fuel ${Math.max(0, Math.round(fuel))}`, 10, 10);
    g.fillText(`Speed ${Math.abs(ship.vy).toFixed(1)}`, 10, 28);
    g.textAlign = 'right'; g.fillText(`Ships ${'●'.repeat(Math.max(0, lives))}  Pad ${level}`, W - 10, 10);
    g.textBaseline = 'middle';
    if (msg) pill(g, W, H, msg, col.ink, col.card);
    else if (state === 'ready') pill(g, W, H, 'Up to fire the engine, left and right to tilt', col.ink, col.card);
  }
  const begin = () => { if (state === 'ready') state = 'play'; };
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; e.preventDefault(); begin(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; e.preventDefault(); begin(); }
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space'){ keys.up = true; e.preventDefault(); begin(); }
  });
  api.on(window, 'keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
  });
  api.on(c, 'pointerdown', e => { e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch {} ptr = toLocal(c, e); begin(); });
  api.on(c, 'pointermove', e => { if (ptr) ptr = toLocal(c, e); });
  api.on(c, 'pointerup', () => { ptr = null; });
  api.on(c, 'pointercancel', () => { ptr = null; });
  reset(true); api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Ski Slalom ---------- */
function skiGame(stage, api){
  const W = 360, H = 480;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {snow:tok('--cell'), ink:tok('--ink'), card:tok('--card'), tree:tok('--mint'), rock:tok('--board'), me:tok('--tomato'), flagA:tok('--blue'), flagB:tok('--tomato')};
  const me = {x:W / 2, y:H - 110, w:18, h:24};
  let items = [], speed = 3.2, dist = 0, score = 0, state = 'ready', raf, last = 0, nextGate = 120, keys = {l:false, r:false}, ptr = null;
  function spawn(){
    const gap = Math.max(70, 130 - score * 1.5);
    const cx = 50 + Math.random() * (W - 100);
    items.push({type:'gate', x:cx, y:-20, gap, passed:false});
    const n = 1 + rand(3);
    for (let i = 0; i < n; i++){
      const x = 14 + Math.random() * (W - 28);
      if (Math.abs(x - cx) < gap / 2 + 20) continue;
      items.push({type: Math.random() < 0.75 ? 'tree' : 'rock', x, y:-20 - Math.random() * 90});
    }
    nextGate = 150 + Math.random() * 60;
  }
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    if (state === 'play'){
      speed = Math.min(9, 3.2 + dist / 1400);
      dist += speed * k;
      if (keys.l) me.x -= 4.6 * k;
      if (keys.r) me.x += 4.6 * k;
      if (ptr !== null) me.x += Math.max(-6 * k, Math.min(6 * k, ptr - me.x));
      me.x = Math.max(12, Math.min(W - 12, me.x));
      nextGate -= speed * k;
      if (nextGate <= 0) spawn();
      for (const it of items) it.y += speed * k;
      for (const it of items){
        if (it.type === 'gate'){
          if (!it.passed && it.y > me.y){
            it.passed = true;
            if (Math.abs(me.x - it.x) < it.gap / 2){ score++; api.score(score); it.ok = true; }
          }
          continue;
        }
        if (Math.abs(it.x - me.x) < 14 && Math.abs(it.y - me.y) < 18){ state = 'over'; draw(); api.over(score); return; }
      }
      items = items.filter(it => it.y < H + 40);
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.snow; g.fillRect(0, 0, W, H);
    g.fillStyle = 'rgba(0,0,0,.05)';
    for (let i = 0; i < 6; i++){ const y = (i * 90 - dist % 90 + 90) % (H + 90) - 45; g.fillRect(0, y, W, 2); }
    items.forEach(it => {
      if (it.type === 'gate'){
        [[-1, col.flagA], [1, col.flagB]].forEach(([s, cc]) => {
          const x = it.x + s * it.gap / 2;
          g.strokeStyle = col.ink; g.lineWidth = 2;
          g.beginPath(); g.moveTo(x, it.y); g.lineTo(x, it.y + 22); g.stroke();
          g.fillStyle = it.ok ? tok('--mint') : cc;
          g.beginPath(); g.moveTo(x, it.y); g.lineTo(x + s * 14, it.y + 5); g.lineTo(x, it.y + 11); g.fill();
        });
      } else if (it.type === 'tree'){
        g.fillStyle = '#7A4418'; g.fillRect(it.x - 2, it.y + 6, 4, 10);
        g.fillStyle = col.tree;
        g.beginPath(); g.moveTo(it.x, it.y - 14); g.lineTo(it.x + 11, it.y + 8); g.lineTo(it.x - 11, it.y + 8); g.closePath(); g.fill();
      } else {
        g.fillStyle = col.rock; g.beginPath(); g.ellipse(it.x, it.y, 11, 8, 0, 0, Math.PI * 2); g.fill();
      }
    });
    g.fillStyle = col.me;
    rr(g, me.x - me.w / 2, me.y - me.h / 2, me.w, me.h, 7); g.fill();
    g.fillStyle = col.ink;
    g.fillRect(me.x - 9, me.y + 12, 5, 12); g.fillRect(me.x + 4, me.y + 12, 5, 12);
    g.font = `34px ${DISPLAY}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(String(score), 12, 10);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Arrows or drag. Pass between the flags.', col.ink, col.card);
  }
  const begin = () => { if (state === 'ready') state = 'play'; };
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; ptr = null; e.preventDefault(); begin(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; ptr = null; e.preventDefault(); begin(); }
  });
  api.on(window, 'keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
  });
  api.on(c, 'pointerdown', e => { e.preventDefault(); ptr = toLocal(c, e).x; begin(); });
  api.on(c, 'pointermove', e => { if (ptr !== null || e.pointerType === 'mouse') ptr = toLocal(c, e).x; });
  api.on(c, 'pointerup', e => { if (e.pointerType !== 'mouse') ptr = null; });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Duck Shoot ---------- */
function duckGame(stage, api){
  const W = 440, H = 340;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {sky:tok('--cell'), grass:tok('--mint'), ink:tok('--ink'), card:tok('--card'), duck:tok('--grape'), gold:tok('--sun')};
  let ducks = [], score = 0, escaped = 0, state = 'ready', raf, last = 0, acc = 0, elapsed = 0, pops = [];
  function spawn(){
    const dir = Math.random() < 0.5 ? 1 : -1;
    const gold = Math.random() < 0.12;
    ducks.push({x: dir > 0 ? -30 : W + 30, y:50 + Math.random() * 160, vx:dir * (1.7 + Math.random() * 1.2 + elapsed * 0.04),
                base:0, phase:Math.random() * 6, gold, flap:0});
  }
  function tick(t){
    const dt = last ? Math.min(50, t - last) : 0; last = t;
    const k = dt / 16.67;
    if (state === 'play'){
      elapsed += dt / 1000; acc += dt;
      const every = Math.max(450, 1300 - elapsed * 25);
      while (acc >= every){ acc -= every; spawn(); }
      for (const d of ducks){ d.x += d.vx * k; d.y += Math.sin(d.phase + d.x / 60) * 0.9 * k; d.flap += 0.25 * k; }
      const gone = ducks.filter(d => d.x < -60 || d.x > W + 60);
      escaped += gone.length;
      ducks = ducks.filter(d => d.x >= -60 && d.x <= W + 60);
      if (escaped >= 5){ state = 'over'; draw(); api.over(score); return; }
    }
    pops.forEach(p => { p.t += k; });
    pops = pops.filter(p => p.t < 16);
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.sky; g.fillRect(0, 0, W, H);
    g.fillStyle = col.grass; g.fillRect(0, H - 60, W, 60);
    g.fillStyle = tok('--board');
    for (let i = 0; i < 9; i++){ const x = 20 + i * 50; g.beginPath(); g.moveTo(x, H - 60); g.lineTo(x + 10, H - 92); g.lineTo(x + 20, H - 60); g.fill(); }
    ducks.forEach(d => {
      const flip = d.vx > 0 ? 1 : -1;
      g.save(); g.translate(d.x, d.y); g.scale(flip, 1);
      g.fillStyle = d.gold ? col.gold : col.duck;
      g.beginPath(); g.ellipse(0, 0, 17, 11, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(13, -8, 8, 7, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = tok('--tomato');
      g.beginPath(); g.moveTo(19, -8); g.lineTo(28, -6); g.lineTo(19, -3); g.fill();
      g.fillStyle = '#fff';
      const wing = Math.sin(d.flap) * 8;
      g.beginPath(); g.ellipse(-2, -3 + wing * 0.3, 9, 5 + Math.abs(wing) * 0.3, -0.3, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#231B4E'; g.beginPath(); g.arc(15, -9, 1.8, 0, 7); g.fill();
      g.restore();
    });
    pops.forEach(p => {
      g.globalAlpha = 1 - p.t / 16; g.fillStyle = p.miss ? tok('--muted') : col.ink;
      g.font = `700 18px ${FONT}`; g.textAlign = 'center';
      g.fillText(p.label, p.x, p.y - p.t * 1.6); g.globalAlpha = 1;
    });
    g.fillStyle = col.ink; g.font = `700 15px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`Escaped ${escaped} of 5`, 10, 10);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Tap the ducks. Let five escape and it is over.', col.ink, col.card);
  }
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    if (state === 'ready'){ state = 'play'; return; }
    if (state !== 'play') return;
    const p = toLocal(c, e);
    for (let i = ducks.length - 1; i >= 0; i--){
      const d = ducks[i];
      if (Math.hypot((p.x - d.x) / 20, (p.y - d.y) / 14) < 1.2){
        const add = d.gold ? 5 : 1;
        score += add; api.score(score);
        pops.push({x:d.x, y:d.y, t:0, label:'+' + add});
        ducks.splice(i, 1);
        return;
      }
    }
    pops.push({x:p.x, y:p.y, t:0, label:'miss', miss:true});
  });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Sub Hunt ---------- */
function subGame(stage, api){
  const W = 440, H = 380, SEA = 70;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {sky:tok('--cell'), sea:tok('--blue'), ink:tok('--ink'), card:tok('--card'), ship:tok('--tomato'), sub:tok('--board'), charge:tok('--sun'), torp:tok('--grape')};
  const ship = {x:W / 2, w:56};
  let subs = [], charges = [], torps = [], booms = [], score = 0, lives = 3, state = 'ready', raf, last = 0, acc = 0, elapsed = 0;
  const keys = {l:false, r:false};
  let ptr = null;
  function spawn(){
    const lane = rand(3);
    const y = SEA + 60 + lane * 90;
    const dir = Math.random() < 0.5 ? 1 : -1;
    subs.push({x: dir > 0 ? -40 : W + 40, y, vx:dir * (0.8 + Math.random() * 0.8 + elapsed * 0.02), lane, cool:120 + rand(200)});
  }
  function tick(t){
    const dt = last ? Math.min(50, t - last) : 0; last = t;
    const k = dt / 16.67;
    if (state === 'play'){
      elapsed += dt / 1000; acc += dt;
      const every = Math.max(700, 1800 - elapsed * 30);
      while (acc >= every){ acc -= every; spawn(); }
      if (keys.l) ship.x -= 3.6 * k;
      if (keys.r) ship.x += 3.6 * k;
      if (ptr !== null) ship.x += Math.max(-5 * k, Math.min(5 * k, ptr - ship.x));
      ship.x = Math.max(ship.w / 2, Math.min(W - ship.w / 2, ship.x));
      for (const s of subs){
        s.x += s.vx * k; s.cool -= k;
        if (s.cool <= 0 && s.x > 20 && s.x < W - 20){ torps.push({x:s.x, y:s.y - 10}); s.cool = 220 + rand(260); }
      }
      subs = subs.filter(s => s.x > -60 && s.x < W + 60);
      for (const ch of charges){
        ch.y += 2.2 * k;
        for (const s of subs){
          if (!s.dead && Math.hypot(s.x - ch.x, s.y - ch.y) < 22){
            s.dead = true; ch.done = true;
            score += (s.lane + 1) * 20; api.score(score);
            booms.push({x:s.x, y:s.y, t:0});
          }
        }
      }
      subs = subs.filter(s => !s.dead);
      charges = charges.filter(ch => !ch.done && ch.y < H);
      for (const tp of torps){
        tp.y -= 2.4 * k;
        if (tp.y <= SEA && Math.abs(tp.x - ship.x) < ship.w / 2){
          tp.done = true; lives--;
          booms.push({x:tp.x, y:SEA, t:0});
          if (lives <= 0){ state = 'over'; draw(); api.over(score); return; }
        }
      }
      torps = torps.filter(tp => !tp.done && tp.y > 0);
    }
    booms.forEach(b => { b.t += k; });
    booms = booms.filter(b => b.t < 18);
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.sky; g.fillRect(0, 0, W, SEA);
    g.fillStyle = col.sea; g.fillRect(0, SEA, W, H - SEA);
    g.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 4; i++) g.fillRect(0, SEA + 40 + i * 90, W, 2);
    g.fillStyle = col.ship;
    g.beginPath(); g.moveTo(ship.x - ship.w / 2, SEA - 14); g.lineTo(ship.x + ship.w / 2, SEA - 14);
    g.lineTo(ship.x + ship.w / 2 - 10, SEA + 6); g.lineTo(ship.x - ship.w / 2 + 10, SEA + 6); g.closePath(); g.fill();
    g.fillRect(ship.x - 5, SEA - 30, 10, 16);
    subs.forEach(s => {
      g.fillStyle = col.sub; g.save(); g.translate(s.x, s.y); g.scale(s.vx > 0 ? 1 : -1, 1);
      g.beginPath(); g.ellipse(0, 0, 24, 9, 0, 0, Math.PI * 2); g.fill();
      g.fillRect(-4, -16, 9, 9);
      g.fillStyle = '#FFF6F9'; g.beginPath(); g.arc(12, -1, 3, 0, 7); g.fill();
      g.restore();
    });
    g.fillStyle = col.charge;
    charges.forEach(ch => { g.beginPath(); g.arc(ch.x, ch.y, 6, 0, Math.PI * 2); g.fill(); });
    g.fillStyle = col.torp;
    torps.forEach(tp => { rr(g, tp.x - 3, tp.y - 9, 6, 16, 3); g.fill(); });
    booms.forEach(b => {
      g.globalAlpha = 1 - b.t / 18; g.fillStyle = col.charge;
      g.beginPath(); g.arc(b.x, b.y, 8 + b.t * 2.2, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1;
    });
    g.fillStyle = col.ink; g.font = `700 14px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`Ships ${'●'.repeat(Math.max(0, lives))}`, 10, 8);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Move with arrows or drag, Space or tap to drop', col.ink, col.card);
  }
  function drop(){
    if (state === 'ready'){ state = 'play'; return; }
    if (state !== 'play' || charges.length >= 3) return;
    charges.push({x:ship.x, y:SEA + 6});
  }
  api.on(c, 'pointerdown', e => { e.preventDefault(); ptr = toLocal(c, e).x; drop(); });
  api.on(c, 'pointermove', e => { if (ptr !== null || e.pointerType === 'mouse') ptr = toLocal(c, e).x; });
  api.on(c, 'pointerup', e => { if (e.pointerType !== 'mouse') ptr = null; });
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; ptr = null; e.preventDefault(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; ptr = null; e.preventDefault(); }
    if (e.code === 'Space' || e.code === 'ArrowDown'){ e.preventDefault(); if (!e.repeat) drop(); }
  });
  api.on(window, 'keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
  });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Unblock ---------- */
const UNBLOCK_LEVELS = [

function unblockGame(stage, api){
  const N = 6;
  const wrap = el('div', 'panel'), tools = el('div', 'tools');
  const info = el('span');
  info.setAttribute('aria-live', 'polite');
  const resetB = btn('btn small', 'Restart level');
  tools.append(info, resetB);
  const board = el('div', 'board unblock');
  wrap.append(tools, board); stage.appendChild(wrap);
  let level = 0, cars = [], moves = 0, sel = -1, done = false;
  const cells = [...Array(N * N)].map((_, i) => { const d = el('div', 'ub-cell'); board.appendChild(d); return d; });
  const carEls = [];
  function load(){
    cars = UNBLOCK_LEVELS[level].map(([r, c, len, h]) => ({r, c, len, h:!!h}));
    sel = -1;
    carEls.length = 0;
    board.querySelectorAll('.ub-car').forEach(e => e.remove());
    cars.forEach((car, i) => {
      const b = btn('ub-car' + (i === 0 ? ' red' : ''));
      board.appendChild(b); carEls.push(b);
      api.on(b, 'click', () => tap(i));
    });
    render();
  }
  const occupied = () => {
    const g = Array(N * N).fill(-1);
    cars.forEach((car, i) => { for (let k = 0; k < car.len; k++) g[(car.r + (car.h ? 0 : k)) * N + car.c + (car.h ? k : 0)] = i; });
    return g;
  };
  function canMove(i, step){
    const g = occupied(), car = cars[i];
    const r = car.r + (car.h ? 0 : step < 0 ? -1 : car.len), cc = car.c + (car.h ? (step < 0 ? -1 : car.len) : 0);
    if (r < 0 || cc < 0 || r >= N || cc >= N) return false;
    return g[r * N + cc] === -1;
  }
  function move(i, step){
    if (done || !canMove(i, step)) return false;
    const car = cars[i];
    if (car.h) car.c += step; else car.r += step;
    moves++; render();
    const red = cars[0];
    if (red.c + red.len === N && red.r === 2 && red.h){
      level++;
      if (level >= UNBLOCK_LEVELS.length){ done = true; info.textContent = `All ${UNBLOCK_LEVELS.length} levels cleared in ${moves} moves!`; api.over(moves, {won:true}); }
      else { info.textContent = 'Level clear!'; setTimeout(load, 550); }
    }
    return true;
  }
  function tap(i){
    if (done) return;
    if (sel === i){ if (!move(i, 1)) move(i, -1); render(); return; }
    sel = i; render();
  }
  function render(){
    cells.forEach((d, i) => d.classList.toggle('exit', i === 2 * N + N - 1));
    cars.forEach((car, i) => {
      const b = carEls[i];
      b.style.gridRow = car.h ? `${car.r + 1}` : `${car.r + 1} / span ${car.len}`;
      b.style.gridColumn = car.h ? `${car.c + 1} / span ${car.len}` : `${car.c + 1}`;
      b.classList.toggle('sel', i === sel);
      b.setAttribute('aria-label', `${i === 0 ? 'Red car' : 'Blocker'} at row ${car.r + 1}, column ${car.c + 1}${i === sel ? ', selected' : ''}`);
    });
    info.textContent = done ? info.textContent : `Level ${level + 1} of ${UNBLOCK_LEVELS.length} · moves ${moves}`;
    api.score(moves);
  }
  api.on(resetB, 'click', () => { if (!done) load(); });
  api.on(board, 'pointerdown', e => { if (e.target === board) sel = -1; });
  api.swipe(board, (dx, dy) => {
    if (sel < 0) return;
    const car = cars[sel];
    if (car.h && dx) move(sel, dx);
    if (!car.h && dy) move(sel, dy);
  });
  api.on(window, 'keydown', e => {
    const d = DIRS[e.code];
    if (!d || sel < 0) return;
    e.preventDefault();
    const car = cars[sel];
    if (car.h && d[0]) move(sel, d[0]);
    if (!car.h && d[1]) move(sel, d[1]);
  });
  load(); api.score(0);
}

/* ---------- Binary Puzzle ---------- */
function binarySolve(grid, N, limit){
  const g = grid.slice();
  let count = 0, sol = null;
  const half = N / 2;
  function ok(i){
    const r = Math.floor(i / N), c = i % N, v = g[i];
    let run = 1;
    for (let k = c - 1; k >= 0 && g[r * N + k] === v; k--) run++;
    for (let k = c + 1; k < N && g[r * N + k] === v; k++) run++;
    if (run > 2) return false;
    run = 1;
    for (let k = r - 1; k >= 0 && g[k * N + c] === v; k--) run++;
    for (let k = r + 1; k < N && g[k * N + c] === v; k++) run++;
    if (run > 2) return false;
    let rowCount = 0, colCount = 0, rowFull = 0, colFull = 0;
    for (let k = 0; k < N; k++){
      if (g[r * N + k] === v) rowCount++;
      if (g[r * N + k] !== null) rowFull++;
      if (g[k * N + c] === v) colCount++;
      if (g[k * N + c] !== null) colFull++;
    }
    if (rowCount > half || colCount > half) return false;
    if (rowFull === N) for (let r2 = 0; r2 < N; r2++){
      if (r2 === r) continue;
      let same = true;
      for (let k = 0; k < N; k++){ if (g[r2 * N + k] === null || g[r2 * N + k] !== g[r * N + k]){ same = false; break; } }
      if (same) return false;
    }
    if (colFull === N) for (let c2 = 0; c2 < N; c2++){
      if (c2 === c) continue;
      let same = true;
      for (let k = 0; k < N; k++){ if (g[k * N + c2] === null || g[k * N + c2] !== g[k * N + c]){ same = false; break; } }
      if (same) return false;
    }
    return true;
  }
  function rec(i){
    while (i < N * N && g[i] !== null) i++;
    if (i >= N * N){ count++; if (!sol) sol = g.slice(); return; }
    for (const v of shuffle([0, 1])){
      g[i] = v;
      if (ok(i)) rec(i + 1);
      g[i] = null;
      if (count >= limit) return;
    }
  }
  rec(0);
  return {count, sol};
}
function binaryGame(stage, api){
  const N = 6;
  const full = binarySolve(Array(N * N).fill(null), N, 1).sol;
  const puzzle = full.slice();
  for (const i of shuffle([...Array(N * N).keys()])){
    const keep = puzzle[i];
    puzzle[i] = null;
    if (binarySolve(puzzle, N, 2).count !== 1) puzzle[i] = keep;
  }
  const wrap = el('div', 'panel'), info = el('p', 'tools');
  info.setAttribute('aria-live', 'polite');
  const board = el('div', 'board binary');
  wrap.append(info, board); stage.appendChild(wrap);
  const vals = puzzle.slice();
  let secs = 0, done = false;
  const timer = setInterval(() => { if (!done){ secs++; api.score(secs); } }, 1000);
  const cells = vals.map((_, i) => {
    const b = btn('bin' + (puzzle[i] !== null ? ' given' : ''));
    board.appendChild(b);
    api.on(b, 'click', () => tap(i));
    return b;
  });
  function bad(){
    const flags = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
      const i = r * N + c, v = vals[i];
      if (v === null) continue;
      if (c >= 2 && vals[i - 1] === v && vals[i - 2] === v){ flags.add(i); flags.add(i - 1); flags.add(i - 2); }
      if (r >= 2 && vals[i - N] === v && vals[i - 2 * N] === v){ flags.add(i); flags.add(i - N); flags.add(i - 2 * N); }
    }
    for (let k = 0; k < N; k++){
      const row = [...Array(N)].map((_, c) => vals[k * N + c]);
      const colv = [...Array(N)].map((_, r) => vals[r * N + k]);
      [[row, true], [colv, false]].forEach(([arr, isRow]) => {
        [0, 1].forEach(v => {
          if (arr.filter(x => x === v).length > N / 2) arr.forEach((x, j) => { if (x === v) flags.add(isRow ? k * N + j : j * N + k); });
        });
      });
    }
    return flags;
  }
  function render(){
    const flags = bad();
    cells.forEach((b, i) => {
      b.textContent = vals[i] === null ? '' : vals[i];
      b.dataset.v = vals[i] === null ? '' : vals[i];
      b.classList.toggle('bad', flags.has(i));
      b.setAttribute('aria-label', `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}, ${vals[i] === null ? 'empty' : vals[i]}${puzzle[i] !== null ? ', given' : ''}`);
    });
    const left = vals.filter(v => v === null).length;
    info.textContent = done ? `Solved in ${mmss(secs)}!` : `${left} square${left === 1 ? '' : 's'} to fill. Equal numbers of 0 and 1 in every line, and never three in a row.`;
  }
  function tap(i){
    if (done || puzzle[i] !== null) return;
    vals[i] = vals[i] === null ? 0 : vals[i] === 0 ? 1 : null;
    render();
    if (vals.every((v, k) => v === full[k])){ done = true; clearInterval(timer); render(); api.over(secs, {won:true}); }
  }
  render(); api.score(0);
  return () => clearInterval(timer);
}

/* ---------- Number Link ---------- */
function linkGame(stage, api){
  const N = 6, W = 420, S = W / N;
  const label = el('p', 'tools');
  label.setAttribute('aria-live', 'polite');
  stage.appendChild(label);
  const [c, g] = makeCanvas(stage, W, W);
  const col = {bg:tok('--cell'), grid:tok('--edge'), ink:tok('--ink'), card:tok('--card')};
  const PAL = FLOOD_COLOURS.map(x => x[0]).concat(['#2DB4C8', '#B8862A']);
  let ends = [], paths = [], drawing = -1;
  function build(){
    for (let attempt = 0; attempt < 200; attempt++){
      const owner = Array(N * N).fill(-1), routes = [];
      let okay = true;
      while (owner.includes(-1)){
        const freeCells = owner.map((v, i) => v < 0 ? i : -1).filter(i => i >= 0);
        let cur = freeCells[rand(freeCells.length)];
        const route = [cur];
        owner[cur] = routes.length;
        for (let step = 0; step < 40; step++){
          const r = Math.floor(cur / N), q = cur % N;
          const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]]
            .map(([dx, dy]) => [r + dy, q + dx])
            .filter(([y, x]) => y >= 0 && x >= 0 && y < N && x < N && owner[y * N + x] === -1)
            .map(([y, x]) => y * N + x);
          if (!opts.length || (route.length >= 4 && Math.random() < 0.25)) break;
          cur = opts[rand(opts.length)];
          owner[cur] = routes.length;
          route.push(cur);
        }
        if (route.length < 3){
          const start = route[0], r0 = Math.floor(start / N), q0 = start % N;
          const join = [[1,0],[-1,0],[0,1],[0,-1]]
            .map(([dx, dy]) => [r0 + dy, q0 + dx])
            .filter(([y, x]) => y >= 0 && x >= 0 && y < N && x < N)
            .map(([y, x]) => y * N + x)
            .find(j => routes.some(rt => rt[0] === j || rt[rt.length - 1] === j));
          if (join === undefined){ okay = false; break; }
          const rt = routes.find(r2 => r2[0] === join || r2[r2.length - 1] === join);
          const k = routes.indexOf(rt);
          if (rt[rt.length - 1] === join) rt.push(...route); else rt.unshift(...route.reverse());
          route.forEach(cell => { owner[cell] = k; });
          continue;
        }
        routes.push(route);
        if (routes.length > PAL.length){ okay = false; break; }
      }
      if (!okay || routes.length < 4) continue;
      ends = routes.map(r => [r[0], r[r.length - 1]]);
      paths = routes.map((r, i) => [ends[i][0]]);
      return;
    }
    ends = [[0, N * N - 1]]; paths = [[0]];
  }
  const ownerOf = i => { for (let k = 0; k < paths.length; k++) if (paths[k].includes(i)) return k; return -1; };
  const endOwner = i => { for (let k = 0; k < ends.length; k++) if (ends[k].includes(i)) return k; return -1; };
  const complete = k => { const p = paths[k]; return p.length > 1 && ends[k].includes(p[0]) && ends[k].includes(p[p.length - 1]); };
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, W);
    g.strokeStyle = col.grid; g.globalAlpha = 0.18; g.lineWidth = 1;
    for (let i = 1; i < N; i++){ g.beginPath(); g.moveTo(i * S, 0); g.lineTo(i * S, W); g.moveTo(0, i * S); g.lineTo(W, i * S); g.stroke(); }
    g.globalAlpha = 1;
    g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = S * 0.42;
    paths.forEach((p, k) => {
      if (p.length < 2) return;
      g.strokeStyle = PAL[k];
      g.beginPath();
      p.forEach((i, n) => { const x = (i % N) * S + S / 2, y = Math.floor(i / N) * S + S / 2; n ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    });
    ends.forEach(([a, b], k) => {
      [a, b].forEach(i => {
        const x = (i % N) * S + S / 2, y = Math.floor(i / N) * S + S / 2;
        g.fillStyle = PAL[k];
        g.beginPath(); g.arc(x, y, S * 0.3, 0, Math.PI * 2); g.fill();
        g.fillStyle = complete(k) ? '#fff' : 'rgba(255,255,255,.55)';
        g.beginPath(); g.arc(x, y, S * 0.12, 0, Math.PI * 2); g.fill();
      });
    });
    const doneCount = paths.filter((_, k) => complete(k)).length;
    const filled = new Set(paths.flat()).size;
    label.textContent = `Joined ${doneCount} of ${ends.length} pairs · ${filled} of ${N * N} squares used`;
    return doneCount;
  }
  function startAt(i){
    const eo = endOwner(i);
    if (eo >= 0){ drawing = eo; paths[eo] = [i]; draw(); return; }
    const po = ownerOf(i);
    if (po >= 0){ drawing = po; paths[po] = paths[po].slice(0, paths[po].indexOf(i) + 1); draw(); return; }
    drawing = -1;
  }
  function extend(i){
    if (drawing < 0) return;
    const p = paths[drawing], lastCell = p[p.length - 1];
    if (i === lastCell) return;
    const r1 = Math.floor(lastCell / N), c1 = lastCell % N, r2 = Math.floor(i / N), c2 = i % N;
    if (Math.abs(r1 - r2) + Math.abs(c1 - c2) !== 1) return;
    if (p.length > 1 && i === p[p.length - 2]){ p.pop(); draw(); return; }
    if (p.includes(i)) return;
    const eo = endOwner(i);
    if (eo >= 0 && eo !== drawing) return;
    if (eo === drawing && i === p[0]) return;
    const po = ownerOf(i);
    if (po >= 0 && po !== drawing) paths[po] = paths[po].slice(0, paths[po].indexOf(i));
    p.push(i);
    if (eo === drawing) drawing = -1;
    const doneCount = draw();
    if (doneCount === ends.length && new Set(paths.flat()).size === N * N){
      api.score(doneCount);
      api.over(new Set(paths.flat()).size, {won:true, title:'All joined'});
    }
    api.score(paths.filter((_, k) => complete(k)).length);
  }
  const cellAt = e => { const p = toLocal(c, e); return Math.floor(p.y / S) * N + Math.floor(p.x / S); };
  api.on(c, 'pointerdown', e => { e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch {} startAt(cellAt(e)); });
  api.on(c, 'pointermove', e => { if (drawing >= 0) extend(cellAt(e)); });
  api.on(c, 'pointerup', () => { drawing = -1; });
  api.on(c, 'pointercancel', () => { drawing = -1; });
  api.on(window, 'keydown', e => {
    const i = digitKey(e, Math.min(9, ends.length));
    if (i >= 0){ e.preventDefault(); startAt(ends[i][0]); return; }
    const d = DIRS[e.code];
    if (d && drawing >= 0){
      e.preventDefault();
      const p = paths[drawing], lastCell = p[p.length - 1];
      const r = Math.floor(lastCell / N) + d[1], q = lastCell % N + d[0];
      if (r >= 0 && q >= 0 && r < N && q < N) extend(r * N + q);
    }
  });
  build(); draw(); api.score(0);
}

/* ---------- Draughts ---------- */
function draughtsGame(stage, api){
  const {status, nextB, board} = streakShell(stage, 'draughts', 'You are the light pieces, moving up the board.');
  let b = Array(64).fill(0), streak = 0, busy = false, done = false, sel = -1, t = null;
  const dark = i => (Math.floor(i / 8) + i % 8) % 2 === 1;
  const cells = b.map((_, i) => { const x = btn('dsq' + (dark(i) ? ' dark' : '')); board.appendChild(x); api.on(x, 'click', () => tap(i)); return x; });
  function setup(){
    b = Array(64).fill(0);
    for (let i = 0; i < 64; i++){
      if (!dark(i)) continue;
      const r = Math.floor(i / 8);
      if (r < 3) b[i] = 3;
      if (r > 4) b[i] = 1;
    }
  }
  const mineOf = p => p === 1 ? [1, 2] : [3, 4];
  function genMoves(bd, p){
    const caps = [], quiet = [];
    const own = mineOf(p), foe = mineOf(3 - p);
    for (let i = 0; i < 64; i++){
      if (!own.includes(bd[i])) continue;
      const king = bd[i] === 2 || bd[i] === 4;
      const dirs = king ? [[-1, -1], [-1, 1], [1, -1], [1, 1]] : p === 1 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]];
      const jump = (pos, taken, path) => {
        let any = false;
        for (const [dr, dc] of dirs){
          const r = Math.floor(pos / 8) + dr, c = pos % 8 + dc;
          const r2 = r + dr, c2 = c + dc;
          if (r2 < 0 || c2 < 0 || r2 > 7 || c2 > 7 || r < 0 || c < 0 || r > 7 || c > 7) continue;
          const mid = r * 8 + c, tgt = r2 * 8 + c2;
          if (!foe.includes(bd[mid]) || taken.includes(mid)) continue;
          if (bd[tgt] !== 0 && tgt !== path[0]) continue;
          any = true;
          jump(tgt, taken.concat(mid), path.concat(tgt));
        }
        if (!any && path.length > 1) caps.push({from:path[0], to:pos, captured:taken});
      };
      jump(i, [], [i]);
      for (const [dr, dc] of dirs){
        const r = Math.floor(i / 8) + dr, c = i % 8 + dc;
        if (r < 0 || c < 0 || r > 7 || c > 7) continue;
        const tgt = r * 8 + c;
        if (bd[tgt] === 0) quiet.push({from:i, to:tgt, captured:[]});
      }
    }
    return caps.length ? caps : quiet;
  }
  function apply(bd, m){
    const nb = bd.slice();
    let piece = nb[m.from];
    nb[m.from] = 0;
    m.captured.forEach(i => { nb[i] = 0; });
    const r = Math.floor(m.to / 8);
    if (piece === 1 && r === 0) piece = 2;
    if (piece === 3 && r === 7) piece = 4;
    nb[m.to] = piece;
    return nb;
  }
  const evalBoard = bd => {
    let s = 0;
    bd.forEach((v, i) => {
      const r = Math.floor(i / 8);
      if (v === 3) s += 10 + (r * 0.4);
      else if (v === 4) s += 18;
      else if (v === 1) s -= 10 + ((7 - r) * 0.4);
      else if (v === 2) s -= 18;
    });
    return s;
  };
  function search(bd, depth, p, alpha, beta){
    const moves = genMoves(bd, p);
    if (!moves.length) return p === 2 ? -1000 : 1000;
    if (depth === 0) return evalBoard(bd);
    if (p === 2){
      let best = -Infinity;
      for (const m of moves){ best = Math.max(best, search(apply(bd, m), depth - 1, 1, alpha, beta)); alpha = Math.max(alpha, best); if (beta <= alpha) break; }
      return best;
    }
    let best = Infinity;
    for (const m of moves){ best = Math.min(best, search(apply(bd, m), depth - 1, 2, alpha, beta)); beta = Math.min(beta, best); if (beta <= alpha) break; }
    return best;
  }
  function render(){
    const legal = sel >= 0 ? genMoves(b, 1).filter(m => m.from === sel).map(m => m.to) : [];
    const movers = new Set(genMoves(b, 1).map(m => m.from));
    cells.forEach((x, i) => {
      x.textContent = '';
      x.className = 'dsq' + (dark(i) ? ' dark' : '') + (b[i] ? (b[i] < 3 ? ' me' : ' foe') : '') +
        (b[i] === 2 || b[i] === 4 ? ' king' : '') + (i === sel ? ' sel' : '') + (legal.includes(i) ? ' target' : '');
      if (b[i] === 2 || b[i] === 4) x.textContent = '♛';
      x.disabled = busy || done || (!b[i] && !legal.includes(i)) || (b[i] >= 3);
      if (!busy && !done && b[i] && b[i] < 3 && !movers.has(i)) x.disabled = true;
      x.setAttribute('aria-label', `Row ${Math.floor(i / 8) + 1}, column ${i % 8 + 1}, ${b[i] ? (b[i] < 3 ? 'your piece' : "computer's piece") : legal.includes(i) ? 'you can move here' : 'empty'}`);
    });
    api.score(streak);
  }
  function finish(youWin){
    done = true;
    if (youWin){ streak++; api.score(streak); status.textContent = 'You won that game!'; nextB.hidden = false; render(); nextB.focus(); }
    else { status.textContent = 'The computer wins.'; render(); api.over(streak); }
  }
  function cpuTurn(){
    busy = true; status.textContent = 'Computer is thinking…'; render();
    t = setTimeout(() => {
      const moves = genMoves(b, 2);
      if (!moves.length){ busy = false; finish(true); return; }
      let best = moves[0], bestS = -Infinity;
      for (const m of moves){
        const s = search(apply(b, m), 3, 1, -Infinity, Infinity) + Math.random();
        if (s > bestS){ bestS = s; best = m; }
      }
      b = apply(b, best);
      busy = false;
      if (!genMoves(b, 1).length){ finish(false); return; }
      status.textContent = best.captured.length ? `The computer took ${best.captured.length}. Your move.` : 'Your move.';
      render();
    }, 420);
  }
  function tap(i){
    if (busy || done) return;
    const moves = genMoves(b, 1);
    if (b[i] && b[i] < 3){ sel = moves.some(m => m.from === i) ? i : -1; render(); return; }
    if (sel < 0) return;
    const m = moves.find(x => x.from === sel && x.to === i);
    if (!m) return;
    b = apply(b, m); sel = -1;
    if (m.captured.length) status.textContent = `You took ${m.captured.length}.`;
    render();
    if (!genMoves(b, 2).length){ finish(true); return; }
    cpuTurn();
  }
  function newRound(){ setup(); done = false; sel = -1; nextB.hidden = true; status.textContent = 'Your move. Captures are compulsory.'; render(); }
  api.on(nextB, 'click', newRound);
  setup(); render();
  return () => clearTimeout(t);
}

/* ---------- Nine Men's Morris ---------- */
function morrisGame(stage, api){
  const PTS = [[0,0],[3,0],[6,0],[0,3],[6,3],[0,6],[3,6],[6,6],[1,1],[3,1],[5,1],[1,3],[5,3],[1,5],[3,5],[5,5],[2,2],[3,2],[4,2],[2,3],[4,3],[2,4],[3,4],[4,4]];
  const MILLS = [[0,1,2],[5,6,7],[0,3,5],[2,4,7],[8,9,10],[13,14,15],[8,11,13],[10,12,15],[16,17,18],[21,22,23],[16,19,21],[18,20,23],[1,9,17],[3,11,19],[4,12,20],[6,14,22]];
  const ADJ = [[1,3],[0,2,9],[1,4],[0,5,11],[2,7,12],[3,6],[5,7,14],[4,6],[9,11],[1,8,10,17],[9,12],[3,8,13,19],[4,10,15,20],[11,14],[6,13,15,22],[12,14],[17,19],[9,16,18],[17,20],[11,16,21],[12,18,23],[19,22],[14,21,23],[20,22]];
  const W = 400, S = W / 7;
  const {status, nextB, board} = streakShell(stage, 'morris', 'Place your nine pieces. Three in a line lets you take one of theirs.');
  board.classList.add('canvas-board');
  const [c, g] = makeCanvas(board, W, W);
  const col = {bg:tok('--board'), line:tok('--edge'), me:tok('--blue'), foe:tok('--tomato'), ink:tok('--ink'), sel:tok('--sun')};
  let pts, hands, onBoard, turn, phase, sel, streak = 0, busy = false, done = false, t = null;
  const xy = i => [PTS[i][0] * S + S, PTS[i][1] * S + S];
  function reset(){
    pts = Array(24).fill(0); hands = {1:9, 2:9}; onBoard = {1:0, 2:0};
    turn = 1; phase = 'place'; sel = -1; done = false; nextB.hidden = true;
  }
  const millsWith = (state, i, p) => MILLS.filter(m => m.includes(i) && m.every(k => state[k] === p));
  const movesFor = (state, p) => {
    const out = [];
    if (hands[p] > 0) state.forEach((v, i) => { if (!v) out.push({to:i}); });
    else {
      const fly = onBoard[p] === 3;
      state.forEach((v, i) => {
        if (v !== p) return;
        (fly ? [...Array(24).keys()] : ADJ[i]).forEach(j => { if (!state[j]) out.push({from:i, to:j}); });
      });
    }
    return out;
  };
  function removable(p){
    const foe = 3 - p;
    const all = pts.map((v, i) => v === foe ? i : -1).filter(i => i >= 0);
    const free = all.filter(i => !MILLS.some(m => m.includes(i) && m.every(k => pts[k] === foe)));
    return free.length ? free : all;
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, W);
    g.strokeStyle = col.line; g.lineWidth = 3;
    [[0, 6], [1, 5], [2, 4]].forEach(([a, b2]) => g.strokeRect(a * S + S, a * S + S, (b2 - a) * S, (b2 - a) * S));
    g.beginPath();
    g.moveTo(S * 1, S * 4); g.lineTo(S * 3, S * 4);
    g.moveTo(S * 5, S * 4); g.lineTo(S * 7, S * 4);
    g.moveTo(S * 4, S * 1); g.lineTo(S * 4, S * 3);
    g.moveTo(S * 4, S * 5); g.lineTo(S * 4, S * 7);
    g.stroke();
    pts.forEach((v, i) => {
      const [x, y] = xy(i);
      g.fillStyle = v === 1 ? col.me : v === 2 ? col.foe : col.line;
      g.beginPath(); g.arc(x, y, v ? 15 : 5, 0, Math.PI * 2); g.fill();
      if (i === sel){ g.strokeStyle = col.sel; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 19, 0, Math.PI * 2); g.stroke(); }
      if (phase === 'remove' && turn === 1 && removable(1).includes(i)){ g.strokeStyle = col.sel; g.lineWidth = 3; g.beginPath(); g.arc(x, y, 19, 0, Math.PI * 2); g.stroke(); }
    });
    g.fillStyle = col.ink; g.font = `700 13px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`You ${hands[1]}+${onBoard[1]}`, 8, 6);
    g.textAlign = 'right';
    g.fillText(`Computer ${hands[2]}+${onBoard[2]}`, W - 8, 6);
    g.textBaseline = 'middle';
    api.score(streak);
  }
  function place(p, i){
    pts[i] = p;
    if (hands[p] > 0) hands[p]--;
    onBoard[p]++;
    return millsWith(pts, i, p).length > 0;
  }
  function slide(p, from, to){
    pts[from] = 0; pts[to] = p;
    return millsWith(pts, to, p).length > 0;
  }
  function checkLoss(p){
    if (hands[p] === 0 && onBoard[p] < 3) return true;
    if (hands[p] === 0 && !movesFor(pts, p).length) return true;
    return false;
  }
  function endTurn(){
    const foe = 3 - turn;
    if (checkLoss(foe)){ finish(turn === 1); return; }
    turn = foe;
    if (turn === 2) cpuTurn();
    else { status.textContent = hands[1] ? 'Place a piece.' : 'Move one of your pieces.'; draw(); }
  }
  function finish(youWin){
    done = true; busy = false;
    if (youWin){ streak++; api.score(streak); status.textContent = 'You win!'; nextB.hidden = false; draw(); nextB.focus(); }
    else { status.textContent = 'The computer wins.'; draw(); api.over(streak); }
  }
  function cpuTurn(){
    busy = true; status.textContent = 'Computer is thinking…'; draw();
    t = setTimeout(() => {
      const moves = movesFor(pts, 2);
      if (!moves.length){ finish(true); return; }
      let best = moves[0], bestS = -Infinity;
      for (const m of moves){
        const before = pts.slice();
        if (m.from !== undefined) pts[m.from] = 0;
        pts[m.to] = 2;
        let s = Math.random() * 3;
        if (millsWith(pts, m.to, 2).length) s += 60;
        pts[m.to] = 1;
        if (millsWith(pts, m.to, 1).length) s += 40;
        pts.splice(0, 24, ...before);
        s += ADJ[m.to].length * 2;
        if (s > bestS){ bestS = s; best = m; }
      }
      const mill = best.from !== undefined ? slide(2, best.from, best.to) : place(2, best.to);
      let msg = 'Your move.';
      if (mill){
        const opts = removable(2);
        const take = opts[rand(opts.length)];
        pts[take] = 0; onBoard[1]--;
        msg = 'The computer made a mill and took one of your pieces. Your move.';
      }
      busy = false;
      status.textContent = msg;
      draw();
      if (checkLoss(1)){ finish(false); return; }
      turn = 1;
      draw();
    }, 500);
  }
  function tap(i){
    if (busy || done || turn !== 1) return;
    if (phase === 'remove'){
      if (!removable(1).includes(i)) return;
      pts[i] = 0; onBoard[2]--;
      phase = hands[1] ? 'place' : 'move';
      draw(); endTurn(); return;
    }
    if (hands[1] > 0){
      if (pts[i]) return;
      const mill = place(1, i);
      draw();
      if (mill){ phase = 'remove'; status.textContent = 'Mill! Take one of the computer’s pieces.'; draw(); return; }
      endTurn(); return;
    }
    if (pts[i] === 1){ sel = sel === i ? -1 : i; draw(); return; }
    if (sel >= 0 && !pts[i] && (onBoard[1] === 3 || ADJ[sel].includes(i))){
      const mill = slide(1, sel, i); sel = -1; draw();
      if (mill){ phase = 'remove'; status.textContent = 'Mill! Take one of the computer’s pieces.'; draw(); return; }
      endTurn();
    }
  }
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    const p = toLocal(c, e);
    let best = -1, bestD = 28;
    PTS.forEach((_, i) => { const [x, y] = xy(i); const d = Math.hypot(p.x - x, p.y - y); if (d < bestD){ bestD = d; best = i; } });
    if (best >= 0) tap(best);
  });
  api.on(nextB, 'click', () => { reset(); status.textContent = 'Place a piece.'; draw(); });
  reset(); draw();
  return () => clearTimeout(t);
}

/* ---------- Five Dice ---------- */
function diceGame(stage, api){
  const CATS = [
    {k:'ones', name:'Ones', fn:d => d.filter(v => v === 1).length * 1},
    {k:'twos', name:'Twos', fn:d => d.filter(v => v === 2).length * 2},
    {k:'threes', name:'Threes', fn:d => d.filter(v => v === 3).length * 3},
    {k:'fours', name:'Fours', fn:d => d.filter(v => v === 4).length * 4},
    {k:'fives', name:'Fives', fn:d => d.filter(v => v === 5).length * 5},
    {k:'sixes', name:'Sixes', fn:d => d.filter(v => v === 6).length * 6},
    {k:'three', name:'Three of a kind', fn:d => counts(d).some(n => n >= 3) ? sum(d) : 0},
    {k:'full', name:'Full house (25)', fn:d => counts(d).includes(3) && counts(d).includes(2) ? 25 : 0},
    {k:'run', name:'Run of four (30)', fn:d => hasRun(d, 4) ? 30 : 0},
    {k:'five', name:'Five of a kind (50)', fn:d => counts(d).includes(5) ? 50 : 0},
    {k:'chance', name:'Chance', fn:d => sum(d)}
  ];
  const sum = d => d.reduce((a, b) => a + b, 0);
  const counts = d => { const m = {}; d.forEach(v => { m[v] = (m[v] || 0) + 1; }); return Object.values(m); };
  const hasRun = (d, n) => {
    const u = [...new Set(d)].sort((a, b) => a - b);
    let run = 1, best = 1;
    for (let i = 1; i < u.length; i++){ run = u[i] === u[i - 1] + 1 ? run + 1 : 1; best = Math.max(best, run); }
    return best >= n;
  };
  const wrap = el('div', 'panel wide'), tools = el('div', 'tools');
  const rollB = btn('btn primary', 'Roll');
  const info = el('span');
  info.setAttribute('aria-live', 'polite');
  tools.append(rollB, info);
  const diceRow = el('div', 'dice-row');
  const sheet = el('div', 'score-sheet');
  wrap.append(tools, diceRow, sheet); stage.appendChild(wrap);
  let dice = [0, 0, 0, 0, 0], held = [false, false, false, false, false], rolls = 0, total = 0, used = {}, round = 0;
  const PIP_MAP = {0:[], 1:[4], 2:[0, 8], 3:[0, 4, 8], 4:[0, 2, 6, 8], 5:[0, 2, 4, 6, 8], 6:[0, 2, 3, 5, 6, 8]};
  const PIP_XY = [[8, 8], [18, 8], [28, 8], [8, 18], [18, 18], [28, 18], [8, 28], [18, 28], [28, 28]];
  function face(v){
    const d = el('div', 'pips');
    d.innerHTML = `<svg viewBox="0 0 36 36" aria-hidden="true">` +
      PIP_MAP[v].map(i => `<circle cx="${PIP_XY[i][0]}" cy="${PIP_XY[i][1]}" r="4.2"/>`).join('') + `</svg>`;
    return d;
  }
  function render(){
    diceRow.replaceChildren(...dice.map((v, i) => {
      const b = btn('die' + (held[i] ? ' held' : ''));
      b.appendChild(face(v));
      b.disabled = !rolls;
      b.setAttribute('aria-label', v ? `Die showing ${v}${held[i] ? ', held' : ''}` : 'Die not rolled yet');
      api.on(b, 'click', () => { if (rolls){ held[i] = !held[i]; render(); } });
      return b;
    }));
    sheet.replaceChildren(...CATS.map(cat => {
      const done = used[cat.k] !== undefined;
      const value = rolls && !done ? cat.fn(dice) : used[cat.k];
      const b = btn('cat' + (done ? ' used' : ''));
      b.append(el('span', null, cat.name), el('b', null, done ? String(used[cat.k]) : rolls ? String(value) : '—'));
      b.disabled = done || !rolls;
      b.setAttribute('aria-label', `${cat.name}: ${done ? `scored ${used[cat.k]}` : rolls ? `would score ${value}` : 'roll first'}`);
      api.on(b, 'click', () => claim(cat));
      return b;
    }));
    rollB.disabled = rolls >= 3 || round >= CATS.length;
    rollB.textContent = rolls === 0 ? 'Roll' : `Roll again (${3 - rolls} left)`;
    info.textContent = `Round ${Math.min(round + 1, CATS.length)} of ${CATS.length} · total ${total}`;
    api.score(total);
  }
  function roll(){
    if (rolls >= 3) return;
    dice = dice.map((v, i) => rolls && held[i] ? v : 1 + rand(6));
    rolls++;
    render();
  }
  function claim(cat){
    if (!rolls || used[cat.k] !== undefined) return;
    used[cat.k] = cat.fn(dice);
    total += used[cat.k];
    round++; rolls = 0; held = [false, false, false, false, false];
    api.score(total);
    if (round >= CATS.length){ render(); api.over(total, {won:true, title:'Score sheet full'}); return; }
    render();
  }
  api.on(rollB, 'click', roll);
  api.on(window, 'keydown', e => {
    if (e.code === 'KeyR'){ e.preventDefault(); roll(); return; }
    const i = digitKey(e, 5);
    if (i >= 0 && rolls){ e.preventDefault(); held[i] = !held[i]; render(); }
  });
  render(); api.score(0);
}

/* ---------- Snap ---------- */
function snapGame(stage, api){
  const two = api.two;
  const wrap = el('div', 'table');
  const status = el('p', 'tools', two ? 'Player 1 presses A, player 2 presses L. Snap on a matching pair.' : 'Watch the pile. Hit Snap when two cards in a row match.');
  status.setAttribute('aria-live', 'polite');
  const pileBox = el('div', 'hand big');
  const btnRow = el('div', 'tools');
  const snapB = btn('btn primary snap-btn', two ? 'Player 1 · A' : 'SNAP!');
  const snapB2 = btn('btn primary snap-btn', 'Player 2 · L');
  snapB2.hidden = !two;
  btnRow.append(snapB, snapB2);
  const livesEl = el('div', 'hand-label');
  wrap.append(livesEl, pileBox, status, btnRow); stage.appendChild(wrap);
  let deck = newDeck(), pile = [], score = 0, lives = 3, pts = {1:0, 2:0}, phase = 'ready', timers = [], gap = 1100, cpuT = null, matchAt = 0;
  const later = (f, ms) => { const id = setTimeout(f, ms); timers.push(id); return id; };
  function render(){
    pileBox.replaceChildren(pile.length ? cardEl(pile[pile.length - 1]) : cardEl(null));
    livesEl.textContent = two ? `Player 1: ${pts[1]} · Player 2: ${pts[2]} · cards left ${deck.length}`
      : `Lives ${'♥'.repeat(Math.max(0, lives))}${'♡'.repeat(Math.max(0, 3 - lives))} · cards left ${deck.length}`;
    api.score(two ? `${pts[1]}–${pts[2]}` : score);
  }
  function finish(){
    phase = 'over'; render();
    if (two){
      const winner = pts[1] === pts[2] ? 0 : pts[1] > pts[2] ? 1 : 2;
      status.textContent = winner ? `Player ${winner} wins ${Math.max(pts[1], pts[2])} to ${Math.min(pts[1], pts[2])}.` : `A draw at ${pts[1]} each.`;
      later(() => api.over(`${pts[1]}–${pts[2]}`, {won:true, title: winner ? `Player ${winner} wins` : 'A draw'}), 900);
      return;
    }
    later(() => api.over(score), 900);
  }
  function flip(){
    if (phase === 'over') return;
    if (!deck.length){ status.textContent = 'The deck is finished.'; finish(); return; }
    const card = deck.pop(), prev = pile[pile.length - 1];
    pile.push(card); render();
    const match = prev && prev.r === card.r;
    if (match){
      matchAt = performance.now();
      phase = 'match';
      if (!two) cpuT = later(() => {
        if (phase !== 'match') return;
        lives--;
        status.textContent = `Too slow! The computer snapped the ${RANK_NAME[card.r] || card.r}s.`;
        pile = [];
        if (lives <= 0){ finish(); return; }
        phase = 'play'; render(); later(flip, gap);
      }, 700 + rand(500));
      else cpuT = later(() => {
        if (phase !== 'match') return;
        status.textContent = 'Nobody snapped that one.';
        pile = []; phase = 'play'; render(); later(flip, gap);
      }, 1600);
    } else {
      phase = 'play';
      later(flip, gap);
    }
    gap = Math.max(450, gap - 12);
  }
  function snap(player){
    if (phase === 'ready'){ phase = 'play'; status.textContent = 'Watch the pile…'; later(flip, 700); return; }
    if (phase === 'over') return;
    if (phase === 'match'){
      clearTimeout(cpuT);
      const ms = Math.round(performance.now() - matchAt);
      if (two){ pts[player]++; status.textContent = `Player ${player} snapped it in ${ms} ms.`; }
      else { score++; status.textContent = `Snap! You took the pile in ${ms} ms.`; }
      pile = []; phase = 'play'; render(); later(flip, gap);
    } else if (two){
      pts[player] = Math.max(0, pts[player] - 1);
      status.textContent = `No match. Player ${player} loses a point.`;
      render();
    } else {
      lives--;
      status.textContent = 'No match there. That costs a life.';
      if (lives <= 0){ finish(); return; }
      render();
    }
  }
  api.on(snapB, 'click', () => snap(1));
  api.on(snapB2, 'click', () => snap(2));
  api.on(window, 'keydown', e => {
    if (e.repeat) return;
    if (two){
      if (e.code === 'KeyA'){ e.preventDefault(); snap(1); }
      if (e.code === 'KeyL'){ e.preventDefault(); snap(2); }
      if (e.code === 'Space' && phase === 'ready'){ e.preventDefault(); snap(1); }
      return;
    }
    if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); snap(1); }
  });
  render(); api.score(two ? '0–0' : 0);
  return () => timers.forEach(clearTimeout);
}

/* ---------- Klondike Solitaire ---------- */
function klondikeGame(stage, api){
  const wrap = el('div', 'table klondike');
  const top = el('div', 'kl-top');
  const stockBox = el('div', 'stock'), wasteBox = el('div', 'kl-waste');
  const foundBoxes = [0, 1, 2, 3].map(() => el('div'));
  top.append(stockBox, wasteBox, el('div', 'kl-gap'), ...foundBoxes);
  const cols = el('div', 'kl-cols');
  const status = el('p', 'tools', 'Build the four piles up from ace to king.');
  status.setAttribute('aria-live', 'polite');
  const autoB = btn('btn small', 'Send what fits home');
  const tools = el('div', 'tools'); tools.append(autoB);
  wrap.append(top, cols, status, tools); stage.appendChild(wrap);
  const deck = newDeck();
  const tableau = [...Array(7)].map((_, i) => {
    const pile = deck.splice(0, i + 1).map((card, k) => ({card, up:k === i}));
    return pile;
  });
  let stock = deck.map(card => ({card, up:false})), waste = [], found = [[], [], [], []], sel = null, home = 0, over = false;
  const isRed = c => c.s === '♥' || c.s === '♦';
  function canStack(card, onto){ return onto ? (isRed(card) !== isRed(onto.card) && card.r === onto.card.r - 1) : card.r === 13; }
  function canFound(card, pile){ return pile.length ? (pile[pile.length - 1].s === card.s && card.r === pile[pile.length - 1].r + 1) : card.r === 1; }
  function moveToFound(card, from){
    for (let f = 0; f < 4; f++){
      if (!canFound(card, found[f])) continue;
      found[f].push({card, up:true}); from(); home++; api.score(home);
      if (home === 52){ over = true; render(); api.over(home, {won:true, title:'Solitaire solved'}); return true; }
      return true;
    }
    return false;
  }
  function autoPlay(){
    let moved = true, n = 0;
    while (moved && !over){
      moved = false;
      if (waste.length && moveToFound(waste[waste.length - 1].card, () => waste.pop())){ moved = true; n++; continue; }
      for (let i = 0; i < 7; i++){
        const pile = tableau[i];
        if (!pile.length) continue;
        const topCard = pile[pile.length - 1];
        if (topCard.up && moveToFound(topCard.card, () => { pile.pop(); if (pile.length) pile[pile.length - 1].up = true; })){ moved = true; n++; break; }
      }
    }
    status.textContent = n ? `Sent ${n} card${n === 1 ? '' : 's'} home.` : 'Nothing can go home yet.';
    render();
  }
  function drawStock(){
    if (over) return;
    if (!stock.length){
      if (!waste.length){ status.textContent = 'No cards left to turn.'; return; }
      stock = waste.reverse().map(x => ({card:x.card, up:false}));
      waste = [];
      status.textContent = 'Waste pile turned back over.';
    } else {
      const x = stock.pop(); x.up = true; waste.push(x);
    }
    sel = null; render();
  }
  function pick(where, i, k){
    if (over) return;
    if (where === 'waste'){
      if (!waste.length) return;
      sel = sel && sel.where === 'waste' ? null : {where:'waste'};
      render(); return;
    }
    if (where === 'tab'){
      const pile = tableau[i];
      if (!pile.length){
        if (sel) drop(i);
        return;
      }
      if (k === undefined) k = pile.length - 1;
      if (!pile[k].up){ render(); return; }
      if (sel && sel.where === 'tab' && sel.i === i && sel.k === k){ sel = null; render(); return; }
      if (sel && k === pile.length - 1 && drop(i)) return;
      sel = {where:'tab', i, k};
      render(); return;
    }
    if (where === 'found'){
      if (!sel) return;
      const card = sel.where === 'waste' ? waste[waste.length - 1].card : tableau[sel.i][sel.k].card;
      const single = sel.where === 'waste' || sel.k === tableau[sel.i].length - 1;
      if (!single || !canFound(card, found[i])){ status.textContent = 'That card cannot go there yet.'; return; }
      found[i].push({card, up:true});
      if (sel.where === 'waste') waste.pop();
      else { tableau[sel.i].pop(); const p = tableau[sel.i]; if (p.length) p[p.length - 1].up = true; }
      home++; api.score(home); sel = null;
      if (home === 52){ over = true; render(); api.over(home, {won:true, title:'Solitaire solved'}); return; }
      render();
    }
  }
  function drop(i){
    if (!sel) return false;
    const pile = tableau[i];
    const onto = pile.length ? pile[pile.length - 1] : null;
    const moving = sel.where === 'waste' ? [waste[waste.length - 1]] : tableau[sel.i].slice(sel.k);
    if (onto && !onto.up) return false;
    if (!canStack(moving[0].card, onto)){ status.textContent = 'That is not a legal move.'; sel = null; render(); return false; }
    if (sel.where === 'waste') waste.pop();
    else { tableau[sel.i].splice(sel.k); const p = tableau[sel.i]; if (p.length) p[p.length - 1].up = true; }
    moving.forEach(m => pile.push({card:m.card, up:true}));
    sel = null; status.textContent = ''; render();
    return true;
  }
  function render(){
    const sb = stock.length || waste.length ? cardEl(null, {button:true}) : el('div', 'pcard ghost');
    if (sb.tagName === 'BUTTON'){
      sb.setAttribute('aria-label', `Turn a card, ${stock.length} left`);
      sb.disabled = over;
      sb.addEventListener('click', drawStock);
      if (!stock.length){ sb.classList.remove('back'); sb.classList.add('ghost'); sb.textContent = '↻'; }
    }
    stockBox.replaceChildren(sb, el('span', 'stock-count', `${stock.length}`));
    if (waste.length){
      const wb = cardEl(waste[waste.length - 1].card, {button:true});
      if (sel && sel.where === 'waste') wb.classList.add('picked');
      wb.disabled = over;
      wb.addEventListener('click', () => pick('waste'));
      wasteBox.replaceChildren(wb);
    } else wasteBox.replaceChildren(el('div', 'pcard ghost'));
    found.forEach((pile, f) => {
      const b = pile.length ? cardEl(pile[pile.length - 1].card, {button:true}) : btn('pcard ghost', SUITS[f]);
      b.disabled = over;
      b.setAttribute('aria-label', `Home pile ${SUIT_NAME[SUITS[f]]}: ${pile.length ? cardName(pile[pile.length - 1].card) : 'empty'}`);
      b.addEventListener('click', () => pick('found', f));
      foundBoxes[f].replaceChildren(b);
    });
    cols.replaceChildren(...tableau.map((pile, i) => {
      const d = el('div', 'kl-col');
      if (!pile.length){
        const gap = btn('pcard ghost', '');
        gap.setAttribute('aria-label', `Empty column ${i + 1}`);
        gap.disabled = over;
        gap.addEventListener('click', () => pick('tab', i));
        d.appendChild(gap);
      }
      pile.forEach((x, k) => {
        const b = cardEl(x.up ? x.card : null, {button:true, down:!x.up});
        if (sel && sel.where === 'tab' && sel.i === i && k >= sel.k) b.classList.add('picked');
        b.disabled = over;
        b.setAttribute('aria-label', x.up ? `Column ${i + 1}: ${cardName(x.card)}` : `Column ${i + 1}: face-down card`);
        b.addEventListener('click', () => pick('tab', i, k));
        d.appendChild(b);
      });
      return d;
    }));
    api.score(home);
  }
  api.on(autoB, 'click', autoPlay);
  api.on(window, 'keydown', e => { if (e.code === 'KeyD'){ e.preventDefault(); drawStock(); } });
  render(); api.score(0);
}

/* ---------- Pinball ---------- */
function pinballGame(stage, api){
  const W = 320, H = 480;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {bg:tok('--cell'), ink:tok('--ink'), card:tok('--card'), wall:tok('--board'), ball:tok('--ink'), flip:tok('--blue'), bump:tok('--tomato'), targ:tok('--sun')};
  const bumpers = [{x:100, y:150, r:22}, {x:220, y:150, r:22}, {x:160, y:230, r:26}];
  const targets = [{x:60, y:90, w:26, h:10}, {x:234, y:90, w:26, h:10}, {x:147, y:60, w:26, h:10}];
  const FL = {len:56, restA:0.42, upA:-0.5};
  const flips = [{x:104, y:406, dir:-1, a:FL.restA, up:false}, {x:216, y:406, dir:1, a:FL.restA, up:false}];
  let ball = null, balls = 3, score = 0, state = 'ready', raf, last = 0, msg = '';
  function launch(){
    if (state === 'ready'){ state = 'play'; }
    if (ball || state !== 'play') return;
    ball = {x:W - 16, y:H - 60, vx:0, vy:-11.5, r:8};
    msg = '';
  }
  function flipTip(f){ return {x:f.x + Math.cos(f.a) * FL.len * f.dir, y:f.y + Math.sin(f.a) * FL.len}; }
  function segmentHit(f){
    const tip = flipTip(f);
    const dx = tip.x - f.x, dy = tip.y - f.y;
    const len2 = dx * dx + dy * dy;
    let t = ((ball.x - f.x) * dx + (ball.y - f.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    const px = f.x + dx * t, py = f.y + dy * t;
    const d = Math.hypot(ball.x - px, ball.y - py);
    if (d > ball.r + 5) return false;
    let nx = (ball.x - px) / (d || 1), ny = (ball.y - py) / (d || 1);
    const dot = ball.vx * nx + ball.vy * ny;
    ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
    const kick = f.up ? 7 + t * 5 : 1.5;
    ball.vx += nx * kick; ball.vy += ny * kick;
    ball.x = px + nx * (ball.r + 5.5); ball.y = py + ny * (ball.r + 5.5);
    return true;
  }
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    flips.forEach(f => {
      const want = f.up ? FL.upA : FL.restA;
      f.a += (want - f.a) * Math.min(1, 0.45 * k);
    });
    if (state === 'play' && ball){
      ball.vy += 0.26 * k;
      const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * k / 4));
      for (let s = 0; s < steps; s++){
        ball.x += ball.vx * k / steps; ball.y += ball.vy * k / steps;
        if (ball.x < 14 + ball.r){ ball.x = 14 + ball.r; ball.vx = Math.abs(ball.vx) * 0.9; }
        if (ball.x > W - 14 - ball.r){ ball.x = W - 14 - ball.r; ball.vx = -Math.abs(ball.vx) * 0.9; }
        if (ball.y < 30 + ball.r){ ball.y = 30 + ball.r; ball.vy = Math.abs(ball.vy) * 0.9; }
        bumpers.forEach(b => {
          const d = Math.hypot(ball.x - b.x, ball.y - b.y);
          if (d > b.r + ball.r) return;
          const nx = (ball.x - b.x) / d, ny = (ball.y - b.y) / d;
          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx -= 2 * dot * nx; ball.vy -= 2 * dot * ny;
          ball.vx += nx * 3.2; ball.vy += ny * 3.2;
          ball.x = b.x + nx * (b.r + ball.r + 1); ball.y = b.y + ny * (b.r + ball.r + 1);
          b.lit = 12; score += 100; api.score(score);
        });
        targets.forEach(tg => {
          if (tg.down) return;
          if (ball.x > tg.x - ball.r && ball.x < tg.x + tg.w + ball.r && ball.y > tg.y - ball.r && ball.y < tg.y + tg.h + ball.r){
            tg.down = 90; ball.vy = Math.abs(ball.vy) * 0.8 + 1;
            score += 250; api.score(score);
            if (targets.every(x => x.down)){ score += 1000; api.score(score); msg = 'All targets down! +1000'; targets.forEach(x => { x.down = 40; }); }
          }
        });
        flips.forEach(segmentHit);
        if (ball.y > H + 20){
          balls--;
          ball = null;
          if (balls <= 0){ state = 'over'; draw(); api.over(score); return; }
          msg = `Ball lost. ${balls} left.`;
          break;
        }
      }
      const sp = Math.hypot(ball ? ball.vx : 0, ball ? ball.vy : 0);
      if (ball && sp > 16){ ball.vx *= 16 / sp; ball.vy *= 16 / sp; }
    }
    bumpers.forEach(b => { if (b.lit) b.lit -= k; });
    targets.forEach(tg => { if (tg.down){ tg.down -= k; if (tg.down <= 0) tg.down = 0; } });
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = col.wall;
    g.fillRect(0, 0, 14, H); g.fillRect(W - 14, 0, 14, H); g.fillRect(0, 0, W, 30);
    g.beginPath(); g.moveTo(14, 330); g.lineTo(90, 400); g.lineTo(14, 400); g.fill();
    g.beginPath(); g.moveTo(W - 14, 330); g.lineTo(W - 90, 400); g.lineTo(W - 14, 400); g.fill();
    bumpers.forEach(b => {
      g.fillStyle = b.lit > 0 ? col.targ : col.bump;
      g.beginPath(); g.arc(b.x, b.y, b.r, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); g.fill();
    });
    targets.forEach(tg => { g.fillStyle = tg.down ? col.wall : col.targ; rr(g, tg.x, tg.y, tg.w, tg.h, 4); g.fill(); });
    flips.forEach(f => {
      const tip = flipTip(f);
      g.strokeStyle = col.flip; g.lineWidth = 13; g.lineCap = 'round';
      g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(tip.x, tip.y); g.stroke();
    });
    if (ball){ g.fillStyle = col.ball; g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = col.ink; g.font = `700 14px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`Balls ${'●'.repeat(Math.max(0, balls))}`, 20, 8);
    g.textBaseline = 'middle';
    if (msg) pill(g, W, H, msg, col.ink, col.card);
    else if (state === 'ready') pill(g, W, H, 'Space or tap to launch, then flip', col.ink, col.card);
    else if (!ball) pill(g, W, H, 'Space or tap to launch', col.ink, col.card);
  }
  const setFlip = (side, on) => { flips[side].up = on; };
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ e.preventDefault(); setFlip(0, true); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ e.preventDefault(); setFlip(1, true); }
    if (e.code === 'Space'){ e.preventDefault(); if (!e.repeat) launch(); }
  });
  api.on(window, 'keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') setFlip(0, false);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') setFlip(1, false);
  });
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    try { c.setPointerCapture(e.pointerId); } catch {}
    const p = toLocal(c, e);
    if (!ball || state === 'ready'){ launch(); return; }
    setFlip(p.x < W / 2 ? 0 : 1, true);
  });
  api.on(c, 'pointerup', () => { setFlip(0, false); setFlip(1, false); });
  api.on(c, 'pointercancel', () => { setFlip(0, false); setFlip(1, false); });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Bucket Drop ---------- */
function bucketGame(stage, api){
  const W = 400, H = 420;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {bg:tok('--cell'), ink:tok('--ink'), card:tok('--card'), bomb:tok('--tomato'), gold:tok('--sun'), bucket:tok('--blue'), dropper:tok('--grape')};
  const me = {x:W / 2, w:76, h:16, y:H - 40};
  let dropper = {x:W / 2, vx:2.4}, items = [], score = 0, lives = 3, level = 1, caught = 0, state = 'ready', raf, last = 0, acc = 0;
  const keys = {l:false, r:false};
  let ptr = null;
  function tick(t){
    const dt = last ? Math.min(50, t - last) : 0; last = t;
    const k = dt / 16.67;
    if (state === 'play'){
      dropper.x += dropper.vx * k * (1 + level * 0.12);
      if (dropper.x < 30 || dropper.x > W - 30) dropper.vx *= -1;
      acc += dt;
      const every = Math.max(260, 900 - level * 60);
      while (acc >= every){ acc -= every; items.push({x:dropper.x, y:52, vy:1.8 + level * 0.35, gold:Math.random() < 0.12}); }
      if (keys.l) me.x -= 7 * k;
      if (keys.r) me.x += 7 * k;
      if (ptr !== null) me.x += Math.max(-10 * k, Math.min(10 * k, ptr - me.x));
      me.x = Math.max(me.w / 2, Math.min(W - me.w / 2, me.x));
      for (const it of items){
        it.y += it.vy * k;
        if (!it.done && it.y + 8 >= me.y && it.y - 8 <= me.y + me.h && Math.abs(it.x - me.x) < me.w / 2 + 6){
          it.done = true;
          score += it.gold ? 25 : 5; caught++;
          api.score(score);
          if (caught % 12 === 0){ level++; }
        }
      }
      const missed = items.filter(it => !it.done && it.y > H);
      missed.forEach(it => { if (!it.gold) lives--; });
      items = items.filter(it => !it.done && it.y <= H);
      if (lives <= 0){ state = 'over'; draw(); api.over(score); return; }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = col.dropper;
    rr(g, dropper.x - 26, 16, 52, 28, 8); g.fill();
    g.fillStyle = '#fff'; g.fillRect(dropper.x - 6, 44, 12, 8);
    items.forEach(it => {
      g.fillStyle = it.gold ? col.gold : col.bomb;
      g.beginPath(); g.arc(it.x, it.y, 9, 0, Math.PI * 2); g.fill();
      g.strokeStyle = col.ink; g.lineWidth = 2;
      g.beginPath(); g.moveTo(it.x + 4, it.y - 8); g.quadraticCurveTo(it.x + 12, it.y - 16, it.x + 16, it.y - 10); g.stroke();
    });
    g.fillStyle = col.bucket;
    g.beginPath();
    g.moveTo(me.x - me.w / 2, me.y); g.lineTo(me.x + me.w / 2, me.y);
    g.lineTo(me.x + me.w / 2 - 8, me.y + me.h + 12); g.lineTo(me.x - me.w / 2 + 8, me.y + me.h + 12);
    g.closePath(); g.fill();
    g.fillStyle = col.ink; g.font = `700 15px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`♥${'●'.repeat(Math.max(0, lives))}  Speed ${level}`, 10, 8);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Catch them all. Arrows or drag.', col.ink, col.card);
  }
  const begin = () => { if (state === 'ready') state = 'play'; };
  api.on(c, 'pointerdown', e => { e.preventDefault(); ptr = toLocal(c, e).x; begin(); });
  api.on(c, 'pointermove', e => { if (ptr !== null || e.pointerType === 'mouse') ptr = toLocal(c, e).x; });
  api.on(c, 'pointerup', e => { if (e.pointerType !== 'mouse') ptr = null; });
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; ptr = null; e.preventDefault(); begin(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; ptr = null; e.preventDefault(); begin(); }
    if (e.code === 'Space'){ e.preventDefault(); begin(); }
  });
  api.on(window, 'keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
  });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Tank Duel ---------- */
function tankGame(stage, api){
  const W = 480, H = 320, two = api.two;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {sky:tok('--cell'), ground:tok('--board'), ink:tok('--ink'), card:tok('--card'), p1:tok('--blue'), p2:tok('--tomato'), shell:tok('--ink')};
  let terrain = [], tanks = [], turn = 0, shell = null, wind = 0, state = 'ready', raf, last = 0, msg = '', wins = [0, 0], aim = null, busy = false;
  function makeTerrain(){
    terrain = [];
    let y = H - 70;
    for (let x = 0; x <= W; x += 10){
      y += (Math.random() - 0.5) * 16;
      y = Math.max(H - 150, Math.min(H - 40, y));
      terrain.push(y);
    }
    const flat = (i) => { for (let k = -2; k <= 2; k++) terrain[i + k] = terrain[i]; };
    flat(4); flat(terrain.length - 5);
    tanks = [{x:40, angle:-0.7, power:12, hp:100, col:col.p1},
             {x:W - 40, angle:-Math.PI + 0.7, power:12, hp:100, col:col.p2}];
    wind = (Math.random() - 0.5) * 0.06;
  }
  const groundAt = x => terrain[Math.max(0, Math.min(terrain.length - 1, Math.round(x / 10)))];
  function fire(){
    if (shell || busy || state !== 'play') return;
    const t = tanks[turn];
    shell = {x:t.x + Math.cos(t.angle) * 18, y:groundAt(t.x) - 12 + Math.sin(t.angle) * 18,
             vx:Math.cos(t.angle) * t.power * 0.42, vy:Math.sin(t.angle) * t.power * 0.42};
    busy = true;
  }
  function boom(x, y){
    const r = 26;
    for (let i = 0; i < terrain.length; i++){
      const d = Math.abs(i * 10 - x);
      if (d < r) terrain[i] = Math.min(H - 10, terrain[i] + (r - d) * 0.5);
    }
    tanks.forEach((t, i) => {
      const d = Math.hypot(t.x - x, groundAt(t.x) - 10 - y);
      if (d < 34){ t.hp -= Math.round(46 - d); }
    });
    shell = null;
    const dead = tanks.findIndex(t => t.hp <= 0);
    if (dead >= 0){
      const winner = 1 - dead;
      wins[winner]++;
      api.score(two ? `${wins[0]}–${wins[1]}` : wins[0]);
      if (two){
        msg = `Player ${winner + 1} wins the round!`;
        state = 'between';
        setTimeout(() => { if (state === 'between'){ makeTerrain(); turn = 0; msg = ''; state = 'play'; busy = false; } }, 1600);
      } else if (winner === 0){
        msg = 'You knocked it out! Next round.';
        state = 'between';
        setTimeout(() => { if (state === 'between'){ makeTerrain(); turn = 0; msg = ''; state = 'play'; busy = false; } }, 1600);
      } else { state = 'over'; msg = 'Your tank is out.'; draw(); api.over(wins[0]); }
      return;
    }
    turn = 1 - turn;
    busy = false;
    if (!two && turn === 1) setTimeout(cpuShot, 700);
  }
  function cpuShot(){
    if (state !== 'play') return;
    const t = tanks[1], foe = tanks[0];
    const dx = foe.x - t.x, dy = (groundAt(foe.x) - 10) - (groundAt(t.x) - 10);
    let best = {err:Infinity};
    for (let a = -Math.PI + 0.25; a < -Math.PI / 2; a += 0.05){
      for (let p = 8; p <= 20; p += 0.5){
        let x = t.x, y = groundAt(t.x) - 12, vx = Math.cos(a) * p * 0.42, vy = Math.sin(a) * p * 0.42;
        for (let s = 0; s < 400; s++){
          vy += 0.14; vx += wind; x += vx; y += vy;
          if (y > groundAt(x) || x < 0 || x > W) break;
        }
