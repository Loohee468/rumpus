  api.on(window, 'keydown', e => {
    const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
    if (m){ e.preventDefault(); put(+m[1]); }
    else if (e.code === 'Backspace' || e.code === 'Delete'){ e.preventDefault(); put(null); }
  });
  render(); api.score(0);
  return () => clearInterval(timer);
}

/* ---------- Untangle ---------- */
function untangleGame(stage, api){
  const N = 9, W = 420, H = 420, R = 15;
  const label = el('p', 'tools');
  label.setAttribute('aria-live', 'polite');
  stage.appendChild(label);
  const [c, g] = makeCanvas(stage, W, H);
  const col = {bg:tok('--cell'), edge:tok('--muted'), cross:tok('--tomato'), node:tok('--blue'), ink:tok('--ink'), card:tok('--card'), done:tok('--mint')};
  const edges = [];
  const poly = [...Array(N).keys()];
  for (let i = 0; i < N; i++) edges.push([i, (i + 1) % N]);
  (function triangulate(list){
    if (list.length < 4) return;
    const k = 1 + rand(list.length - 3) + 1;
    const a = list[0], b = list[k];
    edges.push([a, b]);
    triangulate(list.slice(0, k + 1));
    triangulate(list.slice(k).concat([a]));
  })(poly);
  const nodes = [...Array(N)].map(() => ({x:60 + Math.random() * (W - 120), y:60 + Math.random() * (H - 120)}));
  let drag = -1, moves = 0, done = false;
  const cross = (p1, p2, p3, p4) => {
    const d = (a, b, cc) => (cc.x - a.x) * (b.y - a.y) - (cc.y - a.y) * (b.x - a.x);
    const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  };
  function crossings(){
    const bad = new Set();
    for (let i = 0; i < edges.length; i++) for (let j = i + 1; j < edges.length; j++){
      const [a, b] = edges[i], [x, y] = edges[j];
      if (a === x || a === y || b === x || b === y) continue;
      if (cross(nodes[a], nodes[b], nodes[x], nodes[y])){ bad.add(i); bad.add(j); }
    }
    return bad;
  }
  function draw(){
    const bad = crossings();
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    edges.forEach(([a, b], i) => {
      g.strokeStyle = bad.has(i) ? col.cross : done ? col.done : col.edge;
      g.lineWidth = bad.has(i) ? 4 : 3;
      g.beginPath(); g.moveTo(nodes[a].x, nodes[a].y); g.lineTo(nodes[b].x, nodes[b].y); g.stroke();
    });
    nodes.forEach((n, i) => {
      g.fillStyle = i === drag ? col.done : col.node;
      g.beginPath(); g.arc(n.x, n.y, R, 0, Math.PI * 2); g.fill();
      g.strokeStyle = col.ink; g.lineWidth = 2; g.stroke();
    });
    label.textContent = done ? `Untangled in ${moves} drags!` : `${bad.size ? bad.size / 2 + ' crossing' + (bad.size > 2 ? 's' : '') : 'No crossings'} · drag the dots apart`;
    return bad.size;
  }
  function check(){
    if (!done && draw() === 0){ done = true; draw(); api.over(moves, {won:true, title:'Untangled'}); }
  }
  const nodeAt = p => nodes.findIndex(n => Math.hypot(n.x - p.x, n.y - p.y) < R + 8);
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    try { c.setPointerCapture(e.pointerId); } catch {}
    drag = nodeAt(toLocal(c, e));
    if (drag >= 0) moves++;
    api.score(moves);
    draw();
  });
  api.on(c, 'pointermove', e => {
    if (drag < 0 || done) return;
    const p = toLocal(c, e);
    nodes[drag].x = Math.max(R, Math.min(W - R, p.x));
    nodes[drag].y = Math.max(R, Math.min(H - R, p.y));
    draw();
  });
  api.on(c, 'pointerup', () => { drag = -1; check(); });
  api.on(c, 'pointercancel', () => { drag = -1; });
  draw(); api.score(0);
}

/* ---------- Domineering ---------- */
function domGame(stage, api){
  const N = 8, two = api.two;
  const {status, nextB, board} = streakShell(stage, 'domino', 'You place upright dominoes, the computer places flat ones.');
  board.style.gridTemplateColumns = `repeat(${N},1fr)`;
  board.style.gridTemplateRows = `repeat(${N},1fr)`;
  let grid = Array(N * N).fill(0), turn = 1, busy = false, done = false, streak = 0, wins = [0, 0], t = null;
  const cells = grid.map((_, i) => { const b = btn('dom'); board.appendChild(b); api.on(b, 'click', () => play(i)); return b; });
  const movesFor = p => {
    const out = [];
    for (let r = 0; r < N; r++) for (let q = 0; q < N; q++){
      const i = r * N + q;
      if (p === 1){ if (r < N - 1 && !grid[i] && !grid[i + N]) out.push([i, i + N]); }
      else if (q < N - 1 && !grid[i] && !grid[i + 1]) out.push([i, i + 1]);
    }
    return out;
  };
  function render(){
    const legal = new Set(movesFor(1).map(m => m[0]));
    cells.forEach((b, i) => {
      b.className = 'dom' + (grid[i] === 1 ? ' p1' : grid[i] === 2 ? ' p2' : '');
      b.disabled = done || busy || (two ? false : !legal.has(i));
      b.setAttribute('aria-label', `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}, ${grid[i] ? (grid[i] === 1 ? 'upright domino' : 'flat domino') : 'empty'}`);
    });
    api.score(two ? `${wins[0]}–${wins[1]}` : streak);
  }
  function finish(winner){
    done = true; busy = false;
    if (two){
      wins[winner - 1]++;
      status.textContent = `Player ${3 - winner} has no room left. Player ${winner} wins!`;
      render(); nextB.hidden = false; nextB.focus(); return;
    }
    if (winner === 1){ streak++; status.textContent = 'The computer has no room left. You win!'; render(); nextB.hidden = false; nextB.focus(); }
    else { status.textContent = 'You have no room left.'; render(); api.over(streak); }
  }
  function place(pair, p){ pair.forEach(i => { grid[i] = p; }); }
  function cpuTurn(){
    busy = true; status.textContent = 'Computer is thinking…'; render();
    t = setTimeout(() => {
      const moves = movesFor(2);
      if (!moves.length){ finish(1); return; }
      let best = moves[0], bestScore = -Infinity;
      for (const m of moves){
        place(m, 2);
        const s = movesFor(2).length - movesFor(1).length + Math.random();
        place(m, 0);
        if (s > bestScore){ bestScore = s; best = m; }
      }
      place(best, 2);
      busy = false;
      if (!movesFor(1).length){ finish(2); return; }
      status.textContent = 'Your move.';
      render();
    }, 400);
  }
  function play(i){
    if (busy || done) return;
    const p = two ? turn : 1;
    const pair = p === 1 ? [i, i + N] : [i, i + 1];
    const ok = p === 1
      ? (Math.floor(i / N) < N - 1 && !grid[i] && !grid[i + N])
      : (i % N < N - 1 && !grid[i] && !grid[i + 1]);
    if (!ok){ status.textContent = p === 1 ? 'An upright domino needs two free squares one above the other.' : 'A flat domino needs two free squares side by side.'; return; }
    place(pair, p);
    render();
    if (two){
      turn = 3 - turn;
      if (!movesFor(turn).length){ finish(3 - turn); return; }
      status.textContent = `Player ${turn}, your move. ${turn === 1 ? 'Upright' : 'Flat'} dominoes.`;
      return;
    }
    if (!movesFor(2).length){ finish(1); return; }
    cpuTurn();
  }
  function newRound(){
    grid = Array(N * N).fill(0); done = false; turn = 1; nextB.hidden = true;
    status.textContent = two ? 'Player 1, place an upright domino.' : 'Your move.';
    render();
  }
  api.on(nextB, 'click', newRound);
  render();
  return () => clearTimeout(t);
}

/* ---------- Corners ---------- */
function cornersGame(stage, api){
  const N = 6, two = api.two;
  const {status, nextB, board} = streakShell(stage, 'corners', 'Race your four pieces into the far corner.');
  board.style.gridTemplateColumns = `repeat(${N},1fr)`;
  board.style.gridTemplateRows = `repeat(${N},1fr)`;
  const HOME1 = [N * N - 1, N * N - 2, N * N - 1 - N, N * N - 2 - N];
  const HOME2 = [0, 1, N, N + 1];
  let grid, sel = -1, turn = 1, busy = false, done = false, streak = 0, wins = [0, 0], t = null;
  const cells = [...Array(N * N)].map((_, i) => { const b = btn('corner'); board.appendChild(b); api.on(b, 'click', () => tap(i)); return b; });
  function reset(){
    grid = Array(N * N).fill(0);
    HOME2.forEach(i => { grid[i] = 1; });
    HOME1.forEach(i => { grid[i] = 2; });
    sel = -1; turn = 1; done = false; nextB.hidden = true;
  }
  const inB = (r, q) => r >= 0 && q >= 0 && r < N && q < N;
  function movesFrom(i){
    const r = Math.floor(i / N), q = i % N, out = [];
    for (const [dr, dq] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
      const y = r + dr, x = q + dq;
      if (!inB(y, x)) continue;
      const j = y * N + x;
      if (!grid[j]) out.push(j);
      else {
        const y2 = y + dr, x2 = x + dq;
        if (inB(y2, x2) && !grid[y2 * N + x2]) out.push(y2 * N + x2);
      }
    }
    return out;
  }
  const wonBy = p => (p === 1 ? HOME1 : HOME2).every(i => grid[i] === p);
  function render(){
    const legal = sel >= 0 ? movesFrom(sel) : [];
    cells.forEach((b, i) => {
      b.className = 'corner' + (grid[i] === 1 ? ' p1' : grid[i] === 2 ? ' p2' : '') +
        (HOME1.includes(i) ? ' goal1' : '') + (HOME2.includes(i) ? ' goal2' : '') +
        (i === sel ? ' sel' : '') + (legal.includes(i) ? ' target' : '');
      b.disabled = done || busy;
      b.setAttribute('aria-label', `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}, ${grid[i] === 1 ? 'your piece' : grid[i] === 2 ? "opponent's piece" : legal.includes(i) ? 'you can move here' : 'empty'}`);
    });
    api.score(two ? `${wins[0]}–${wins[1]}` : streak);
  }
  function finish(winner){
    done = true; busy = false;
    if (two){
      wins[winner - 1]++;
      status.textContent = `Player ${winner} is home. Player ${winner} wins!`;
      render(); nextB.hidden = false; nextB.focus(); return;
    }
    if (winner === 1){ streak++; status.textContent = 'All four home. You win!'; render(); nextB.hidden = false; nextB.focus(); }
    else { status.textContent = 'The computer got home first.'; render(); api.over(streak); }
  }
  function cpuTurn(){
    busy = true; status.textContent = 'Computer is thinking…'; render();
    t = setTimeout(() => {
      const dist = i => Math.min(...HOME2.map(h => Math.abs(Math.floor(i / N) - Math.floor(h / N)) + Math.abs(i % N - h % N)));
      let best = null, bestScore = -Infinity;
      grid.forEach((v, i) => {
        if (v !== 2) return;
        movesFrom(i).forEach(j => {
          let s = dist(i) - dist(j) + Math.random() * 0.4;
          if (HOME2.includes(i) && !HOME2.includes(j)) s -= 4;
          if (HOME2.includes(j)) s += 3;
          if (s > bestScore){ bestScore = s; best = [i, j]; }
        });
      });
      if (!best){ finish(1); return; }
      grid[best[1]] = 2; grid[best[0]] = 0;
      busy = false;
      if (wonBy(2)){ finish(2); return; }
      turn = 1; status.textContent = 'Your move.'; render();
    }, 420);
  }
  function tap(i){
    if (busy || done) return;
    const p = two ? turn : 1;
    if (grid[i] === p){ sel = sel === i ? -1 : i; render(); return; }
    if (sel < 0 || !movesFrom(sel).includes(i)) return;
    grid[i] = p; grid[sel] = 0; sel = -1;
    render();
    if (wonBy(p)){ finish(p); return; }
    if (two){ turn = 3 - turn; status.textContent = `Player ${turn}, your move.`; return; }
    cpuTurn();
  }
  api.on(nextB, 'click', () => { reset(); status.textContent = 'Your move.'; render(); });
  reset(); render();
  return () => clearTimeout(t);
}

/* ---------- Next Number ---------- */
function sequenceGame(stage, api){
  const LEN = 75;
  const {wrap, startB, timeL} = timedShell(stage, LEN);
  const q = el('div', 'quiz-q seqline', 'Ready?');
  q.setAttribute('aria-live', 'polite');
  const answers = el('div', 'answers');
  const note = el('p', 'help', 'Work out the pattern and pick the next number.');
  wrap.append(q, answers, note);
  const opts = [...Array(4)].map(() => { const b = btn('ans', '?'); b.disabled = true; answers.appendChild(b); return b; });
  let score = 0, playing = false, clock = null, answer = 0, lock = false, t = null;
  function make(){
    const lvl = Math.min(5, Math.floor(score / 3));
    const kind = rand(lvl < 1 ? 2 : lvl < 3 ? 4 : 6);
    let seq = [], a = 1 + rand(9), d = 1 + rand(3 + lvl * 2);
    if (kind === 0){ for (let i = 0; i < 5; i++) seq.push(a + i * d); }
    else if (kind === 1){ d = 2 + rand(3 + lvl); for (let i = 0; i < 5; i++) seq.push(a + 40 - i * d); }
    else if (kind === 2){ const m = 2 + rand(2); for (let i = 0; i < 5; i++) seq.push(a * Math.pow(m, i)); }
    else if (kind === 3){ for (let i = 0; i < 5; i++) seq.push((i + a) * (i + a)); }
    else if (kind === 4){ let x = a, y = a + d; seq = [x, y]; for (let i = 0; i < 3; i++){ const z = x + y; seq.push(z); x = y; y = z; } }
    else { for (let i = 0; i < 5; i++) seq.push(a + i * d + (i % 2 ? d : 0)); }
    answer = seq.pop();
    q.textContent = seq.join('   ') + '   ?';
    q.setAttribute('aria-label', `Sequence: ${seq.join(', ')}. What comes next?`);
    const set = new Set([answer]);
    while (set.size < 4){
      const off = (rand(2) ? 1 : -1) * (1 + rand(Math.max(3, Math.round(Math.abs(answer) * 0.25))));
      const v = answer + off;
      if (v > 0) set.add(v);
    }
    shuffle([...set]).forEach((v, i) => { const o = opts[i]; o.textContent = v; o.dataset.v = v; o.className = 'ans'; o.disabled = false; });
  }
  function choose(o){
    if (!playing || lock || !o) return;
    const ok = +o.dataset.v === answer;
    o.classList.add(ok ? 'right' : 'wrong');
    if (ok){ score++; api.score(score); }
    else opts.find(x => +x.dataset.v === answer).classList.add('right');
    lock = true;
    t = setTimeout(() => { lock = false; if (playing) make(); }, ok ? 300 : 900);
  }
  function end(){
    playing = false; clearTimeout(t);
    opts.forEach(o => { o.disabled = true; });
    q.textContent = "Time's up";
    api.over(score);
  }
  opts.forEach(o => api.on(o, 'click', () => choose(o)));
  api.on(startB, 'click', () => { startB.disabled = true; playing = true; make(); clock = runClock(LEN, timeL, end); });
  api.on(window, 'keydown', e => { const i = digitKey(e, 4); if (i >= 0){ e.preventDefault(); choose(opts[i]); } });
  return () => { clearInterval(clock); clearTimeout(t); };
}

/* ---------- Spider One Suit ---------- */
function spiderGame(stage, api){
  const wrap = el('div', 'table klondike');
  const top = el('div', 'kl-top');
  const stockBox = el('div', 'stock'), doneBox = el('div', 'hand mini');
  top.append(stockBox, el('div', 'kl-gap'), doneBox);
  const cols = el('div', 'kl-cols');
  const status = el('p', 'tools', 'Build runs from king down to ace in the same column.');
  status.setAttribute('aria-live', 'polite');
  wrap.append(top, cols, status); stage.appendChild(wrap);
  let deck = [];
  for (let d = 0; d < 8; d++) for (let r = 1; r <= 13; r++) deck.push({r, s:'♠'});
  deck = shuffle(deck);
  const tableau = [...Array(10)].map((_, i) => {
    const n = i < 4 ? 6 : 5;
    return deck.splice(0, n).map((card, k) => ({card, up:k === n - 1}));
  });
  let stock = deck, sets = 0, moves = 0, sel = null, over = false;
  const runLen = pile => {
    let n = 1;
    for (let i = pile.length - 1; i > 0; i--){
      if (pile[i - 1].up && pile[i - 1].card.r === pile[i].card.r + 1) n++; else break;
    }
    return n;
  };
  function checkComplete(i){
    const pile = tableau[i];
    if (pile.length < 13) return;
    const last13 = pile.slice(-13);
    if (!last13.every(x => x.up)) return;
    for (let k = 0; k < 13; k++) if (last13[k].card.r !== 13 - k) return;
    pile.splice(pile.length - 13, 13);
    if (pile.length) pile[pile.length - 1].up = true;
    sets++; api.score(sets);
    status.textContent = `A full run! ${sets} of 8 done.`;
    if (sets === 8){ over = true; render(); api.over(sets, {won:true, title:'Spider solved'}); }
  }
  function deal(){
    if (over) return;
    if (!stock.length){ status.textContent = 'No cards left to deal.'; return; }
    if (tableau.some(p => !p.length)){ status.textContent = 'Fill every empty column before dealing.'; return; }
    tableau.forEach(p => { const x = stock.pop(); if (x) p.push({card:x, up:true}); });
    sel = null; moves++;
    render();
    tableau.forEach((_, i) => checkComplete(i));
  }
  function pick(i, k){
    if (over) return;
    const pile = tableau[i];
    if (!pile.length){ if (sel) drop(i); else render(); return; }
    if (k === undefined) k = pile.length - 1;
    if (!pile[k].up) return;
    if (sel && sel.i === i && sel.k === k){ sel = null; render(); return; }
    if (sel && drop(i)) return;
    if (pile.length - k > runLen(pile)){ status.textContent = 'Only a run in order can move together.'; return; }
    sel = {i, k};
    render();
  }
  function drop(i){
    if (!sel) return false;
    const from = tableau[sel.i], moving = from.slice(sel.k), pile = tableau[i];
    if (sel.i === i){ sel = null; render(); return true; }
    const onto = pile.length ? pile[pile.length - 1] : null;
    if (onto && onto.card.r !== moving[0].card.r + 1){ status.textContent = 'That card has to go on the next rank up.'; sel = null; render(); return false; }
    from.splice(sel.k);
    if (from.length) from[from.length - 1].up = true;
    moving.forEach(x => pile.push(x));
    sel = null; moves++; status.textContent = '';
    render(); checkComplete(i);
    return true;
  }
  function render(){
    const sb = stock.length ? cardEl(null, {button:true}) : el('div', 'pcard ghost');
    if (stock.length){
      sb.disabled = over;
      sb.setAttribute('aria-label', `Deal a row, ${Math.floor(stock.length / 10)} deals left`);
      sb.addEventListener('click', deal);
    }
    stockBox.replaceChildren(sb, el('span', 'stock-count', `${Math.floor(stock.length / 10)} deals`));
    doneBox.replaceChildren(...[...Array(sets)].map(() => cardEl({r:13, s:'♠'})));
    cols.replaceChildren(...tableau.map((pile, i) => {
      const d = el('div', 'kl-col');
      if (!pile.length){
        const gap = btn('pcard ghost', '');
        gap.disabled = over;
        gap.setAttribute('aria-label', `Empty column ${i + 1}`);
        gap.addEventListener('click', () => pick(i));
        d.appendChild(gap);
      }
      pile.forEach((x, k) => {
        const b = cardEl(x.up ? x.card : null, {button:true, down:!x.up});
        if (sel && sel.i === i && k >= sel.k) b.classList.add('picked');
        b.disabled = over;
        b.setAttribute('aria-label', x.up ? `Column ${i + 1}: ${cardName(x.card)}` : `Column ${i + 1}: face-down card`);
        b.addEventListener('click', () => pick(i, k));
        d.appendChild(b);
      });
      return d;
    }));
    api.score(sets);
  }
  api.on(window, 'keydown', e => { if (e.code === 'KeyD'){ e.preventDefault(); deal(); } });
  render(); api.score(0);
}

/* ---------- Sevens ---------- */
function sevensGame(stage, api){
  const PLAY_SUITS = ['♠', '♥'];
  const wrap = el('div', 'table');
  const cpuL = el('div', 'hand-label'), layout = el('div', 'sevens'), status = el('p', 'tools');
  status.setAttribute('aria-live', 'polite');
  const passB = btn('btn small', 'Pass');
  const youL = el('div', 'hand-label', 'Your hand'), youH = el('div', 'hand');
  wrap.append(cpuL, layout, status, passB, youH, youL); stage.appendChild(wrap);
  let deck, you, cpu, table, phase, wins = 0;
  const timers = [];
  function deal(){
    deck = shuffle(newDeck().filter(cd => PLAY_SUITS.includes(cd.s)));
    you = deck.splice(0, 13); cpu = deck.splice(0, 13);
    table = {};
    PLAY_SUITS.forEach(s => { table[s] = null; });
    phase = you.some(cd => cd.r === 7 && cd.s === '♠') ? 'you' : 'cpu';
    status.textContent = 'Sevens go down first, then build up or down in that suit.';
    render();
    if (phase === 'cpu') timers.push(setTimeout(cpuTurn, 800));
  }
  const playable = cd => {
    const run = table[cd.s];
    if (!run) return cd.r === 7;
    return cd.r === run.lo - 1 || cd.r === run.hi + 1;
  };
  function put(cd){
    const run = table[cd.s];
    if (!run) table[cd.s] = {lo:7, hi:7};
    else if (cd.r < run.lo) run.lo = cd.r;
    else run.hi = cd.r;
  }
  function render(){
    cpuL.textContent = `Computer: ${cpu.length} card${cpu.length === 1 ? '' : 's'}`;
    layout.replaceChildren(...PLAY_SUITS.map(s => {
      const line = el('div', 'sev-row');
      line.appendChild(el('span', 'sev-suit' + (s === '♥' || s === '♦' ? ' red' : ''), s));
      const run = table[s];
      line.appendChild(el('span', 'sev-run', run ? `${RANK_LABEL[run.lo]} to ${RANK_LABEL[run.hi]}` : 'needs the 7'));
      return line;
    }));
    you.sort((a, b) => PLAY_SUITS.indexOf(a.s) - PLAY_SUITS.indexOf(b.s) || a.r - b.r);
    youH.replaceChildren(...you.map((cd, i) => {
      const b = cardEl(cd, {button:true});
      const ok = phase === 'you' && playable(cd);
      if (ok) b.classList.add('can');
      b.disabled = phase !== 'you';
      b.addEventListener('click', () => playCard(i));
      return b;
    }));
    passB.disabled = phase !== 'you' || you.some(playable);
    api.score(wins);
  }
  function playCard(i){
    if (phase !== 'you') return;
    const cd = you[i];
    if (!playable(cd)){ status.textContent = `The ${cardName(cd)} does not fit yet.`; return; }
    put(cd); you.splice(i, 1);
    status.textContent = `You played the ${cardName(cd)}.`;
    if (!you.length){ wins++; api.score(wins); phase = 'over'; render(); status.textContent = 'You are out of cards. You win!'; timers.push(setTimeout(() => api.over(wins, {won:true, title:'You win'}), 1100)); return; }
    phase = 'cpu'; render();
    timers.push(setTimeout(cpuTurn, 700));
  }
  function pass(){
    if (phase !== 'you' || you.some(playable)) return;
    status.textContent = 'You pass.';
    phase = 'cpu'; render();
    timers.push(setTimeout(cpuTurn, 700));
  }
  function cpuTurn(){
    const opts = cpu.filter(playable);
    if (!opts.length){
      status.textContent = 'The computer passes. Your move.';
      phase = 'you'; render();
      if (!you.some(playable)) status.textContent += ' You cannot play either, so pass.';
      return;
    }
    const pick = opts.sort((a, b) => Math.abs(b.r - 7) - Math.abs(a.r - 7))[0];
    put(pick); cpu.splice(cpu.indexOf(pick), 1);
    if (!cpu.length){ phase = 'over'; render(); status.textContent = 'The computer is out of cards.'; timers.push(setTimeout(() => api.over(wins), 1100)); return; }
    status.textContent = `The computer played the ${cardName(pick)}. Your move.`;
    phase = 'you'; render();
  }
  api.on(passB, 'click', pass);
  deal();
  return () => timers.forEach(clearTimeout);
}

   start:fourGame},
  {id:'slide', name:'Slide 15', cat:'Puzzle', c:'var(--card)', desc:'Slide the numbered tiles back into order, 1 to 15.',
   help:'Tap a tile in line with the gap, use the arrow keys, or swipe. Tiles in the right place turn yellow.', metric:'Moves', lower:true, win:'Solved', start:slideGame},
  {id:'lights', name:'Switch Off', cat:'Puzzle', c:'var(--grape)', desc:'Each press flips a light and its neighbours. Turn them all off.',
   help:'Tap a square to flip it and the squares above, below, left and right of it.', metric:'Moves', lower:true, win:'Lights out', start:lightsGame},
  {id:'math', name:'Sum Sprint', cat:'Brain', c:'var(--mint)', desc:'Answer as many sums as you can in 60 seconds. They get harder.',
   help:'Tap an answer or press 1 to 4. Wrong answers take a point off.', metric:'Score', lose:"Time's up", start:mathGame},
  {id:'type', name:'Type Rush', cat:'Brain', c:'var(--tomato)', desc:'Type each word as it appears. See how many you get in a minute.',
   help:'The next word loads as soon as you type the current one correctly.', metric:'Words', lose:"Time's up", start:typeGame},
  {id:'clash', name:'Colour Clash', cat:'Brain', c:'var(--sun)', desc:'Does the word match the colour it is painted in? Decide fast.',
   help:'Left arrow or N for no, right arrow or Y for yes. Wrong answers take a point off.', metric:'Score', lose:"Time's up", start:clashGame},
  {id:'twentyone', name:'Twenty-One', cat:'Cards', c:'var(--mint)', desc:'Beat the dealer to 21 without going over. Keep your win streak alive.',
   help:'Hit takes a card, Stand holds. Face cards count 10 and aces 1 or 11. The dealer draws to 17. Keys: H hit, S stand, D deal.', metric:'Streak', lose:'Streak over', start:twentyOneGame},
  {id:'squares', name:'Poker Squares', cat:'Cards', c:'var(--blue)', desc:'Place 25 cards in a grid so every row and column makes a poker hand.',
   help:'Tap an empty square to place the card shown. Each row and column scores: royal flush 100, straight flush 75, four of a kind 50, full house 25, flush 20, straight 15, three of a kind 10, two pair 5, pair 2.', metric:'Points', lose:'Grid complete', start:squaresGame},
  {id:'hilo', name:'Higher or Lower', cat:'Cards', c:'var(--tomato)', desc:'Guess whether the next card beats this one. One wrong call ends it.',
   help:'Up arrow or H for higher, down arrow or L for lower. A card of the same rank scores nothing but keeps you going.', metric:'Streak', lose:'Wrong call', start:hiloGame},
  {id:'golf', name:'Golf Solitaire', cat:'Cards', c:'var(--sun)', desc:'Clear the columns by playing cards one rank up or down from the pile.',
   help:'Tap a highlighted card to play it, or tap the deck (or press D) for a new pile card. Keys 1 to 7 play a column. Fewer cards left is better.', metric:'Cards left', lower:true, start:golfGame},
  {id:'space', name:'Space Defender', cat:'Arcade', c:'var(--sun)', desc:'Hold back waves of marching aliens before they reach the ground.',
   help:'Arrow keys to move and Space to fire (hold to keep firing). With a mouse or finger, the ship follows you and fires while you press.', metric:'Score', start:spaceGame},
  {id:'rocks', name:'Rock Blaster', cat:'Arcade', c:'var(--mint)', desc:'Fly through a field of space rocks and blast them into smaller pieces.',
   help:'Left and right to turn, up to thrust, Space to fire. On touch, hold where you want to fly and the ship turns, flies and fires for you.', metric:'Score', start:rockGame},
  {id:'road', name:'Road Hopper', cat:'Arcade', c:'var(--card)', desc:'Hop across busy roads and ride logs over rivers. How far can you get?',
   help:'Arrow keys or WASD to hop. Tap to hop forward, or swipe in any direction. On rivers you must land on a log.', metric:'Distance', start:roadGame},
  {id:'stack', name:'Stack Tower', cat:'Arcade', c:'var(--grape)', desc:'Drop each sliding block onto the tower. Overhangs get sliced off.',
   help:'Tap or press Space to drop. Line a block up exactly to keep its full width.', metric:'Height', lose:'Tower toppled', start:stackGame},
  {id:'dash', name:'Dash Runner', cat:'Arcade', c:'var(--tomato)', desc:'Run, jump and double jump over obstacles as the pace picks up.',
   help:'Space, the up arrow or a tap to jump. Press again in the air to double jump. Stay low under the purple bars.', metric:'Distance', start:dashGame},
  {id:'balloon', name:'Balloon Pop', cat:'Reflex', c:'var(--blue)', desc:'Pop the rising balloons before they float away. Avoid the spiky ones.',
   help:'Click or tap balloons. Gold is worth 5. Each balloon that escapes costs a heart, and so does popping a spiky one. Needs a mouse or touch screen.', metric:'Score', start:balloonGame},
  {id:'target', name:'Target Tap', cat:'Reflex', c:'var(--sun)', desc:'Hit shrinking targets in 30 seconds. Faster hits score more.',
   help:'Click or tap targets. Each hit scores 1 to 5 depending on how quickly you got it. Missing costs a point. Needs a mouse or touch screen.', metric:'Score', lose:"Time's up", start:targetGame},
  {id:'sudoku', name:'Sudoku', cat:'Puzzle', c:'var(--card)', desc:'Fill the grid so every row, column and box has the numbers 1 to 9.',
   help:'Pick a square, then tap a number or type it. Arrow keys move around, Backspace clears. Clashing numbers are underlined in red. Every puzzle has exactly one answer.', metric:'Time', lower:true, fmt:mmss, win:'Solved', start:sudokuGame},
  {id:'pixel', name:'Pixel Logic', cat:'Puzzle', c:'var(--mint)', desc:'Use the number clues to shade in a hidden picture.',
   help:'Numbers show the runs of shaded squares in each row and column, in order. Tap to shade. Right-click or use mark mode to cross out squares you know are empty.', metric:'Time', lower:true, fmt:mmss, win:'Picture complete', start:pixelGame},
  {id:'peg', name:'Peg Solitaire', cat:'Puzzle', c:'var(--sun)', desc:'Jump pegs over each other to remove them. Try to finish with just one.',
   help:'Tap a peg, then tap a green hole two spaces away to jump over the peg between. The jumped peg is removed.', metric:'Pegs left', lower:true, start:pegGame},
  {id:'flood', name:'Colour Flood', cat:'Puzzle', c:'var(--card)', desc:'Flood the board from the top-left corner until it is all one colour.',
   help:'Pick a colour (or press 1 to 6) to change your patch, which grows into matching neighbours. You have 25 moves.', metric:'Moves', lower:true, win:'Flooded', lose:'Out of moves', loseText:'The board was not one colour after 25 moves.', start:floodGame},
  {id:'gems', name:'Gem Swap', cat:'Puzzle', c:'var(--grape)', desc:'Swap neighbouring gems to make lines of three. Chain reactions score big.',
   help:'Tap a gem then a neighbour to swap, or swipe a gem. Only swaps that make a line of three count. You have 30 moves.', metric:'Score', lose:'Out of moves', start:gemGame},
  {id:'maze', name:'Maze Run', cat:'Puzzle', c:'var(--blue)', desc:'Find your way through three mazes, each bigger than the last.',
   help:'Arrow keys or WASD move one step. Swiping runs along a corridor until the next turn. Reach the green square.', metric:'Time', lower:true, fmt:mmss, win:'All three mazes done', start:mazeGame},
  {id:'reversi', name:'Reversi', cat:'Board', c:'var(--mint)', desc:'Trap the computer’s discs between yours to flip them. Most discs wins.',
   help:'Dots show where you can play. Your disc must trap a straight line of computer discs, which then flip to your colour. Corners are powerful.', metric:'Discs', two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 is dark, player 2 is light.',
   start:reversiGame},
  {id:'mancala', name:'Mancala', cat:'Board', c:'var(--sun)', desc:'Sow seeds around the board and collect more than the computer.',
   help:'Pick a pit on your (bottom) row. Seeds go one per pit to the right and round. Ending in your store gives another turn. Ending in your own empty pit captures the seeds opposite. Keys 1 to 6 also work.', metric:'Seeds', start:mancalaGame},
  {id:'dots', name:'Dots and Boxes', cat:'Board', c:'var(--tomato)', desc:'Take turns drawing lines. Close a box to claim it and go again.',
   help:'Tap a gap between two dots to draw a line. Finishing the fourth side of a box wins it and gives you another turn. Try not to draw the third side.', metric:'Boxes', two:true, twoMetric:'P1 – P2', help2:'Two players: take turns on the same screen.',
   start:dotsGame},
  {id:'hang', name:'Word Guess', cat:'Brain', c:'var(--blue)', desc:'Guess the hidden word one letter at a time before the balloons run out.',
   help:'Tap letters or type them. Each wrong letter pops a balloon. Solve words in a row to build a streak.', metric:'Streak', lose:'Streak over', start:hangGame},
  {id:'code', name:'Code Breaker', cat:'Brain', c:'var(--card)', desc:'Crack a secret four-colour code using clues from each guess.',
   help:'Pick four colours (keys 1 to 6) and press Check. A dark pin means right colour in the right spot. A white pin means right colour, wrong spot. Colours can repeat.', metric:'Guesses', lower:true, win:'Code cracked', lose:'Out of guesses', loseText:'The code is shown at the top.', start:codeGame},
  {id:'recall', name:'Pattern Recall', cat:'Brain', c:'var(--grape)', desc:'Memorise the lit squares, then tap them back. The grid keeps growing.',
   help:'Watch which squares light up, then tap them all. You have three lives.', metric:'Rounds', start:recallGame},
  {id:'eights', name:'Crazy Eights', cat:'Cards', c:'var(--blue)', desc:'Race the computer to empty your hand. Eights are wild.',
   help:'Play a card that matches the suit or rank of the pile. An 8 can go on anything and lets you pick the suit. If you cannot play, tap the deck (or press D) to draw. Winning a round scores the cards left in the computer’s hand.', metric:'Points', lose:'Computer went out', start:eightsGame},
  {id:'bubble', name:'Bubble Pop', cat:'Arcade', c:'var(--card)', desc:'Fire bubbles up to make groups of three. Matching groups burst.',
   help:'Aim with the mouse or finger and tap to fire, or steer with the arrow keys and press Space. Bubbles cut loose from the top fall for bonus points. A new row drops in every ten shots.', metric:'Score', start:bubbleGame},
  {id:'cave', name:'Cave Flyer', cat:'Arcade', c:'var(--mint)', desc:'Thread a narrowing cave. Hold to rise, let go to drop.',
   help:'Hold Space, the up arrow, or press and hold the screen. The cave gets tighter and faster the further you go.', metric:'Distance', start:caveGame},
  {id:'city', name:'City Shield', cat:'Arcade', c:'var(--blue)', desc:'Intercept falling missiles before they flatten your six cities.',
   help:'Tap or click where you want a rocket to explode. Each wave gives you 14 rockets, and surviving cities earn bonus points.', metric:'Score', lose:'Cities lost', start:cityGame},
  {id:'jumper', name:'Platform Jumper', cat:'Arcade', c:'var(--tomato)', desc:'Bounce your way up the platforms without falling off the bottom.',
   help:'Arrow keys, or drag left and right. You bounce automatically. Yellow platforms crumble after one bounce, blue ones slide. Going off one side brings you back on the other.', metric:'Height', start:jumperGame},
  {id:'trail', name:'Trail Duel', cat:'Arcade', c:'var(--grape)', desc:'Leave a wall behind you and out-manoeuvre the computer.',
   help:'Arrow keys or swipe to turn. You cannot turn back on yourself. Crash into any wall and the run is over.', metric:'Rounds won', lose:'You crashed', two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 steers with WASD, player 2 with the arrow keys.',
   start:trailGame},
  {id:'slice', name:'Slice It', cat:'Reflex', c:'var(--sun)', desc:'Swipe through flying fruit, but never touch a bomb.',
   help:'Drag across the fruit with a mouse or finger. Fruit that falls past you costs a heart, and slicing a bomb ends the game. Needs a mouse or touch screen.', metric:'Fruit sliced', start:sliceGame},
  {id:'tapper', name:'Tile Tapper', cat:'Reflex', c:'var(--card)', desc:'Tap every dark tile before it slides off the bottom.',
   help:'Tap the tile, or use the D, F, J and K keys for the four lanes. Miss one and the run ends. The tiles speed up as you go.', metric:'Tiles', start:tapperGame},
  {id:'crate', name:'Crate Push', cat:'Puzzle', c:'var(--sun)', desc:'Push every crate onto a marked square. Six warehouse levels.',
   help:'Arrow keys, WASD or swipe to walk. You can push a crate but never pull one, so think before shoving one into a corner. Undo and restart are there when you need them.', metric:'Moves', lower:true, win:'All six levels done', start:crateGame},
  {id:'hanoi', name:'Hanoi Towers', cat:'Puzzle', c:'var(--grape)', desc:'Move the stack of five discs to the far peg, one disc at a time.',
   help:'Tap a peg to lift its top disc, then tap another peg to drop it. A bigger disc can never sit on a smaller one. It can be done in 31 moves.', metric:'Moves', lower:true, win:'Tower moved', start:hanoiGame},
  {id:'pipe', name:'Pipe Connect', cat:'Puzzle', c:'var(--blue)', desc:'Rotate the pipes until every one is joined to the red source.',
   help:'Tap a pipe to turn it a quarter turn. Arrow keys move the highlight and Space turns it. Pipes carrying water turn blue.', metric:'Turns', lower:true, win:'All connected', start:pipeGame},
  {id:'water', name:'Water Sort', cat:'Puzzle', c:'var(--mint)', desc:'Pour between tubes until each one holds a single colour.',
   help:'Tap a tube to pick it up, then tap another to pour. You can only pour onto the same colour or into an empty tube. Undo is always available.', metric:'Moves', lower:true, win:'All sorted', start:waterGame},
  {id:'queens', name:'Eight Queens', cat:'Puzzle', c:'var(--tomato)', desc:'Place eight queens on a chessboard so none can attack another.',
   help:'Tap a square to place or remove a queen. Queens attack along rows, columns and diagonals, and any that can see each other turn red.', metric:'Time', lower:true, fmt:mmss, win:'All eight placed', start:queensGame},
  {id:'gomoku', name:'Five in a Row', cat:'Board', c:'var(--sun)', desc:'Line up five of your stones before the computer lines up five.',
   help:'Tap any empty point to place a stone. Five in a row wins, in any direction. Watch for the computer getting four with both ends open.', metric:'Streak', lose:'Streak over', two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 is blue, player 2 is white.',
   start:gomokuGame},
  {id:'sea', name:'Sea Battle', cat:'Board', c:'var(--blue)', desc:'Hunt down the computer’s five hidden ships before it sinks yours.',
   help:'Tap a square in the enemy waters to fire. Ships are 4, 3, 3, 2 and 2 squares long and never touch each other. Fewer shots is better.', metric:'Shots', lower:true, start:seaGame},
  {id:'nim', name:'Last Stick', cat:'Board', c:'var(--card)', desc:'Take sticks from one row at a time. Whoever takes the last one loses.',
   help:'Tap a stick to take it and everything to its right in that row. You may take from only one row per turn. The computer plays well, but not perfectly.', metric:'Streak', lose:'Streak over', two:true, twoMetric:'P1 – P2', help2:'Two players: take turns, and whoever takes the last stick loses.',
   start:nimGame},
  {id:'hunt', name:'Word Hunt', cat:'Brain', c:'var(--mint)', desc:'Find eight hidden words in the letter grid, in any direction.',
   help:'Tap the first letter of a word, then its last letter. Words run across, down, diagonally, and backwards.', metric:'Time', lower:true, fmt:mmss, win:'All words found', start:huntGame},
  {id:'scramble', name:'Word Scramble', cat:'Brain', c:'var(--tomato)', desc:'Unscramble as many words as you can in 60 seconds.',
   help:'Type the word the letters spell. It moves on as soon as you get it right, and Skip swaps in a new one.', metric:'Words', lose:"Time's up", start:scrambleGame},
  {id:'digits', name:'Number Recall', cat:'Brain', c:'var(--grape)', desc:'Watch a number, then type it back. It grows a digit each round.',
   help:'The number is shown briefly, then hidden. Type it and press Enter. Three wrong answers ends the run.', metric:'Longest', start:digitsGame},
  {id:'pyramid', name:'Pyramid Solitaire', cat:'Cards', c:'var(--grape)', desc:'Clear the pyramid by pairing cards that add up to 13.',
   help:'Aces are 1 and queens are 12, so a queen pairs with an ace. Kings are 13 and go on their own. Only uncovered cards can be used. Tap the deck, or press D, to turn over a new card.', metric:'Cards cleared', start:pyramidGame},
  {id:'fish', name:'Go Fish', cat:'Cards', c:'var(--card)', desc:'Ask the computer for cards and collect sets of four.',
   help:'Tap a card in your hand to ask for that rank. If the computer has any it must hand them over and you go again. If not, you draw from the pond. Four of a kind makes a book.', metric:'Books', start:fishGame},
  {id:'muncher', name:'Muncher', cat:'Arcade', c:'var(--sun)', desc:'Eat every dot in the maze while three ghosts chase you down.',
   help:'Arrow keys, WASD or swipe. The four big dots turn the ghosts blue for a while, and eating one then is worth 200. A fresh maze is built every level.', metric:'Score', start:muncherGame},
  {id:'lander', name:'Lunar Lander', cat:'Arcade', c:'var(--blue)', desc:'Set down gently on a green pad before the fuel runs out.',
   help:'Up fires the engine, left and right tilt you. On touch, press the middle to thrust and the sides to tilt. Land slowly, upright and on a pad.', metric:'Score', lose:'All ships lost', start:landerGame},
  {id:'ski', name:'Ski Slalom', cat:'Arcade', c:'var(--card)', desc:'Race downhill through the gates without hitting a tree.',
   help:'Arrow keys or drag left and right. A point for every gate you pass between. The hill gets faster the longer you last.', metric:'Gates', start:skiGame},
  {id:'duck', name:'Duck Shoot', cat:'Reflex', c:'var(--grape)', desc:'Tap the ducks as they fly past. Gold ones are worth five.',
   help:'Click or tap a duck to bag it. Let five escape and the round is over. Needs a mouse or touch screen.', metric:'Ducks', lose:'Five got away', start:duckGame},
  {id:'sub', name:'Sub Hunt', cat:'Arcade', c:'var(--mint)', desc:'Drop depth charges on the submarines before their torpedoes find you.',
   help:'Move with the arrows or by dragging, and press Space or tap to drop a charge. Deeper submarines are worth more. Three ships and you are done.', metric:'Score', start:subGame},
  {id:'unblock', name:'Unblock', cat:'Puzzle', c:'var(--tomato)', desc:'Slide the blockers out of the way so the red car can escape.',
   help:'Tap a car to select it, then swipe or use the arrow keys to slide it. Cars only move along their own length. Tapping a selected car nudges it forward. Six levels.', metric:'Moves', lower:true, win:'All six cleared', start:unblockGame},
  {id:'binary', name:'Binary Puzzle', cat:'Puzzle', c:'var(--blue)', desc:'Fill the grid with 0s and 1s under three simple rules.',
   help:'Tap a square to cycle blank, 0, 1. Never three of the same in a row or column, an equal count of each in every line, and no two rows or columns identical. There is exactly one answer.', metric:'Time', lower:true, fmt:mmss, win:'Solved', start:binaryGame},
  {id:'link', name:'Number Link', cat:'Puzzle', c:'var(--mint)', desc:'Join each pair of dots with a path, filling every square.',
   help:'Drag from a dot to trace its path. Paths cannot cross, and every square has to be used. Dragging over another path trims it back.', metric:'Pairs joined', win:'All joined', start:linkGame},
  {id:'draughts', name:'Draughts', cat:'Board', c:'var(--card)', desc:'Classic draughts against the computer, with kings and forced jumps.',
   help:'Tap one of your pieces, then a green square. Captures are compulsory and chains happen automatically. Reach the far row to crown a king, which can move backwards.', metric:'Streak', lose:'Streak over', start:draughtsGame},
  {id:'morris', name:'Nine Men’s Morris', cat:'Board', c:'var(--grape)', desc:'Place and slide pieces to make mills and strip the computer’s men.',
   help:'Place your nine pieces one at a time, then slide them along the lines. Three in a line is a mill, and lets you take an enemy piece that is not itself in a mill. Down to two pieces and you lose.', metric:'Streak', lose:'Streak over', start:morrisGame},
  {id:'dice', name:'Five Dice', cat:'Board', c:'var(--sun)', desc:'Roll up to three times a turn and fill in the best scoring box.',
   help:'Tap dice to hold them between rolls, then pick a box to score. Every box can be used once, so sometimes you have to take a zero. Keys: R rolls, 1 to 5 hold dice.', metric:'Total', win:'Score sheet full', start:diceGame},
  {id:'snap', name:'Snap', cat:'Cards', c:'var(--tomato)', desc:'Hit Snap the instant two cards in a row match. The computer is quick.',
   help:'Press the Snap button, Space or Enter. A wrong call costs a life, and so does letting the computer beat you to it. The cards speed up as you go.', metric:'Snaps', two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 hits A, player 2 hits L, or use the two buttons.',
   start:snapGame},
  {id:'klondike', name:'Klondike Solitaire', cat:'Cards', c:'var(--mint)', desc:'The classic patience game: build all four suits from ace to king.',
   help:'Tap a card to pick it up, then tap where it goes. Columns build down in alternating colours, and only a king can start an empty column. Tap the deck (or press D) to turn a card.', metric:'Cards home', win:'Solitaire solved', start:klondikeGame},
  {id:'pinball', name:'Pinball', cat:'Arcade', c:'var(--tomato)', desc:'Keep the ball alive on the flippers and rack up bumper points.',
   help:'Left and right arrows work the flippers, Space launches. On touch, tap the left or right half of the table. Knocking down all three targets is worth 1000.', metric:'Score', lose:'All balls lost', start:pinballGame},
  {id:'bucket', name:'Bucket Drop', cat:'Arcade', c:'var(--sun)', desc:'Catch everything the dropper lets go before it hits the ground.',
   help:'Arrow keys or drag to slide the bucket. Gold is worth 25. Miss one and you lose a heart, and the dropper speeds up as you go.', metric:'Score', start:bucketGame},
  {id:'tank', name:'Tank Duel', cat:'Arcade', c:'var(--mint)', desc:'Lob shells over the hill and blow up the other tank. Mind the wind.',
   help:'Up and down set the angle, left and right the power, Space fires. You can also drag from your tank to aim, like a slingshot.', metric:'Rounds won',
   two:true, twoMetric:'P1 – P2', help2:'Two players: take turns on the same screen, each aiming their own tank.', lose:'Your tank is out', start:tankGame},
  {id:'golfcourse', name:'Mini Golf', cat:'Arcade', c:'var(--card)', desc:'Five holes of putt-putt. Fewest strokes wins.',
   help:'Drag back from the ball and let go, like a slingshot. The ball bounces off the walls and slows down on its own.', metric:'Strokes', lower:true, win:'Round finished', start:golfCourseGame},
  {id:'futoshiki', name:'Futoshiki', cat:'Puzzle', c:'var(--blue)', desc:'A Latin square with greater-than clues between the squares.',
   help:'Every row and column uses 1 to 5 once. The arrows between squares always point at the smaller number. Tap a square then a number, or type it.', metric:'Time', lower:true, fmt:mmss, win:'Solved', start:futoshikiGame},
  {id:'ice', name:'Ice Slide', cat:'Puzzle', c:'var(--mint)', desc:'You slide until you hit something. Work out how to reach the goal.',
   help:'Arrow keys or swipe. You keep sliding in that direction until a rock or a wall stops you. Five patches of ice to cross.', metric:'Slides', lower:true, win:'Off the ice', start:iceGame},
  {id:'fox', name:'Fox and Hounds', cat:'Board', c:'var(--sun)', desc:'You are the fox. Slip past four hounds to reach the far side.',
   help:'The fox moves one square diagonally in any direction. The hounds only move diagonally forwards. Get to the top row to win, or lose when you have no move left.', metric:'Streak', lose:'Streak over', start:foxGame},
  {id:'hex', name:'Hex', cat:'Board', c:'var(--grape)', desc:'Build an unbroken chain of your colour from one side to the other.',
   help:'Tap any empty hexagon. You join left to right, the computer joins top to bottom. There are no draws in Hex.', metric:'Streak',
   two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 joins left and right, player 2 joins top and bottom.', lose:'Streak over', start:hexGame},
  {id:'wordgrid', name:'Word Grid', cat:'Brain', c:'var(--tomato)', desc:'Six words are hidden in the letters. Chain them before time runs out.',
   help:'Tap letters that touch each other, including diagonally, then tap the last letter again (or press Enter) to submit. The dots show how long each hidden word is.', metric:'Words', lose:"Time's up", start:wordGridGame},
  {id:'count', name:'Quick Count', cat:'Brain', c:'var(--grape)', desc:'The dots flash up for a moment. How many were there?',
   help:'Look, do not count one by one, then pick the number. Three wrong answers ends the run, and the flashes get shorter.', metric:'Rounds', start:countGame},
  {id:'freecell', name:'FreeCell', cat:'Cards', c:'var(--blue)', desc:'Every card is face up. Use the four free cells to unpick the columns.',
   help:'Tap a card then where it goes. Columns build down in alternating colours, and a run moves only if you have enough free cells and empty columns. Press A to send everything possible home.', metric:'Cards home', win:'FreeCell solved', start:freecellGame},
  {id:'tripeaks', name:'Tri Peaks', cat:'Cards', c:'var(--card)', desc:'Clear three peaks by taking cards one rank up or down.',
   help:'Only uncovered cards can be taken, and aces join kings and twos. Longer runs without turning a card score more. Tap the deck, or press D, for a new card.', metric:'Score', start:triPeaksGame},
  {id:'racer', name:'Lane Racer', cat:'Arcade', c:'var(--tomato)', desc:'Weave through four lanes of traffic as the road speeds up.',
   help:'Left and right arrows change lane, or swipe. You can also tap the side of the road you want to move to.', metric:'Distance', start:racerGame},
  {id:'chopper', name:'Chopper Rescue', cat:'Arcade', c:'var(--mint)', desc:'Pick up stranded people and land them back at base. Gently.',
   help:'Up hovers, left and right fly. On touch, hold where you want to go. Carry up to two people and land on the green pad. Coming down too fast wrecks the chopper.', metric:'Rescued', lose:'No choppers left', start:chopperGame},
  {id:'juggle', name:'Keepy Uppy', cat:'Arcade', c:'var(--sun)', desc:'Tap the ball to keep it off the ground. The wind does not help.',
   help:'Tap or click the ball, on the side you want it to go. Hitting it low sends it higher. One bounce on the ground ends it.', metric:'Kicks', start:juggleGame},
  {id:'bug', name:'Bug Squash', cat:'Reflex', c:'var(--grape)', desc:'Squash the bugs crossing the screen, but never hit a bee.',
   help:'Tap a bug to squash it. Red ones are quick and worth 3. Bugs that escape cost a heart, and so does squashing a bee. Needs a mouse or touch screen.', metric:'Bugs', start:bugGame},
  {id:'tents', name:'Tents and Trees', cat:'Puzzle', c:'var(--mint)', desc:'Pitch one tent beside every tree, matching the counts on the edges.',
   help:'Tap a square to cycle tent, grass, empty. Every tree gets exactly one tent directly beside it, no two tents touch (not even corners), and the numbers count tents in that row or column.', metric:'Time', lower:true, fmt:mmss, win:'Camp set', start:tentsGame},
  {id:'magic', name:'Magic Square', cat:'Puzzle', c:'var(--sun)', desc:'Place 1 to 9 so every row, column and diagonal adds up to 15.',
   help:'Tap a square then a number. Putting a number somewhere new takes it from where it was, so you can shuffle things around freely.', metric:'Time', lower:true, fmt:mmss, win:'Magic square made', start:magicGame},
  {id:'untangle', name:'Untangle', cat:'Puzzle', c:'var(--blue)', desc:'Drag the dots until none of the lines cross. It can always be done.',
   help:'Drag any dot. Crossing lines show in red. The puzzle is built so a tidy arrangement always exists.', metric:'Drags', lower:true, win:'Untangled', start:untangleGame},
  {id:'dom', name:'Domineering', cat:'Board', c:'var(--card)', desc:'You lay upright dominoes, the computer lays flat ones. Last to fit wins.',
   help:'Tap the top square of the pair you want. You always place upright, the computer always places flat. Whoever runs out of room first loses.', metric:'Streak',
   two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 places upright dominoes, player 2 places flat ones.', lose:'Streak over', start:domGame},
  {id:'corners', name:'Corners', cat:'Board', c:'var(--grape)', desc:'Race four pieces across the board into the opposite corner.',
   help:'Tap a piece then a green square. Pieces step one square or hop over any single piece. First to fill the far corner wins.', metric:'Streak',
   two:true, twoMetric:'P1 – P2', help2:'Two players: player 1 starts top left, player 2 bottom right.', lose:'Streak over', start:cornersGame},
  {id:'sequence', name:'Next Number', cat:'Brain', c:'var(--tomato)', desc:'Spot the pattern and pick the number that comes next.',
   help:'Sequences count up, count down, double, square or add the last two together. Keys 1 to 4 pick an answer.', metric:'Score', lose:"Time's up", start:sequenceGame},
  {id:'spider', name:'Spider One Suit', cat:'Cards', c:'var(--blue)', desc:'Spider solitaire with a single suit. Build eight runs, king to ace.',
   help:'Move a card, or a run in order, onto the next rank up. A full king-to-ace run clears itself. Tap the deck (or press D) to deal a new row, but only when no column is empty.', metric:'Runs', win:'Spider solved', start:spiderGame},
  {id:'sevens', name:'Sevens', cat:'Cards', c:'var(--mint)', desc:'Lay down the sevens, then build up and down. First to an empty hand wins.',
   help:'Spades and hearts only, 13 cards each. Playable cards are highlighted. A suit starts with its 7, then you can add the 6 or 8, out to ace and king. If you cannot play, pass.', metric:'Hands won', start:sevensGame}
];

/* ---------- home page ---------- */
const gridEl = $('#grid'), emptyEl = $('#empty'), qEl = $('#q');
let filter = 'all';
const fmt = (g, n) => g.fmt ? g.fmt(n) : String(n);

function renderGrid(){
  const q = qEl.value.trim().toLowerCase();
  const favs = store.get('favs', []);
  const list = games.filter(g =>
    (filter === 'all' || (filter === 'fav' ? favs.includes(g.id) : g.cat === filter)) &&
    (!q || `${g.name} ${g.desc} ${g.cat}`.toLowerCase().includes(q)));
  gridEl.innerHTML = '';
  if (!list.length){
    emptyEl.hidden = false;
    emptyEl.textContent = (filter === 'fav' && !q)
      ? 'No favourites yet. Tap the heart on a game to keep it here.'
      : 'No games match that. Try another word or pick All.';
    return;
  }
  emptyEl.hidden = true;
  list.forEach(g => {
    const best = store.get('best:' + g.id, null);
    const isFav = favs.includes(g.id);
    const art = document.createElement('article');
    art.className = 'cart'; art.style.setProperty('--c', g.c);
    art.innerHTML = `
      <button class="play" type="button" aria-label="Play ${g.name}">
        <span class="thumb">${thumbs[g.id]}</span>
        <span class="cart-name">${g.name}</span>
        <span class="cart-desc">${g.desc}</span>
        <span class="cart-meta"><span class="tag">${g.cat}</span><span>${best === null ? 'Not played yet' : 'Best ' + fmt(g, best)}</span></span>
      </button>
      <button class="fav" type="button" aria-pressed="${isFav}" aria-label="${isFav ? 'Remove ' + g.name + ' from' : 'Add ' + g.name + ' to'} favourites">♥</button>`;
    art.querySelector('.play').addEventListener('click', () => openGame(g));
    art.querySelector('.fav').addEventListener('click', () => {
      const f = store.get('favs', []);
      store.set('favs', f.includes(g.id) ? f.filter(x => x !== g.id) : [...f, g.id]);
      renderGrid();
    });
    gridEl.appendChild(art);
  });
}
qEl.addEventListener('input', renderGrid);
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  renderGrid();
}));

/* ---------- theme ---------- */
const root = document.documentElement, themeBtn = $('#theme');
const sysDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(t){
  if (t) root.dataset.theme = t; else delete root.dataset.theme;
  const dark = t ? t === 'dark' : sysDark();
  themeBtn.textContent = dark ? 'Light mode' : 'Dark mode';
}
applyTheme(store.get('theme', null));
themeBtn.addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : sysDark();
  const next = dark ? 'light' : 'dark';
  store.set('theme', next); applyTheme(next);
});

/* ---------- player ---------- */
const player = $('#player'), stage = $('#stage'), endEl = $('#end');
const sval = $('#sval'), bval = $('#bval');
let current = null, stopFn = null, listeners = [], endTimer = null, twoMode = false;
const seat = {on:false, turn:1, scores:[null, null], live:null, next:null, seed:0};
const REAL_RANDOM = Math.random;
function useSeed(seed){
  let a = seed >>> 0;
  Math.random = () => {
    a += 0x6D2B79F5;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 61, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const realRandom = () => { Math.random = REAL_RANDOM; };
const seatBetter = (a, b) => {
  if (a === null && b === null) return 0;
  if (a === null) return -1;
  if (b === null) return 1;
  if (a === b) return 0;
  return (current.lower ? a < b : a > b) ? 1 : -1;
};
const seatShow = v => v === null ? 'gave up' : fmt(current, v);
function seatBar(){
  $('#turnbar').hidden = !seat.on;
  if (!seat.on) return;
  $('#turnwho').textContent = `Player ${seat.turn}'s turn`;
  const [a, b] = seat.scores;
  $('#turnscores').textContent = a === null && seat.turn === 1 ? `${current.metric}: higher wins`.replace('higher', current.lower ? 'lower' : 'higher')
    : `Player 1 ${a === null ? '—' : seatShow(a)}`;
}

function showBest(){
  const b = store.get('best:' + current.id, null);
  bval.textContent = b === null ? '–' : fmt(current, b);
}
function applyMode(){
  const g = current;
  $('#players').hidden = false;
  $('#players').textContent = twoMode ? '1 player' : '2 players';
  $('#players').setAttribute('aria-pressed', String(twoMode));
  $('#beststat').hidden = twoMode;
  $('#slabel').textContent = twoMode ? (g.twoMetric || 'Score') : g.metric;
  const passPlay = `Two players: take turns. Player 1 plays a round, then player 2 plays the same game, and the ${g.lower ? 'lower' : 'higher'} score wins. Use "End my turn" to stop early.`;
  $('#help').textContent = g.help + (twoMode ? ' ' + (g.two ? g.help2 : passPlay) : '');
  $('#slabel').textContent = twoMode ? (g.two ? (g.twoMetric || 'Score') : g.metric) : g.metric;
}
function stopGame(){
  if (stopFn) stopFn();
  stopFn = null;
  listeners.forEach(([t, ty, f, o]) => t.removeEventListener(ty, f, o));
  listeners = [];
  clearTimeout(endTimer);
}
function startGame(){
  stopGame();
  stage.innerHTML = ''; endEl.hidden = true;
  const g = current;
  seat.on = twoMode && !g.two;
  if (seat.on){
    if (seat.turn === 1) seat.seed = Math.floor(REAL_RANDOM() * 1e9);
    useSeed(seat.seed);
  } else realRandom();
  seat.live = null;
  seat.next = null;
  seatBar();
  sval.textContent = (twoMode && g.two) ? '0–0' : fmt(g, 0);
  const api = {
    two: twoMode && !!g.two,
    on(t, type, fn, opts){ t.addEventListener(type, fn, opts); listeners.push([t, type, fn, opts]); },
    swipe(el, fn){
      let sx = null, sy = null;
      api.on(el, 'pointerdown', e => { sx = e.clientX; sy = e.clientY; });
      api.on(el, 'pointerup', e => {
        if (sx === null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) fn(Math.sign(dx), 0); else fn(0, Math.sign(dy));
      });
    },
    score(n){ sval.textContent = typeof n === 'string' ? n : fmt(g, n); if (typeof n === 'number') seat.live = n; },
    over(n, {won = false, title = ''} = {}){
      if (seat.on){ seatFinish(n, title, won); return; }
      const key = 'best:' + g.id, prev = store.get(key, null);
      let record = false;
      if (twoMode){ /* two-player results are not saved as a best score */ }
      else if (g.lower){ if (won && (prev === null || n < prev)){ store.set(key, n); record = true; } }
      else if (n > 0 && (prev === null || n > prev)){ store.set(key, n); record = true; }
      if (!twoMode) showBest();
      $('#etitle').textContent = title || (won ? (g.win || 'You did it') : (g.lose || 'Game over'));
      const et = $('#etext');
      et.textContent = twoMode ? `Final score: ${n}` : (won || !g.lower) ? `${g.metric}: ${fmt(g, n)}` : (g.loseText || 'Better luck next time.');
      if (record){ const r = document.createElement('span'); r.className = 'record'; r.textContent = ' New best!'; et.appendChild(r); }
      endTimer = setTimeout(() => { endEl.hidden = false; $('#again').focus({preventScroll:true}); }, 450);
    }
  };
  stopFn = g.start(stage, api) || null;
  stage.focus({preventScroll:true});
}
function seatFinish(value, title, won){
  const g = current;
  seat.scores[seat.turn - 1] = value;
  const et = $('#etext');
  if (seat.turn === 1){
    $('#etitle').textContent = title || (won ? (g.win || 'Round over') : 'Player 1 is done');
    et.textContent = (value === null ? 'Player 1 gave up.' : `Player 1 scored ${seatShow(value)}.`) + ' Hand over to player 2.';
    $('#again').textContent = "Player 2's turn";
    seat.next = () => { seat.turn = 2; $('#again').textContent = 'Play again'; startGame(); };
  } else {
    const [a, b] = seat.scores;
    const cmp = seatBetter(b, a);
    $('#etitle').textContent = cmp > 0 ? 'Player 2 wins!' : cmp < 0 ? 'Player 1 wins!' : "It's a draw";
    et.textContent = `Player 1 ${seatShow(a)} · Player 2 ${seatShow(b)}`;
    $('#again').textContent = 'Play again';
    seat.next = () => { seat.turn = 1; seat.scores = [null, null]; startGame(); };
  }
  seatBar();
  endTimer = setTimeout(() => { endEl.hidden = false; $('#again').focus({preventScroll:true}); }, 450);
}
$('#endturn').addEventListener('click', () => {
  if (!seat.on) return;
  stopGame();
  seatFinish(current.lower ? null : (seat.live || 0), 'Turn ended', false);
});
function openGame(g){
  current = g;
  twoMode = false;
  seat.turn = 1; seat.scores = [null, null]; seat.next = null;
  $('#again').textContent = 'Play again';
  $('#ptitle').textContent = g.name;
  showBest();
  applyMode();
  player.hidden = false;
  document.body.classList.add('playing');
  startGame();
}
function closeGame(){
  stopGame();
  realRandom();
  if (document.fullscreenElement) { try { document.exitFullscreen(); } catch {} }
  player.hidden = true;
  document.body.classList.remove('playing');
  stage.innerHTML = '';
  renderGrid();
  const btn = [...gridEl.querySelectorAll('.play')].find(b => b.getAttribute('aria-label') === 'Play ' + current.name);
  if (btn) btn.focus({preventScroll:true});
}
$('#players').addEventListener('click', () => {
  twoMode = !twoMode;
  seat.turn = 1; seat.scores = [null, null]; seat.next = null;
  $('#again').textContent = 'Play again';
  applyMode();
  startGame();
});
$('#back').addEventListener('click', closeGame);
$('#restart').addEventListener('click', startGame);
$('#again').addEventListener('click', () => {
  const step = seat.next;
  seat.next = null;
  if (step) step(); else startGame();
});
const fullBtn = $('#full');
if (!document.fullscreenEnabled) fullBtn.hidden = true;
fullBtn.addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await player.requestFullscreen();
  } catch { fullBtn.hidden = true; }
  stage.focus({preventScroll:true});
});
document.addEventListener('fullscreenchange', () => {
  fullBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !player.hidden && !document.fullscreenElement) closeGame();
});

$('#count').textContent = games.length;
$('#random').addEventListener('click', () => openGame(games[rand(games.length)]));
renderGrid();
})();
</script>
</body>
</html>
