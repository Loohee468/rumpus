        const err = Math.abs(x - foe.x) + Math.random() * 26;
        if (err < best.err) best = {err, a, p};
      }
    }
    t.angle = best.a; t.power = best.p;
    fire();
  }
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    if (shell && state === 'play'){
      for (let s = 0; s < 2; s++){
        shell.vy += 0.14 * k / 2; shell.vx += wind * k / 2;
        shell.x += shell.vx * k / 2; shell.y += shell.vy * k / 2;
        if (shell.y >= groundAt(shell.x) || shell.x < -20 || shell.x > W + 20 || shell.y > H){
          if (shell.x < -20 || shell.x > W + 20){ shell = null; turn = 1 - turn; busy = false; if (!two && turn === 1) setTimeout(cpuShot, 600); }
          else boom(shell.x, shell.y);
          break;
        }
      }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.sky; g.fillRect(0, 0, W, H);
    g.fillStyle = col.ground;
    g.beginPath(); g.moveTo(0, H);
    terrain.forEach((y, i) => g.lineTo(i * 10, y));
    g.lineTo(W, H); g.closePath(); g.fill();
    tanks.forEach((t, i) => {
      const y = groundAt(t.x);
      g.fillStyle = t.col;
      rr(g, t.x - 15, y - 12, 30, 12, 4); g.fill();
      g.beginPath(); g.arc(t.x, y - 12, 8, Math.PI, 0); g.fill();
      g.strokeStyle = t.col; g.lineWidth = 5; g.lineCap = 'round';
      g.beginPath(); g.moveTo(t.x, y - 14); g.lineTo(t.x + Math.cos(t.angle) * 22, y - 14 + Math.sin(t.angle) * 22); g.stroke();
      g.fillStyle = col.ink; g.font = `700 12px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'bottom';
      g.fillText(`${t.hp}`, t.x, y - 26);
    });
    if (shell){ g.fillStyle = col.shell; g.beginPath(); g.arc(shell.x, shell.y, 4, 0, Math.PI * 2); g.fill(); }
    const t = tanks[turn];
    g.fillStyle = col.ink; g.font = `700 13px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`${two ? `Player ${turn + 1}` : turn ? 'Computer' : 'You'} · angle ${Math.round((Math.PI - Math.abs(t.angle)) * 57)}° · power ${t.power.toFixed(0)}`, 10, 8);
    g.textAlign = 'right';
    g.fillText(`Wind ${wind > 0 ? '→' : '←'} ${Math.abs(wind * 100).toFixed(0)}`, W - 10, 8);
    g.textBaseline = 'middle';
    if (msg) pill(g, W, H, msg, col.ink, col.card);
    else if (state === 'ready') pill(g, W, H, 'Arrows to aim, Space to fire (or drag to aim)', col.ink, col.card);
  }
  function adjust(da, dp){
    if (state === 'ready') state = 'play';
    if (busy || shell) return;
    const t = tanks[turn];
    t.angle += da * (turn ? -1 : 1);
    t.power = Math.max(5, Math.min(22, t.power + dp));
  }
  api.on(window, 'keydown', e => {
    if (!two && turn === 1) return;
    if (e.code === 'ArrowUp'){ e.preventDefault(); adjust(-0.03, 0); }
    if (e.code === 'ArrowDown'){ e.preventDefault(); adjust(0.03, 0); }
    if (e.code === 'ArrowLeft'){ e.preventDefault(); adjust(0, -0.5); }
    if (e.code === 'ArrowRight'){ e.preventDefault(); adjust(0, 0.5); }
    if (e.code === 'Space'){ e.preventDefault(); if (state === 'ready'){ state = 'play'; return; } if (!e.repeat) fire(); }
  });
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    if (state === 'ready'){ state = 'play'; return; }
    if (!two && turn === 1) return;
    try { c.setPointerCapture(e.pointerId); } catch {}
    aim = toLocal(c, e);
  });
  api.on(c, 'pointermove', e => {
    if (!aim || busy) return;
    const p = toLocal(c, e), t = tanks[turn];
    const dx = p.x - t.x, dy = p.y - (groundAt(t.x) - 12);
    t.angle = Math.atan2(dy, dx);
    t.power = Math.max(5, Math.min(22, Math.hypot(dx, dy) / 8));
  });
  api.on(c, 'pointerup', () => { if (aim){ aim = null; fire(); } });
  makeTerrain(); api.score(two ? '0–0' : 0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Mini Golf ---------- */
const GOLF_HOLES = [
  {start:[60, 300], hole:[340, 90], par:2, walls:[[0, 0, 400, 14], [0, 346, 400, 14], [0, 0, 14, 360], [386, 0, 14, 360], [150, 140, 20, 220]]},
  {start:[60, 180], hole:[340, 180], par:3, walls:[[0, 0, 400, 14], [0, 346, 400, 14], [0, 0, 14, 360], [386, 0, 14, 360], [180, 0, 24, 140], [180, 220, 24, 140], [260, 140, 24, 80]]},
  {start:[200, 310], hole:[200, 60], par:3, walls:[[0, 0, 400, 14], [0, 346, 400, 14], [0, 0, 14, 360], [386, 0, 14, 360], [90, 120, 90, 24], [220, 120, 90, 24], [140, 220, 120, 20]]},
  {start:[60, 60], hole:[340, 300], par:4, walls:[[0, 0, 400, 14], [0, 346, 400, 14], [0, 0, 14, 360], [386, 0, 14, 360], [120, 14, 22, 200], [250, 140, 22, 210], [300, 60, 60, 20]]},
  {start:[60, 300], hole:[330, 300], par:4, walls:[[0, 0, 400, 14], [0, 346, 400, 14], [0, 0, 14, 360], [386, 0, 14, 360], [110, 200, 24, 160], [200, 14, 24, 180], [280, 200, 24, 160]]}
];
function golfCourseGame(stage, api){
  const W = 400, H = 360;
  const label = el('p', 'tools');
  label.setAttribute('aria-live', 'polite');
  stage.appendChild(label);
  const [c, g] = makeCanvas(stage, W, H);
  const col = {grass:tok('--mint'), wall:tok('--board'), ink:tok('--ink'), card:tok('--card'), ball:'#FFFFFF', hole:'#231B4E', aim:tok('--tomato')};
  let hole = 0, ball = {x:0, y:0, vx:0, vy:0, r:7}, strokes = 0, total = 0, drag = null, state = 'ready', raf, last = 0, msg = '', done = false;
  function load(){
    const h = GOLF_HOLES[hole];
    ball = {x:h.start[0], y:h.start[1], vx:0, vy:0, r:7};
    strokes = 0;
    label.textContent = `Hole ${hole + 1} of ${GOLF_HOLES.length} · par ${h.par} · total ${total}`;
  }
  const moving = () => Math.hypot(ball.vx, ball.vy) > 0.12;
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    if (moving()){
      const h = GOLF_HOLES[hole];
      const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy) * k / 3));
      for (let s = 0; s < steps; s++){
        ball.x += ball.vx * k / steps; ball.y += ball.vy * k / steps;
        h.walls.forEach(([x, y, w, hh]) => {
          if (ball.x + ball.r < x || ball.x - ball.r > x + w || ball.y + ball.r < y || ball.y - ball.r > y + hh) return;
          const overX = Math.min(ball.x + ball.r - x, x + w - ball.x + ball.r);
          const overY = Math.min(ball.y + ball.r - y, y + hh - ball.y + ball.r);
          if (overX < overY){
            ball.vx = -ball.vx * 0.82;
            ball.x += ball.x < x + w / 2 ? -overX : overX;
          } else {
            ball.vy = -ball.vy * 0.82;
            ball.y += ball.y < y + hh / 2 ? -overY : overY;
          }
        });
        const d = Math.hypot(ball.x - h.hole[0], ball.y - h.hole[1]);
        if (d < 11 && Math.hypot(ball.vx, ball.vy) < 6){
          total += strokes;
          const par = h.par;
          msg = strokes === 1 ? 'Hole in one!' : strokes <= par ? 'Under par!' : 'Holed out.';
          hole++;
          if (hole >= GOLF_HOLES.length){
            done = true; api.score(total);
            draw(); api.over(total, {won:true, title:'Round finished'});
            return;
          }
          setTimeout(() => { msg = ''; load(); }, 1200);
          ball.vx = ball.vy = 0;
          api.score(total);
          return;
        }
      }
      ball.vx *= Math.pow(0.978, k); ball.vy *= Math.pow(0.978, k);
      if (!moving()){ ball.vx = 0; ball.vy = 0; }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    const h = GOLF_HOLES[Math.min(hole, GOLF_HOLES.length - 1)];
    g.fillStyle = col.grass; g.fillRect(0, 0, W, H);
    g.fillStyle = col.wall;
    h.walls.forEach(([x, y, w, hh]) => { rr(g, x, y, w, hh, 4); g.fill(); });
    g.fillStyle = col.hole;
    g.beginPath(); g.arc(h.hole[0], h.hole[1], 11, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(h.hole[0], h.hole[1]); g.lineTo(h.hole[0], h.hole[1] - 26); g.stroke();
    g.fillStyle = tok('--tomato');
    g.beginPath(); g.moveTo(h.hole[0], h.hole[1] - 26); g.lineTo(h.hole[0] + 14, h.hole[1] - 21); g.lineTo(h.hole[0], h.hole[1] - 16); g.fill();
    if (drag && !moving()){
      g.strokeStyle = col.aim; g.lineWidth = 3; g.setLineDash([5, 5]);
      g.beginPath(); g.moveTo(ball.x, ball.y);
      g.lineTo(ball.x - (drag.x - ball.x), ball.y - (drag.y - ball.y));
      g.stroke(); g.setLineDash([]);
    }
    g.fillStyle = col.ball; g.strokeStyle = col.ink; g.lineWidth = 2;
    g.beginPath(); g.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = col.ink; g.font = `700 14px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`Strokes ${strokes}`, 22, 22);
    g.textBaseline = 'middle';
    if (msg) pill(g, W, H, msg, col.ink, col.card);
    else if (state === 'ready') pill(g, W, H, 'Drag back from the ball and let go', col.ink, col.card);
  }
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    state = 'play';
    if (moving() || done) return;
    try { c.setPointerCapture(e.pointerId); } catch {}
    drag = toLocal(c, e);
  });
  api.on(c, 'pointermove', e => { if (drag) drag = toLocal(c, e); });
  api.on(c, 'pointerup', e => {
    if (!drag || moving() || done){ drag = null; return; }
    const p = toLocal(c, e);
    const dx = ball.x - p.x, dy = ball.y - p.y;
    drag = null;
    const power = Math.min(19, Math.hypot(dx, dy) / 6);
    if (power < 0.6) return;
    const a = Math.atan2(dy, dx);
    ball.vx = Math.cos(a) * power; ball.vy = Math.sin(a) * power;
    strokes++; api.score(total + strokes);
  });
  load(); api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Futoshiki ---------- */
function futoSolve(grid, N, cmps, limit){
  const g = grid.slice();
  let count = 0, sol = null;
  const okAt = i => {
    const v = g[i], r = Math.floor(i / N), c = i % N;
    for (let k = 0; k < N; k++){
      if (k !== c && g[r * N + k] === v) return false;
      if (k !== r && g[k * N + c] === v) return false;
    }
    return cmps.every(([a, b]) => {
      if (a !== i && b !== i) return true;
      if (g[a] === null || g[b] === null) return true;
      return g[a] < g[b];
    });
  };
  function rec(i){
    while (i < N * N && g[i] !== null) i++;
    if (i >= N * N){ count++; if (!sol) sol = g.slice(); return; }
    for (const v of shuffle([...Array(N).keys()].map(x => x + 1))){
      g[i] = v;
      if (okAt(i)) rec(i + 1);
      g[i] = null;
      if (count >= limit) return;
    }
  }
  rec(0);
  return {count, sol};
}
function futoshikiGame(stage, api){
  const N = 5;
  const full = futoSolve(Array(N * N).fill(null), N, [], 1).sol;
  const cmps = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const i = r * N + c;
    if (c < N - 1 && Math.random() < 0.34) cmps.push(full[i] < full[i + 1] ? [i, i + 1] : [i + 1, i]);
    if (r < N - 1 && Math.random() < 0.34) cmps.push(full[i] < full[i + N] ? [i, i + N] : [i + N, i]);
  }
  const puzzle = full.slice();
  for (const i of shuffle([...Array(N * N).keys()])){
    const keep = puzzle[i];
    puzzle[i] = null;
    if (futoSolve(puzzle, N, cmps, 2).count !== 1) puzzle[i] = keep;
  }
  const wrap = el('div', 'panel'), info = el('p', 'tools');
  info.setAttribute('aria-live', 'polite');
  const board = el('div', 'board futo');
  const pad = el('div', 'numpad');
  wrap.append(info, board, pad); stage.appendChild(wrap);
  const vals = puzzle.slice();
  let sel = -1, secs = 0, done = false;
  const timer = setInterval(() => { if (!done){ secs++; api.score(secs); } }, 1000);
  const cells = [], marks = [];
  for (let r = 0; r < N; r++){
    for (let c = 0; c < N; c++){
      const i = r * N + c;
      const b = btn('fcell' + (puzzle[i] !== null ? ' given' : ''));
      board.appendChild(b); cells.push(b);
      api.on(b, 'click', () => { sel = i; render(); });
      if (c < N - 1){
        const m = el('div', 'fmark');
        const cm = cmps.find(([a, b2]) => (a === i && b2 === i + 1) || (a === i + 1 && b2 === i));
        m.textContent = cm ? (cm[0] === i ? '<' : '>') : '';
        board.appendChild(m); marks.push(m);
      }
    }
    if (r < N - 1) for (let c = 0; c < N; c++){
      const i = r * N + c;
      const m = el('div', 'fmark');
      const cm = cmps.find(([a, b2]) => (a === i && b2 === i + N) || (a === i + N && b2 === i));
      m.textContent = cm ? (cm[0] === i ? '∧' : '∨') : '';
      board.appendChild(m);
      if (c < N - 1) board.appendChild(el('div'));
    }
  }
  for (let k = 1; k <= N; k++){ const b = btn('btn small', String(k)); pad.appendChild(b); api.on(b, 'click', () => put(k)); }
  const eraseB = btn('btn small', 'Erase'); pad.appendChild(eraseB); api.on(eraseB, 'click', () => put(null));
  function render(){
    const clash = new Set();
    for (let i = 0; i < N * N; i++){
      if (vals[i] === null) continue;
      const r = Math.floor(i / N), c = i % N;
      for (let k = 0; k < N; k++){
        if (k !== c && vals[r * N + k] === vals[i]) clash.add(i);
        if (k !== r && vals[k * N + c] === vals[i]) clash.add(i);
      }
    }
    cmps.forEach(([a, b]) => { if (vals[a] !== null && vals[b] !== null && vals[a] >= vals[b]){ clash.add(a); clash.add(b); } });
    cells.forEach((b, i) => {
      b.textContent = vals[i] === null ? '' : vals[i];
      b.classList.toggle('sel', i === sel);
      b.classList.toggle('bad', clash.has(i));
      b.setAttribute('aria-label', `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}, ${vals[i] === null ? 'empty' : vals[i]}`);
    });
    const left = vals.filter(v => v === null).length;
    info.textContent = done ? `Solved in ${mmss(secs)}!` : `${left} to fill. Each row and column uses 1 to ${N} once, and the arrows point at the smaller number.`;
  }
  function put(v){
    if (done || sel < 0 || puzzle[sel] !== null) return;
    vals[sel] = v; render();
    if (vals.every((x, i) => x === full[i])){ done = true; clearInterval(timer); render(); api.over(secs, {won:true}); }
  }
  api.on(window, 'keydown', e => {
    const m = /^(?:Digit|Numpad)([1-9])$/.exec(e.code);
    if (m && +m[1] <= N){ e.preventDefault(); put(+m[1]); }
    else if (e.code === 'Backspace' || e.code === 'Delete'){ e.preventDefault(); put(null); }
    else if (e.code.startsWith('Arrow')){
      e.preventDefault();
      const d = DIRS[e.code];
      sel = sel < 0 ? 0 : ((Math.floor(sel / N) + d[1] + N) % N) * N + (sel % N + d[0] + N) % N;
      render();
    }
  });
  render(); api.score(0);
  return () => clearInterval(timer);
}

/* ---------- Ice Slide ---------- */
function iceGame(stage, api){
  const N = 9, W = 396, S = W / N;
  const label = el('p', 'tools');
  label.setAttribute('aria-live', 'polite');
  stage.appendChild(label);
  const [c, g] = makeCanvas(stage, W, W);
  const col = {ice:tok('--cell'), rock:tok('--edge'), me:tok('--tomato'), goal:tok('--mint'), ink:tok('--ink'), card:tok('--card'), grid:tok('--board')};
  let walls, me, goal, moves = 0, total = 0, level = 0, done = false;
  const LEVELS = 5;
  const at = (x, y) => x < 0 || y < 0 || x >= N || y >= N || walls[y * N + x];
  function slide(from, dx, dy){
    let [x, y] = from;
    while (!at(x + dx, y + dy)){ x += dx; y += dy; }
    return [x, y];
  }
  function solveDepth(start, target){
    const seen = new Map([[start.join(), 0]]), q = [start];
    while (q.length){
      const cur = q.shift(), d = seen.get(cur.join());
      if (cur[0] === target[0] && cur[1] === target[1]) return d;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
        const nx = slide(cur, dx, dy);
        if (nx[0] === cur[0] && nx[1] === cur[1]) continue;
        if (seen.has(nx.join())) continue;
        seen.set(nx.join(), d + 1); q.push(nx);
      }
    }
    return -1;
  }
  function build(){
    for (let attempt = 0; attempt < 400; attempt++){
      walls = Array(N * N).fill(false);
      for (let i = 0; i < N; i++){ walls[i] = walls[(N - 1) * N + i] = walls[i * N] = walls[i * N + N - 1] = true; }
      const rocks = 9 + level * 2;
      for (let k = 0; k < rocks; k++){
        const x = 1 + rand(N - 2), y = 1 + rand(N - 2);
        walls[y * N + x] = true;
      }
      const spots = [];
      for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) if (!walls[y * N + x]) spots.push([x, y]);
      if (spots.length < 12) continue;
      me = spots[rand(spots.length)];
      goal = spots[rand(spots.length)];
      if (me[0] === goal[0] && me[1] === goal[1]) continue;
      const d = solveDepth(me, goal);
      if (d >= 4 + level && d <= 10 + level) return;
    }
  }
  function load(){ build(); moves = 0; draw(); }
  function step(dx, dy){
    if (done) return;
    const to = slide(me, dx, dy);
    if (to[0] === me[0] && to[1] === me[1]) return;
    me = to; moves++; total++; api.score(total);
    if (me[0] === goal[0] && me[1] === goal[1]){
      level++;
      if (level >= LEVELS){ done = true; draw(); api.over(total, {won:true, title:'Off the ice'}); return; }
      label.textContent = 'Nice. Next patch of ice…';
      setTimeout(load, 700);
    }
    draw();
  }
  function draw(){
    g.fillStyle = col.ice; g.fillRect(0, 0, W, W);
    g.strokeStyle = col.grid; g.lineWidth = 1; g.globalAlpha = 0.4;
    for (let i = 1; i < N; i++){ g.beginPath(); g.moveTo(i * S, 0); g.lineTo(i * S, W); g.moveTo(0, i * S); g.lineTo(W, i * S); g.stroke(); }
    g.globalAlpha = 1;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (walls[y * N + x]){
      g.fillStyle = col.rock; rr(g, x * S + 2, y * S + 2, S - 4, S - 4, 6); g.fill();
    }
    g.fillStyle = col.goal;
    rr(g, goal[0] * S + 5, goal[1] * S + 5, S - 10, S - 10, 8); g.fill();
    g.fillStyle = col.me;
    g.beginPath(); g.arc(me[0] * S + S / 2, me[1] * S + S / 2, S * 0.32, 0, Math.PI * 2); g.fill();
    if (!done) label.textContent = `Patch ${level + 1} of ${LEVELS} · ${moves} slides here · ${total} in total`;
  }
  api.on(window, 'keydown', e => { const d = DIRS[e.code]; if (d){ e.preventDefault(); step(d[0], d[1]); } });
  api.swipe(c, step);
  load(); api.score(0);
}

/* ---------- Fox and Hounds ---------- */
function foxGame(stage, api){
  const {status, nextB, board} = streakShell(stage, 'draughts fox', 'You are the fox. Reach the top row to win.');
  let fox = 60, hounds = [1, 3, 5, 7], streak = 0, busy = false, done = false, sel = false, t = null;
  const dark = i => (Math.floor(i / 8) + i % 8) % 2 === 1;
  const cells = [...Array(64)].map((_, i) => { const x = btn('dsq' + (dark(i) ? ' dark' : '')); board.appendChild(x); api.on(x, 'click', () => tap(i)); return x; });
  const diag = (i, dr, dc) => {
    const r = Math.floor(i / 8) + dr, c = i % 8 + dc;
    return r < 0 || c < 0 || r > 7 || c > 7 ? -1 : r * 8 + c;
  };
  const foxMoves = (f, hs) => [[-1, -1], [-1, 1], [1, -1], [1, 1]].map(([a, b]) => diag(f, a, b)).filter(j => j >= 0 && !hs.includes(j));
  const houndMoves = hs => {
    const out = [];
    hs.forEach((h, k) => [[1, -1], [1, 1]].forEach(([a, b]) => {
      const j = diag(h, a, b);
      if (j >= 0 && !hs.includes(j) && j !== fox) out.push({k, to:j});
    }));
    return out;
  };
  function foxWins(f, hs){ return Math.floor(f / 8) === 0; }
  function search(f, hs, depth, foxTurn){
    if (foxWins(f, hs)) return 100 - depth;
    const fm = foxMoves(f, hs);
    if (!fm.length) return -100 + depth;
    if (depth <= 0) return 8 - Math.floor(f / 8) - hs.reduce((a, h) => a + Math.floor(h / 8), 0) * 0.1;
    if (foxTurn){
      let best = -Infinity;
      for (const j of fm) best = Math.max(best, search(j, hs, depth - 1, false));
      return best;
    }
    let best = Infinity;
    for (const m of houndMoves(hs)){
      const nhs = hs.slice(); nhs[m.k] = m.to;
      best = Math.min(best, search(f, nhs, depth - 1, true));
    }
    return best;
  }
  function render(){
    const legal = foxMoves(fox, hounds);
    cells.forEach((x, i) => {
      x.className = 'dsq' + (dark(i) ? ' dark' : '') + (fox === i ? ' fox' : '') + (hounds.includes(i) ? ' foe' : '') + (legal.includes(i) && !busy && !done ? ' target' : '');
      x.disabled = busy || done || !(legal.includes(i) || i === fox);
      x.setAttribute('aria-label', `Row ${Math.floor(i / 8) + 1}, column ${i % 8 + 1}, ${fox === i ? 'the fox' : hounds.includes(i) ? 'a hound' : legal.includes(i) ? 'you can move here' : 'empty'}`);
    });
    api.score(streak);
  }
  function finish(youWin){
    done = true; busy = false;
    if (youWin){ streak++; api.score(streak); status.textContent = 'The fox is through! You win.'; nextB.hidden = false; render(); nextB.focus(); }
    else { status.textContent = 'The hounds have you cornered.'; render(); api.over(streak); }
  }
  function houndTurn(){
    busy = true; status.textContent = 'The hounds move…'; render();
    t = setTimeout(() => {
      const moves = houndMoves(hounds);
      if (!moves.length){ finish(true); return; }
      let best = moves[0], bestScore = Infinity;
      for (const m of moves){
        const nhs = hounds.slice(); nhs[m.k] = m.to;
        const s = search(fox, nhs, 5, true) + Math.random() * 0.2;
        if (s < bestScore){ bestScore = s; best = m; }
      }
      hounds[best.k] = best.to;
      busy = false;
      if (!foxMoves(fox, hounds).length){ finish(false); return; }
      status.textContent = 'Your move.';
      render();
    }, 420);
  }
  function tap(i){
    if (busy || done) return;
    if (!foxMoves(fox, hounds).includes(i)) return;
    fox = i;
    render();
    if (foxWins(fox, hounds)){ finish(true); return; }
    houndTurn();
  }
  function newRound(){ fox = 60; hounds = [1, 3, 5, 7]; done = false; nextB.hidden = true; status.textContent = 'Your move.'; render(); }
  api.on(nextB, 'click', newRound);
  render();
  return () => clearTimeout(t);
}

/* ---------- Hex ---------- */
function hexGame(stage, api){
  const N = 9, R = 20, two = api.two;
  const W = Math.round(R * 1.75 * N + R * 0.875 * (N - 1) + R * 2);
  const {status, nextB, board} = streakShell(stage, 'hexboard', 'You are blue. Join the left and right sides.');
  board.classList.add('canvas-board');
  const H = Math.round(R * 1.5 * N + R);
  const [c, g] = makeCanvas(board, W, H);
  const col = {bg:tok('--board'), cell:tok('--cell'), p1:tok('--blue'), p2:tok('--tomato'), ink:tok('--ink'), edge:tok('--edge')};
  let cells = Array(N * N).fill(0), turn = 1, busy = false, done = false, streak = 0, wins = [0, 0], t = null;
  const centre = i => {
    const r = Math.floor(i / N), q = i % N;
    return [R * 1.1 + q * R * 1.75 + r * R * 0.875, R * 1.1 + r * R * 1.5];
  };
  const NB = [[0, -1], [0, 1], [-1, 0], [-1, 1], [1, -1], [1, 0]];
  const neighbours = i => {
    const r = Math.floor(i / N), q = i % N;
    return NB.map(([dr, dq]) => [r + dr, q + dq]).filter(([y, x]) => y >= 0 && x >= 0 && y < N && x < N).map(([y, x]) => y * N + x);
  };
  function connected(p){
    const starts = [...Array(N).keys()].map(k => p === 1 ? k * N : k).filter(i => cells[i] === p);
    const seen = new Set(starts), st = [...starts];
    while (st.length){
      const i = st.pop();
      const r = Math.floor(i / N), q = i % N;
      if (p === 1 && q === N - 1) return true;
      if (p === 2 && r === N - 1) return true;
      neighbours(i).forEach(j => { if (cells[j] === p && !seen.has(j)){ seen.add(j); st.push(j); } });
    }
    return false;
  }
  function pathCost(p){
    const dist = Array(N * N).fill(Infinity), q = [];
    for (let k = 0; k < N; k++){
      const i = p === 1 ? k * N : k;
      if (cells[i] === 3 - p) continue;
      dist[i] = cells[i] === p ? 0 : 1;
      q.push(i);
    }
    q.sort((a, b) => dist[a] - dist[b]);
    const seen = new Set();
    while (q.length){
      q.sort((a, b) => dist[a] - dist[b]);
      const i = q.shift();
      if (seen.has(i)) continue;
      seen.add(i);
      for (const j of neighbours(i)){
        if (cells[j] === 3 - p) continue;
        const cost = dist[i] + (cells[j] === p ? 0 : 1);
        if (cost < dist[j]){ dist[j] = cost; q.push(j); }
      }
    }
    let best = Infinity;
    for (let k = 0; k < N; k++){
      const i = p === 1 ? k * N + N - 1 : (N - 1) * N + k;
      best = Math.min(best, dist[i]);
    }
    return best;
  }
  function cpuPick(){
    let best = -1, bestScore = -Infinity;
    for (let i = 0; i < N * N; i++){
      if (cells[i]) continue;
      cells[i] = 2;
      const s = pathCost(1) * 1.1 - pathCost(2) + Math.random() * 0.4;
      cells[i] = 0;
      if (s > bestScore){ bestScore = s; best = i; }
    }
    return best;
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    for (let i = 0; i < N * N; i++){
      const [x, y] = centre(i);
      g.beginPath();
      for (let k = 0; k < 6; k++){
        const a = Math.PI / 180 * (60 * k - 30);
        const px = x + Math.cos(a) * (R - 1.5), py = y + Math.sin(a) * (R - 1.5);
        k ? g.lineTo(px, py) : g.moveTo(px, py);
      }
      g.closePath();
      g.fillStyle = cells[i] === 1 ? col.p1 : cells[i] === 2 ? col.p2 : col.cell;
      g.fill();
      g.strokeStyle = col.edge; g.lineWidth = 2; g.stroke();
    }
    g.fillStyle = col.p1; g.fillRect(0, 0, 6, H); g.fillRect(W - 6, 0, 6, H);
    g.fillStyle = col.p2; g.fillRect(0, 0, W, 6); g.fillRect(0, H - 6, W, 6);
    api.score(two ? `${wins[0]}–${wins[1]}` : streak);
  }
  function finish(p){
    done = true; busy = false;
    if (two){
      wins[p - 1]++;
      status.textContent = `Player ${p} joins their sides and wins!`;
      draw(); nextB.hidden = false; nextB.focus();
      return;
    }
    if (p === 1){ streak++; status.textContent = 'You joined your sides. You win!'; draw(); nextB.hidden = false; nextB.focus(); }
    else { status.textContent = 'The computer got across first.'; draw(); api.over(streak); }
  }
  function play(i){
    if (busy || done || cells[i]) return;
    cells[i] = turn;
    draw();
    if (connected(turn)){ finish(turn); return; }
    if (two){ turn = 3 - turn; status.textContent = `Player ${turn}, your move.`; draw(); return; }
    busy = true; status.textContent = 'Computer is thinking…'; draw();
    t = setTimeout(() => {
      const j = cpuPick();
      if (j >= 0) cells[j] = 2;
      busy = false;
      draw();
      if (connected(2)){ finish(2); return; }
      status.textContent = 'Your move.';
      draw();
    }, 380);
  }
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    const p = toLocal(c, e);
    let best = -1, bestD = R;
    for (let i = 0; i < N * N; i++){
      const [x, y] = centre(i);
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestD){ bestD = d; best = i; }
    }
    if (best >= 0) play(best);
  });
  api.on(nextB, 'click', () => { cells = Array(N * N).fill(0); turn = 1; done = false; nextB.hidden = true; status.textContent = 'Your move.'; draw(); });
  draw();
  return () => clearTimeout(t);
}

/* ---------- Word Grid ---------- */
function wordGridGame(stage, api){
  const N = 4, LEN = 90;
  const pool = GUESS_WORDS.filter(w => w.length >= 4 && w.length <= 7);
  const letters = Array(N * N).fill('');
  const planted = [];
  const nbrs = i => {
    const r = Math.floor(i / N), q = i % N, out = [];
    for (let dr = -1; dr <= 1; dr++) for (let dq = -1; dq <= 1; dq++){
      if (!dr && !dq) continue;
      const y = r + dr, x = q + dq;
      if (y >= 0 && x >= 0 && y < N && x < N) out.push(y * N + x);
    }
    return out;
  };
  function plant(word){
    for (let tries = 0; tries < 120; tries++){
      const path = [rand(N * N)];
      let ok = true;
      for (let k = 1; k < word.length; k++){
        const opts = shuffle(nbrs(path[path.length - 1])).filter(j => !path.includes(j) && (!letters[j] || letters[j] === word[k]));
        if (!opts.length){ ok = false; break; }
        path.push(opts[0]);
      }
      if (!ok) continue;
      if (path.some((j, k) => letters[j] && letters[j] !== word[k])) continue;
      path.forEach((j, k) => { letters[j] = word[k]; });
      planted.push({word, path});
      return true;
    }
    return false;
  }
  shuffle(pool.slice()).slice(0, 30).forEach(w => { if (planted.length < 6) plant(w); });
  const ALPHA = 'aaabcdeeefghiilmnnooprssttu';
  letters.forEach((v, i) => { if (!v) letters[i] = ALPHA[rand(ALPHA.length)]; });
  const {wrap, startB, timeL} = timedShell(stage, LEN);
  const board = el('div', 'board wordgrid');
  const current = el('p', 'quiz-q wg-current', '—');
  const found = el('div', 'word-list');
  wrap.append(current, board, found);
  let chain = [], score = 0, playing = false, clock = null;
  const got = new Set();
  const cells = letters.map((ch, i) => {
    const b = btn('hcell', ch.toUpperCase());
    b.disabled = true;
    board.appendChild(b);
    api.on(b, 'click', () => pick(i));
    return b;
  });
  function render(){
    cells.forEach((b, i) => {
      b.classList.toggle('pick', chain.includes(i));
      b.disabled = !playing;
    });
    current.textContent = chain.map(i => letters[i]).join('').toUpperCase() || '—';
    found.replaceChildren(...planted.map(p => el('span', 'word-chip' + (got.has(p.word) ? ' got' : ''), got.has(p.word) ? p.word : '•'.repeat(p.word.length))));
  }
  function pick(i){
    if (!playing) return;
    if (chain.length && chain[chain.length - 1] === i){ submit(); return; }
    if (chain.includes(i)){ chain = chain.slice(0, chain.indexOf(i) + 1); render(); return; }
    if (chain.length && !nbrs(chain[chain.length - 1]).includes(i)){ chain = [i]; render(); return; }
    chain.push(i); render();
  }
  function submit(){
    const word = chain.map(i => letters[i]).join('');
    const hit = planted.find(p => p.word === word && !got.has(word));
    if (hit){ got.add(word); score++; api.score(score); }
    chain = []; render();
    if (got.size === planted.length){ end(true); }
  }
  function end(won){
    playing = false; clearInterval(clock);
    render();
    api.over(score, {won, title: won ? 'Every word found' : "Time's up"});
  }
  api.on(startB, 'click', () => { startB.disabled = true; playing = true; render(); clock = runClock(LEN, timeL, () => end(false)); });
  api.on(window, 'keydown', e => { if (e.code === 'Enter'){ e.preventDefault(); submit(); } });
  render(); api.score(0);
  return () => clearInterval(clock);
}

/* ---------- Quick Count ---------- */
function countGame(stage, api){
  const W = 400, H = 300;
  const wrap = el('div', 'panel'), tools = el('div', 'tools');
  const startB = btn('btn small primary', 'Start');
  const livesEl = el('span', null, 'Lives ♥♥♥');
  tools.append(startB, livesEl);
  wrap.appendChild(tools); stage.appendChild(wrap);
  const [c, g] = makeCanvas(wrap, W, H);
  const answers = el('div', 'answers');
  const status = el('p', 'help', 'Count the dots before they vanish.');
  status.setAttribute('aria-live', 'polite');
  wrap.append(answers, status);
  const col = {bg:tok('--cell'), dot:tok('--blue'), ink:tok('--ink'), card:tok('--card')};
  let count = 0, lives = 3, round = 0, phase = 'idle', dots = [], opts = [];
  const timers = [];
  const btns = [...Array(4)].map(() => { const b = btn('ans', '?'); b.disabled = true; answers.appendChild(b); api.on(b, 'click', () => choose(b)); return b; });
  function draw(show){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    if (show){
      g.fillStyle = col.dot;
      dots.forEach(d => { g.beginPath(); g.arc(d.x, d.y, 9, 0, Math.PI * 2); g.fill(); });
    } else {
      g.fillStyle = col.ink; g.font = `34px ${DISPLAY}`; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(phase === 'idle' ? 'Ready?' : 'How many?', W / 2, H / 2);
    }
  }
  function round_(){
    count = 5 + rand(9 + round * 2);
    dots = [];
    for (let i = 0; i < count; i++){
      let x, y, tries = 0;
      do { x = 24 + Math.random() * (W - 48); y = 24 + Math.random() * (H - 48); tries++; }
      while (tries < 30 && dots.some(d => Math.hypot(d.x - x, d.y - y) < 24));
      dots.push({x, y});
    }
    phase = 'show'; draw(true);
    status.textContent = 'Count them…';
    btns.forEach(b => { b.disabled = true; b.className = 'ans'; });
    timers.push(setTimeout(() => {
      phase = 'answer'; draw(false);
      const set = new Set([count]);
      while (set.size < 4){ const d = count + (rand(2) ? 1 : -1) * (1 + rand(3)); if (d > 0) set.add(d); }
      opts = shuffle([...set]);
      btns.forEach((b, i) => { b.textContent = opts[i]; b.dataset.v = opts[i]; b.disabled = false; });
      status.textContent = 'How many were there?';
    }, Math.max(450, 1100 - round * 45)));
  }
  function choose(b){
    if (phase !== 'answer') return;
    phase = 'wait';
    btns.forEach(x => { x.disabled = true; });
    const ok = +b.dataset.v === count;
    b.classList.add(ok ? 'right' : 'wrong');
    if (!ok){
      btns.find(x => +x.dataset.v === count).classList.add('right');
      lives--;
      livesEl.textContent = 'Lives ' + '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(3 - Math.max(0, lives));
      status.textContent = `There were ${count}.`;
      if (lives <= 0){ timers.push(setTimeout(() => api.over(round), 1200)); return; }
    } else {
      round++; api.score(round);
      status.textContent = 'Correct!';
    }
    timers.push(setTimeout(round_, 1200));
  }
  api.on(startB, 'click', () => { startB.disabled = true; round_(); });
  draw(false); api.score(0);
  return () => timers.forEach(clearTimeout);
}

/* ---------- FreeCell ---------- */
function freecellGame(stage, api){
  const wrap = el('div', 'table klondike');
  const top = el('div', 'kl-top');
  const freeBoxes = [0, 1, 2, 3].map(() => el('div'));
  const foundBoxes = [0, 1, 2, 3].map(() => el('div'));
  top.append(...freeBoxes, el('div', 'kl-gap'), ...foundBoxes);
  const cols = el('div', 'kl-cols');
  const status = el('p', 'tools', 'Four free cells, four home piles. Columns build down in alternating colours.');
  status.setAttribute('aria-live', 'polite');
  wrap.append(top, cols, status); stage.appendChild(wrap);
  const deck = newDeck();
  const cells = [null, null, null, null];
  const found = [[], [], [], []];
  const tableau = [...Array(8)].map((_, i) => deck.splice(0, i < 4 ? 7 : 6));
  let sel = null, home = 0, over = false;
  const isRed = card => card.s === '♥' || card.s === '♦';
  const canStack = (card, onto) => !onto || (isRed(card) !== isRed(onto) && card.r === onto.r - 1);
  const canFound = (card, f) => found[f].length ? (found[f][found[f].length - 1].s === card.s && card.r === found[f][found[f].length - 1].r + 1) : card.r === 1;
  const maxMove = target => {
    const freeCells = cells.filter(x => !x).length;
    const emptyCols = tableau.filter((p, i) => !p.length && i !== target).length;
    return (freeCells + 1) * Math.pow(2, emptyCols);
  };
  function runLength(pile){
    let n = 1;
    for (let i = pile.length - 1; i > 0; i--){
      const a = pile[i], b = pile[i - 1];
      if (isRed(a) !== isRed(b) && b.r === a.r + 1) n++; else break;
    }
    return n;
  }
  function toFound(card, remove){
    for (let f = 0; f < 4; f++){
      if (!canFound(card, f)) continue;
      found[f].push(card); remove(); home++; api.score(home);
      if (home === 52){ over = true; render(); api.over(home, {won:true, title:'FreeCell solved'}); return true; }
      return true;
    }
    return false;
  }
  function pick(where, i, k){
    if (over) return;
    if (where === 'free'){
      if (sel){ drop(where, i); return; }
      if (cells[i]) sel = {where:'free', i};
      render(); return;
    }
    if (where === 'found'){ if (sel) drop('found', i); return; }
    const pile = tableau[i];
    if (!pile.length){ if (sel) drop('tab', i); else render(); return; }
    if (k === undefined) k = pile.length - 1;
    if (sel && sel.where === 'tab' && sel.i === i && sel.k === k){ sel = null; render(); return; }
    if (sel && k === pile.length - 1 && drop('tab', i)) return;
    const depth = pile.length - k;
    if (depth > runLength(pile)){ status.textContent = 'Those cards are not in a run.'; render(); return; }
    sel = {where:'tab', i, k};
    render();
  }
  function drop(where, i){
    if (!sel) return false;
    const moving = sel.where === 'free' ? [cells[sel.i]] : tableau[sel.i].slice(sel.k);
    const takeFrom = () => {
      if (sel.where === 'free') cells[sel.i] = null;
      else tableau[sel.i].splice(sel.k);
    };
    if (where === 'found'){
      if (moving.length !== 1 || !canFound(moving[0], i)){ status.textContent = 'That card cannot go home yet.'; sel = null; render(); return false; }
      found[i].push(moving[0]); takeFrom(); home++; api.score(home); sel = null;
      if (home === 52){ over = true; render(); api.over(home, {won:true, title:'FreeCell solved'}); return true; }
      render(); return true;
    }
    if (where === 'free'){
      if (moving.length !== 1 || cells[i]){ status.textContent = 'A free cell holds one card.'; sel = null; render(); return false; }
      cells[i] = moving[0]; takeFrom(); sel = null; render(); return true;
    }
    const pile = tableau[i];
    const onto = pile.length ? pile[pile.length - 1] : null;
    if (!canStack(moving[0], onto)){ status.textContent = 'That is not a legal move.'; sel = null; render(); return false; }
    if (moving.length > maxMove(i)){ status.textContent = `You can only move ${maxMove(i)} card${maxMove(i) === 1 ? '' : 's'} at once with the cells you have free.`; sel = null; render(); return false; }
    takeFrom();
    moving.forEach(card => pile.push(card));
    sel = null; status.textContent = ''; render();
    return true;
  }
  function render(){
    cells.forEach((card, i) => {
      const b = card ? cardEl(card, {button:true}) : btn('pcard ghost', '');
      if (sel && sel.where === 'free' && sel.i === i) b.classList.add('picked');
      b.disabled = over;
      b.setAttribute('aria-label', `Free cell ${i + 1}: ${card ? cardName(card) : 'empty'}`);
      b.addEventListener('click', () => pick('free', i));
      freeBoxes[i].replaceChildren(b);
    });
    found.forEach((pile, f) => {
      const b = pile.length ? cardEl(pile[pile.length - 1], {button:true}) : btn('pcard ghost', SUITS[f]);
      b.disabled = over;
      b.setAttribute('aria-label', `Home ${SUIT_NAME[SUITS[f]]}: ${pile.length ? cardName(pile[pile.length - 1]) : 'empty'}`);
      b.addEventListener('click', () => pick('found', f));
      foundBoxes[f].replaceChildren(b);
    });
    cols.replaceChildren(...tableau.map((pile, i) => {
      const d = el('div', 'kl-col');
      if (!pile.length){
        const gap = btn('pcard ghost', '');
        gap.disabled = over;
        gap.setAttribute('aria-label', `Empty column ${i + 1}`);
        gap.addEventListener('click', () => pick('tab', i));
        d.appendChild(gap);
      }
      pile.forEach((card, k) => {
        const b = cardEl(card, {button:true});
        if (sel && sel.where === 'tab' && sel.i === i && k >= sel.k) b.classList.add('picked');
        b.disabled = over;
        b.setAttribute('aria-label', `Column ${i + 1}: ${cardName(card)}`);
        b.addEventListener('click', () => pick('tab', i, k));
        d.appendChild(b);
      });
      return d;
    }));
    api.score(home);
  }
  api.on(window, 'keydown', e => {
    if (e.code !== 'KeyA') return;
    e.preventDefault();
    let moved = true;
    while (moved && !over){
      moved = false;
      for (let i = 0; i < 4 && !moved; i++) if (cells[i] && toFound(cells[i], () => { cells[i] = null; })) moved = true;
      for (let i = 0; i < 8 && !moved; i++){
        const pile = tableau[i];
        if (pile.length && toFound(pile[pile.length - 1], () => pile.pop())) moved = true;
      }
    }
    render();
  });
  render(); api.score(0);
}

/* ---------- Tri Peaks ---------- */
function triPeaksGame(stage, api){
  const wrap = el('div', 'table');
  const status = el('p', 'tools', 'Take cards one rank above or below the one on the pile.');
  status.setAttribute('aria-live', 'polite');
  const peaks = el('div', 'peaks');
  const foot = el('div', 'golf-foot');
  const stockBox = el('div', 'stock'), pileBox = el('div');
  foot.append(stockBox, pileBox);
  wrap.append(status, peaks, foot); stage.appendChild(wrap);
  const deck = newDeck();
  const ROWS = [3, 6, 9, 10];
  const layout = ROWS.map(n => [...Array(n)].map(() => deck.pop()));
  let stock = deck, pileTop = null, cleared = 0, streakRun = 0, score = 0, over = false;
  function covers(r, i){
    if (r === 3) return [];
    if (r === 2) return [[3, i], [3, i + 1]];
    if (r === 1) return [[2, i + Math.floor(i / 2)], [2, i + Math.floor(i / 2) + 1]];
    return [[1, i * 2], [1, i * 2 + 1]];
  }
  const free = (r, i) => layout[r][i] && covers(r, i).every(([R, I]) => !layout[R] || !layout[R][I]);
  const adj = card => pileTop && (Math.abs(card.r - pileTop.r) === 1 || Math.abs(card.r - pileTop.r) === 12);
  function anyMove(){
    for (let r = 0; r < 4; r++) for (let i = 0; i < layout[r].length; i++) if (free(r, i) && adj(layout[r][i])) return true;
    return stock.length > 0;
  }
  function finish(){
    over = true; render();
    const won = cleared === 28;
    status.textContent = won ? 'You cleared all three peaks!' : `No moves left. You cleared ${cleared} of 28.`;
    api.over(score, {won, title: won ? 'Peaks cleared' : 'No moves left'});
  }
  function take(r, i){
    if (over || !free(r, i) || !adj(layout[r][i])) return;
    pileTop = layout[r][i];
    layout[r][i] = null;
    cleared++; streakRun++;
    score += streakRun * 10;
    api.score(score);
    render();
    if (cleared === 28){ finish(); return; }
    if (!anyMove()) finish();
  }
  function drawCard(){
    if (over || !stock.length) return;
    pileTop = stock.pop();
    streakRun = 0;
    render();
    if (!anyMove()) finish();
  }
  function render(){
    peaks.replaceChildren(...layout.map((row, r) => {
      const line = el('div', 'peak-row peak-row-' + r);
      row.forEach((card, i) => {
        if (!card){ const gap = el('div', 'pcard ghost'); gap.setAttribute('aria-hidden', 'true'); line.appendChild(gap); return; }
        const open = free(r, i);
        const b = cardEl(card, {button:true});
        if (!open) b.classList.add('dim');
        if (open && adj(card) && !over) b.classList.add('can');
        b.disabled = over;
        b.setAttribute('aria-label', `${cardName(card)}${open ? (adj(card) ? ', playable' : '') : ', still covered'}`);
        b.addEventListener('click', () => take(r, i));
        line.appendChild(b);
      });
      return line;
    }));
    const sb = stock.length ? cardEl(null, {button:true}) : el('div', 'pcard ghost');
    if (stock.length){
      sb.disabled = over;
      sb.setAttribute('aria-label', `Turn a card, ${stock.length} left`);
      sb.addEventListener('click', drawCard);
    }
    stockBox.replaceChildren(sb, el('span', 'stock-count', `${stock.length} left`));
    pileBox.replaceChildren(pileTop ? cardEl(pileTop) : el('div', 'pcard ghost'));
  }
  pileTop = stock.pop();
  render(); api.score(0);
  api.on(window, 'keydown', e => { if (e.code === 'KeyD'){ e.preventDefault(); drawCard(); } });
}

/* ---------- Lane Racer ---------- */
function racerGame(stage, api){
  const W = 320, H = 480, LANES = 4, LW = 64, ROAD = LANES * LW, X0 = (W - ROAD) / 2;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {grass:tok('--mint'), road:'#4A4460', line:'#F6F1FF', ink:tok('--ink'), card:tok('--card'), me:tok('--tomato'),
               cars:[tok('--blue'), tok('--sun'), tok('--grape'), '#FFFFFF']};
  const me = {lane:1, x:0, y:H - 90, w:38, h:64};
  let traffic = [], speed = 4.2, dist = 0, score = 0, state = 'ready', raf, last = 0, gap = 200;
  me.x = X0 + me.lane * LW + LW / 2;
  const laneX = l => X0 + l * LW + LW / 2;
  function spawn(){
    const lanes = shuffle([...Array(LANES).keys()]).slice(0, 1 + rand(2));
    lanes.forEach(l => traffic.push({lane:l, y:-90 - Math.random() * 60, vy:speed * (0.35 + Math.random() * 0.25), c:rand(4)}));
    gap = 150 + Math.random() * 120;
  }
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    if (state === 'play'){
      speed = Math.min(12, 4.2 + dist / 2600);
      dist += speed * k;
      score = Math.floor(dist / 30); api.score(score);
      me.x += (laneX(me.lane) - me.x) * Math.min(1, 0.22 * k);
      gap -= speed * k;
      if (gap <= 0) spawn();
      for (const o of traffic) o.y += (speed - o.vy) * k;
      traffic = traffic.filter(o => o.y < H + 100);
      const hit = traffic.some(o => Math.abs(laneX(o.lane) - me.x) < 34 && o.y + 64 > me.y && o.y < me.y + me.h);
      if (hit){ state = 'over'; draw(); api.over(score); return; }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function car(x, y, colour, mine){
    g.fillStyle = colour;
    rr(g, x - 19, y, 38, 64, 9); g.fill();
    g.fillStyle = 'rgba(255,255,255,.55)';
    rr(g, x - 13, y + (mine ? 8 : 14), 26, 18, 5); g.fill();
    g.fillStyle = '#231B4E';
    g.fillRect(x - 22, y + 10, 5, 14); g.fillRect(x + 17, y + 10, 5, 14);
    g.fillRect(x - 22, y + 42, 5, 14); g.fillRect(x + 17, y + 42, 5, 14);
  }
  function draw(){
    g.fillStyle = col.grass; g.fillRect(0, 0, W, H);
    g.fillStyle = col.road; g.fillRect(X0, 0, ROAD, H);
    g.fillStyle = col.line;
    for (let l = 1; l < LANES; l++){
      const x = X0 + l * LW - 2;
      for (let y = -((dist * 1) % 60); y < H; y += 60) g.fillRect(x, y, 4, 30);
    }
    g.fillRect(X0 - 5, 0, 5, H); g.fillRect(X0 + ROAD, 0, 5, H);
    traffic.forEach(o => car(laneX(o.lane), o.y, col.cars[o.c]));
    car(me.x, me.y, col.me, true);
    g.fillStyle = col.ink; g.font = `30px ${DISPLAY}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(String(score), 10, 10);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Arrows or swipe to change lane', col.ink, col.card);
  }
  function move(d){
    if (state === 'ready') state = 'play';
    if (state !== 'play') return;
    me.lane = Math.max(0, Math.min(LANES - 1, me.lane + d));
  }
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ e.preventDefault(); if (!e.repeat) move(-1); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ e.preventDefault(); if (!e.repeat) move(1); }
    if (e.code === 'Space'){ e.preventDefault(); if (state === 'ready') state = 'play'; }
  });
  api.swipe(c, dx => { if (dx) move(dx); });
  api.on(c, 'pointerdown', e => { e.preventDefault(); const p = toLocal(c, e); if (state === 'ready'){ state = 'play'; return; } move(p.x < me.x ? -1 : 1); });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Chopper Rescue ---------- */
function chopperGame(stage, api){
  const W = 480, H = 320, GY = 280;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {sky:tok('--cell'), ground:tok('--board'), ink:tok('--ink'), card:tok('--card'), heli:tok('--tomato'), pad:tok('--mint'), person:tok('--blue')};
  const heli = {x:80, y:120, vx:0, vy:0};
  const pad = {x:40, w:70};
  let people = [], carrying = 0, saved = 0, lives = 3, state = 'ready', raf, last = 0, frame = 0, msg = '', ptr = null;
  const keys = {l:false, r:false, up:false};
  function spawn(){
    const x = 150 + Math.random() * (W - 200);
    people.push({x, y:GY - 12, wave:Math.random() * 6});
  }
  for (let i = 0; i < 2; i++) spawn();
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t; frame += k;
    if (state === 'play'){
      let up = keys.up, left = keys.l, right = keys.r;
      if (ptr){
        up = ptr.y < heli.y - 6;
        left = ptr.x < heli.x - 14;
        right = ptr.x > heli.x + 14;
      }
      heli.vy += (up ? -0.34 : 0.2) * k;
      if (left) heli.vx -= 0.22 * k;
      if (right) heli.vx += 0.22 * k;
      heli.vx *= Math.pow(0.97, k);
      heli.vx = Math.max(-5, Math.min(5, heli.vx));
      heli.vy = Math.max(-5, Math.min(6, heli.vy));
      heli.x += heli.vx * k; heli.y += heli.vy * k;
      if (heli.x < 20){ heli.x = 20; heli.vx = 0; }
      if (heli.x > W - 20){ heli.x = W - 20; heli.vx = 0; }
      if (heli.y < 20){ heli.y = 20; heli.vy = 0; }
      if (heli.y > GY - 16){
        const onPad = heli.x > pad.x && heli.x < pad.x + pad.w;
        if (Math.abs(heli.vy) > 3.4 || (!onPad && Math.abs(heli.vy) > 2.4)){
          lives--; msg = 'Crashed!';
          if (lives <= 0){ state = 'over'; draw(); api.over(saved); return; }
          setTimeout(() => { msg = ''; }, 900);
          Object.assign(heli, {x:pad.x + pad.w / 2, y:GY - 17, vx:0, vy:0});
        } else {
          heli.y = GY - 16; heli.vy = 0;
          if (onPad && carrying){ saved += carrying; carrying = 0; api.score(saved); msg = 'Rescued!'; setTimeout(() => { msg = ''; }, 700); if (people.length < 4) spawn(); }
        }
      }
      if (carrying < 2){
        people.forEach(p => {
          if (!p.taken && Math.abs(p.x - heli.x) < 22 && heli.y > GY - 60){
            p.taken = true; carrying++; msg = 'Picked up!';
            setTimeout(() => { msg = ''; }, 600);
          }
        });
        people = people.filter(p => !p.taken);
        if (people.length < 2 && Math.random() < 0.01 * k) spawn();
      }
    }
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.sky; g.fillRect(0, 0, W, H);
    g.fillStyle = col.ground; g.fillRect(0, GY, W, H - GY);
    g.fillStyle = col.pad; rr(g, pad.x, GY - 6, pad.w, 10, 4); g.fill();
    g.fillStyle = '#fff'; g.font = `700 12px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('BASE', pad.x + pad.w / 2, GY - 1);
    people.forEach(p => {
      g.fillStyle = col.person;
      g.beginPath(); g.arc(p.x, p.y - 12, 5, 0, Math.PI * 2); g.fill();
      rr(g, p.x - 5, p.y - 8, 10, 14, 3); g.fill();
      const wave = Math.sin(frame * 0.2 + p.wave) * 4;
      g.strokeStyle = col.person; g.lineWidth = 3;
      g.beginPath(); g.moveTo(p.x + 4, p.y - 4); g.lineTo(p.x + 11, p.y - 12 + wave); g.stroke();
    });
    g.save(); g.translate(heli.x, heli.y); g.rotate(Math.max(-0.3, Math.min(0.3, heli.vx * 0.06)));
    g.fillStyle = col.heli;
    rr(g, -20, -8, 40, 17, 8); g.fill();
    g.fillRect(14, -4, 18, 5);
    g.fillRect(26, -12, 4, 12);
    g.fillStyle = '#231B4E';
    g.fillRect(-2, -14, 4, 7);
    const blade = Math.sin(frame * 0.9) * 22;
    g.fillRect(-22 + 0, -16, 44, 3);
    g.fillRect(blade - 2, -16, 6, 3);
    g.fillStyle = 'rgba(255,255,255,.6)';
    g.beginPath(); g.arc(-8, -1, 6, 0, Math.PI * 2); g.fill();
    g.fillStyle = col.person;
    for (let i = 0; i < carrying; i++){ g.beginPath(); g.arc(-6 + i * 12, 14, 5, 0, Math.PI * 2); g.fill(); }
    g.restore();
    g.fillStyle = col.ink; g.font = `700 14px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`Choppers ${'●'.repeat(Math.max(0, lives))} · carrying ${carrying}`, 10, 8);
    g.textBaseline = 'middle';
    if (msg) pill(g, W, H, msg, col.ink, col.card);
    else if (state === 'ready') pill(g, W, H, 'Up to hover, left and right to fly. Land gently.', col.ink, col.card);
  }
  const begin = () => { if (state === 'ready') state = 'play'; };
  api.on(window, 'keydown', e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space'){ keys.up = true; e.preventDefault(); begin(); }
    if (e.code === 'ArrowLeft' || e.code === 'KeyA'){ keys.l = true; e.preventDefault(); begin(); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD'){ keys.r = true; e.preventDefault(); begin(); }
  });
  api.on(window, 'keyup', e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.l = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.r = false;
  });
  api.on(c, 'pointerdown', e => { e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch {} ptr = toLocal(c, e); begin(); });
  api.on(c, 'pointermove', e => { if (ptr) ptr = toLocal(c, e); });
  api.on(c, 'pointerup', () => { ptr = null; });
  api.on(c, 'pointercancel', () => { ptr = null; });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Keepy Uppy ---------- */
function juggleGame(stage, api){
  const W = 360, H = 460;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {bg:tok('--cell'), ink:tok('--ink'), card:tok('--card'), ball:tok('--sun'), ground:tok('--mint'), edge:tok('--edge')};
  const GY = H - 30;
  let ball = {x:W / 2, y:120, vx:0, vy:0, r:24, spin:0}, score = 0, state = 'ready', raf, last = 0, pops = [], wind = 0;
  function tick(t){
    const k = last ? Math.min(2, (t - last) / 16.67) : 1; last = t;
    if (state === 'play'){
      wind += (Math.random() - 0.5) * 0.02 * k;
      wind = Math.max(-0.08, Math.min(0.08, wind));
      ball.vy += 0.3 * k;
      ball.vx += wind * k;
      ball.x += ball.vx * k; ball.y += ball.vy * k;
      ball.spin += ball.vx * 0.04 * k;
      if (ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx) * 0.8; }
      if (ball.x > W - ball.r){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx) * 0.8; }
      if (ball.y - ball.r < 0){ ball.y = ball.r; ball.vy = Math.abs(ball.vy) * 0.6; }
      if (ball.y + ball.r >= GY){ state = 'over'; draw(); api.over(score); return; }
    }
    pops.forEach(p => { p.t += k; });
    pops = pops.filter(p => p.t < 14);
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    g.fillStyle = col.ground; g.fillRect(0, GY, W, H - GY);
    g.save(); g.translate(ball.x, ball.y); g.rotate(ball.spin);
    g.fillStyle = col.ball; g.beginPath(); g.arc(0, 0, ball.r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = col.edge; g.lineWidth = 3;
    g.beginPath(); g.arc(0, 0, ball.r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = col.edge;
    for (let i = 0; i < 5; i++){
      const a = i / 5 * Math.PI * 2;
      g.beginPath(); g.arc(Math.cos(a) * ball.r * 0.55, Math.sin(a) * ball.r * 0.55, 4, 0, Math.PI * 2); g.fill();
    }
    g.restore();
    pops.forEach(p => {
      g.globalAlpha = 1 - p.t / 14; g.fillStyle = col.ink;
      g.font = `700 18px ${FONT}`; g.textAlign = 'center';
      g.fillText('+1', p.x, p.y - p.t * 2); g.globalAlpha = 1;
    });
    g.fillStyle = col.ink; g.font = `44px ${DISPLAY}`; g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(String(score), W / 2, 16);
    g.textBaseline = 'middle';
    g.font = `700 13px ${FONT}`;
    g.fillText(`wind ${wind > 0.01 ? '→' : wind < -0.01 ? '←' : '·'}`, W / 2, 74);
    if (state === 'ready') pill(g, W, H, 'Tap the ball to keep it up', col.ink, col.card);
  }
  function kick(p){
    if (state === 'ready'){ state = 'play'; ball.vy = -6; return; }
    if (state !== 'play') return;
    const dx = ball.x - p.x, dy = ball.y - p.y;
    const d = Math.hypot(dx, dy);
    if (d > ball.r + 26) return;
    const a = Math.atan2(dy - 6, dx);
    const power = 9 + Math.min(4, score * 0.05);
    ball.vx = Math.cos(a) * power * 0.7 + ball.vx * 0.2;
    ball.vy = -Math.abs(Math.sin(a) * power) - 5;
    score++; api.score(score);
    pops.push({x:ball.x, y:ball.y - ball.r, t:0});
  }
  api.on(c, 'pointerdown', e => { e.preventDefault(); kick(toLocal(c, e)); });
  api.on(window, 'keydown', e => {
    if (e.code === 'Space'){ e.preventDefault(); if (!e.repeat) kick({x:ball.x, y:ball.y + ball.r}); }
  });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Bug Squash ---------- */
function bugGame(stage, api){
  const W = 420, H = 380;
  const [c, g] = makeCanvas(stage, W, H);
  const col = {bg:tok('--cell'), ink:tok('--ink'), card:tok('--card'), bug:tok('--grape'), fast:tok('--tomato'), bee:tok('--sun')};
  let bugs = [], splats = [], score = 0, lives = 3, state = 'ready', raf, last = 0, elapsed = 0, acc = 0;
  function spawn(){
    const edge = rand(4);
    const x = edge === 0 ? -20 : edge === 1 ? W + 20 : Math.random() * W;
    const y = edge === 2 ? -20 : edge === 3 ? H + 20 : Math.random() * H;
    const kind = Math.random() < 0.15 ? 'bee' : Math.random() < 0.3 ? 'fast' : 'bug';
    const sp = (kind === 'fast' ? 2.4 : 1.3) + elapsed * 0.03;
    const a = Math.atan2(H / 2 - y + (Math.random() - 0.5) * 200, W / 2 - x + (Math.random() - 0.5) * 200);
    bugs.push({x, y, a, sp, kind, wig:Math.random() * 6, legs:0});
  }
  function tick(t){
    const dt = last ? Math.min(50, t - last) : 0; last = t;
    const k = dt / 16.67;
    if (state === 'play'){
      elapsed += dt / 1000; acc += dt;
      const every = Math.max(380, 1200 - elapsed * 22);
      while (acc >= every){ acc -= every; spawn(); }
      for (const b of bugs){
        b.a += Math.sin(elapsed * 2 + b.wig) * 0.03 * k;
        b.x += Math.cos(b.a) * b.sp * k;
        b.y += Math.sin(b.a) * b.sp * k;
        b.legs += 0.3 * k;
      }
      const gone = bugs.filter(b => b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40);
      gone.forEach(b => { if (b.kind !== 'bee') lives--; });
      bugs = bugs.filter(b => b.x >= -40 && b.x <= W + 40 && b.y >= -40 && b.y <= H + 40);
      if (lives <= 0){ state = 'over'; draw(); api.over(score); return; }
    }
    splats.forEach(s => { s.t += k; });
    splats = splats.filter(s => s.t < 40);
    draw();
    raf = requestAnimationFrame(tick);
  }
  function draw(){
    g.fillStyle = col.bg; g.fillRect(0, 0, W, H);
    splats.forEach(s => {
      g.globalAlpha = Math.max(0, 1 - s.t / 40); g.fillStyle = s.col;
      g.beginPath(); g.arc(s.x, s.y, 12, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
    });
    bugs.forEach(b => {
      g.save(); g.translate(b.x, b.y); g.rotate(b.a + Math.PI / 2);
      const cc = b.kind === 'bee' ? col.bee : b.kind === 'fast' ? col.fast : col.bug;
      g.strokeStyle = '#231B4E'; g.lineWidth = 2;
      for (let i = -1; i <= 1; i++){
        const wig = Math.sin(b.legs + i) * 3;
        g.beginPath(); g.moveTo(-6, i * 6); g.lineTo(-13, i * 6 + wig); g.stroke();
        g.beginPath(); g.moveTo(6, i * 6); g.lineTo(13, i * 6 - wig); g.stroke();
      }
      g.fillStyle = cc;
      g.beginPath(); g.ellipse(0, 0, 8, 12, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(0, -12, 6, 0, Math.PI * 2); g.fill();
      if (b.kind === 'bee'){ g.fillStyle = '#231B4E'; g.fillRect(-8, -4, 16, 3); g.fillRect(-8, 3, 16, 3); }
      g.restore();
    });
    g.fillStyle = col.ink; g.font = `700 15px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(`♥${'●'.repeat(Math.max(0, lives))}`, 10, 8);
    g.textBaseline = 'middle';
    if (state === 'ready') pill(g, W, H, 'Squash the bugs. Leave the bees alone.', col.ink, col.card);
  }
  api.on(window, 'keydown', e => { if (e.code === 'Space'){ e.preventDefault(); if (state === 'ready') state = 'play'; } });
  api.on(c, 'pointerdown', e => {
    e.preventDefault();
    if (state === 'ready'){ state = 'play'; return; }
    if (state !== 'play') return;
    const p = toLocal(c, e);
    for (let i = bugs.length - 1; i >= 0; i--){
      const b = bugs[i];
      if (Math.hypot(p.x - b.x, p.y - b.y) > 20) continue;
      if (b.kind === 'bee'){
        lives--;
        splats.push({x:b.x, y:b.y, t:0, col:col.bee});
        bugs.splice(i, 1);
        if (lives <= 0){ state = 'over'; api.over(score); }
        return;
      }
      score += b.kind === 'fast' ? 3 : 1; api.score(score);
      splats.push({x:b.x, y:b.y, t:0, col:b.kind === 'fast' ? col.fast : col.bug});
      bugs.splice(i, 1);
      return;
    }
  });
  api.score(0);
  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

/* ---------- Tents and Trees ---------- */
function tentsGame(stage, api){
  const N = 8;
  const wrap = el('div', 'panel'), info = el('p', 'tools');
  info.setAttribute('aria-live', 'polite');
  const board = el('div', 'board tents');
  wrap.append(info, board); stage.appendChild(wrap);
  let trees = new Set(), solTents = new Set(), rowN = [], colN = [];
  function build(){
    for (let attempt = 0; attempt < 300; attempt++){
      const tents = new Set(), tree = new Set();
      const order = shuffle([...Array(N * N).keys()]);
      for (const i of order){
        if (tents.size >= 10) break;
        const r = Math.floor(i / N), q = i % N;
        if (tree.has(i)) continue;
        let clash = false;
        for (let dr = -1; dr <= 1 && !clash; dr++) for (let dq = -1; dq <= 1; dq++){
          const y = r + dr, x = q + dq;
          if (y >= 0 && x >= 0 && y < N && x < N && tents.has(y * N + x)){ clash = true; break; }
        }
        if (clash) continue;
        const spots = shuffle([[1, 0], [-1, 0], [0, 1], [0, -1]])
          .map(([dq, dr]) => [r + dr, q + dq])
          .filter(([y, x]) => y >= 0 && x >= 0 && y < N && x < N)
          .map(([y, x]) => y * N + x)
          .filter(j => !tents.has(j) && !tree.has(j));
        if (!spots.length) continue;
        tents.add(i); tree.add(spots[0]);
      }
      if (tents.size < 8) continue;
      trees = tree; solTents = tents;
      rowN = [...Array(N)].map((_, r) => [...tents].filter(i => Math.floor(i / N) === r).length);
      colN = [...Array(N)].map((_, q) => [...tents].filter(i => i % N === q).length);
      return;
    }
  }
  build();
  const state = Array(N * N).fill(0);
  let secs = 0, done = false;
  const timer = setInterval(() => { if (!done){ secs++; api.score(secs); } }, 1000);
  board.appendChild(el('div'));
  const colEls = colN.map(n => el('div', 'tcount', String(n)));
  colEls.forEach(e => board.appendChild(e));
  const rowEls = [], cells = [];
  for (let r = 0; r < N; r++){
    const rc = el('div', 'tcount', String(rowN[r]));
    board.appendChild(rc); rowEls.push(rc);
    for (let q = 0; q < N; q++){
      const i = r * N + q;
      const b = btn('tcell' + (trees.has(i) ? ' tree' : ''));
      board.appendChild(b); cells.push(b);
      api.on(b, 'click', () => tap(i));
      api.on(b, 'contextmenu', e => { e.preventDefault(); if (!trees.has(i) && !done){ state[i] = state[i] === 2 ? 0 : 2; render(); } });
    }
  }
  function matched(tents){
    const list = [...tents], pair = {}, used = {};
    const tryFit = (t, seen) => {
      const r = Math.floor(t / N), q = t % N;
      for (const [dr, dq] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){
        const y = r + dr, x = q + dq, j = y * N + x;
        if (y < 0 || x < 0 || y >= N || x >= N || !trees.has(j) || seen.has(j)) continue;
        seen.add(j);
        if (pair[j] === undefined || tryFit(pair[j], seen)){ pair[j] = t; used[t] = j; return true; }
      }
      return false;
    };
    return list.every(t => tryFit(t, new Set()));
  }
  function render(){
    const tents = new Set(state.map((v, i) => v === 1 ? i : -1).filter(i => i >= 0));
    cells.forEach((b, i) => {
      b.className = 'tcell' + (trees.has(i) ? ' tree' : '') + (state[i] === 1 ? ' tent' : '') + (state[i] === 2 ? ' grass' : '');
      b.textContent = trees.has(i) ? '🌲' : state[i] === 1 ? '⛺' : state[i] === 2 ? '·' : '';
      b.setAttribute('aria-label', `Row ${Math.floor(i / N) + 1}, column ${i % N + 1}, ${trees.has(i) ? 'tree' : state[i] === 1 ? 'tent' : state[i] === 2 ? 'grass' : 'empty'}`);
    });
    rowEls.forEach((e, r) => e.classList.toggle('done', [...tents].filter(i => Math.floor(i / N) === r).length === rowN[r]));
    colEls.forEach((e, q) => e.classList.toggle('done', [...tents].filter(i => i % N === q).length === colN[q]));
    info.textContent = done ? `Camp set in ${mmss(secs)}!` : `${tents.size} of ${solTents.size} tents pitched. One tent next to each tree, and no two tents touching.`;
    return tents;
  }
  function tap(i){
    if (done || trees.has(i)) return;
    state[i] = state[i] === 1 ? 2 : state[i] === 2 ? 0 : 1;
    const tents = render();
    if (tents.size !== solTents.size) return;
    const counts = [...Array(N)].every((_, k) =>
      [...tents].filter(i2 => Math.floor(i2 / N) === k).length === rowN[k] &&
      [...tents].filter(i2 => i2 % N === k).length === colN[k]);
    if (!counts) return;
    const touching = [...tents].some(t => {
      const r = Math.floor(t / N), q = t % N;
      for (let dr = -1; dr <= 1; dr++) for (let dq = -1; dq <= 1; dq++){
        if (!dr && !dq) continue;
        const y = r + dr, x = q + dq;
        if (y >= 0 && x >= 0 && y < N && x < N && tents.has(y * N + x)) return true;
      }
      return false;
    });
    if (touching) return;
    if (!matched(tents)) return;
    done = true; clearInterval(timer); render();
    api.over(secs, {won:true, title:'Camp set'});
  }
  render(); api.score(0);
  return () => clearInterval(timer);
}

/* ---------- Magic Square ---------- */
function magicGame(stage, api){
  const wrap = el('div', 'panel'), info = el('p', 'tools');
  info.setAttribute('aria-live', 'polite');
  const board = el('div', 'board magic');
  const pad = el('div', 'numpad');
  wrap.append(info, board, pad); stage.appendChild(wrap);
  const vals = Array(9).fill(null);
  let sel = -1, secs = 0, done = false;
  const timer = setInterval(() => { if (!done){ secs++; api.score(secs); } }, 1000);
  const cells = vals.map((_, i) => { const b = btn('mcellsq'); board.appendChild(b); api.on(b, 'click', () => { sel = i; render(); }); return b; });
  for (let k = 1; k <= 9; k++){ const b = btn('btn small', String(k)); pad.appendChild(b); api.on(b, 'click', () => put(k)); }
  const eraseB = btn('btn small', 'Erase'); pad.appendChild(eraseB); api.on(eraseB, 'click', () => put(null));
  const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function render(){
    const bad = new Set();
    LINES.forEach(l => {
      if (l.some(i => vals[i] === null)) return;
      if (l.reduce((a, i) => a + vals[i], 0) !== 15) l.forEach(i => bad.add(i));
    });
    vals.forEach((v, i) => { if (v !== null && vals.filter(x => x === v).length > 1) bad.add(i); });
    cells.forEach((b, i) => {
      b.textContent = vals[i] === null ? '' : vals[i];

      b.setAttribute('aria-label', `Row ${Math.floor(i / 3) + 1}, column ${i % 3 + 1}, ${vals[i] === null ? 'empty' : vals[i]}`);
    });

    info.textContent = done ? `Solved in ${mmss(secs)}!` : `Use 1 to 9 once each so every row, column and diagonal adds to 15. Still to place: ${left.join(', ') || 'none'}`;
  }
  function put(v){
    if (done || sel < 0) return;
    if (v !== null && vals.includes(v)) vals[vals.indexOf(v)] = null;
    vals[sel] = v;
    render();
    if (vals.every(x => x !== null) && LINES.every(l => l.reduce((a, i) => a + vals[i], 0) === 15)){
      done = true; clearInterval(timer); render();
      api.over(secs, {won:true, title:'Magic square made'});
    }
